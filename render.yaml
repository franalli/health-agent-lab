# Render Blueprint — one web service: FastAPI serves the API and the static UI same-origin.
# Deploy: Render → New → Blueprint → connect this repo (it reads this file). The only required manual
# step is setting ANTHROPIC_API_KEY as a dashboard secret (below). For the local run, see the README.
#
# Runs on the FREE plan: no persistent disk, so SQLite lives on the container filesystem
# (HEALTH_DB_PATH unset → the code's default, backend/data/health.db) and is wiped whenever the
# instance cold-starts — Render spins a free service down after ~15 minutes idle. That is safe by
# construction rather than by luck: the lifespan runs init_db + seed-if-empty + auto-scan on startup
# (the build can't see the runtime filesystem either way), so every cold start self-heals its schema,
# the 15 training members, AND their observations. It is the SAME code path a local `make run` takes.
#
# The trade-off, stated plainly: live state does not survive a spin-down. Uploaded datasets, filed
# feedback, and promoted prompt_versions are all rebuilt from `training_data` on the next boot — a
# documented limitation of the free tier, not a failure mode. First request after an idle period pays
# a cold start (~30-60s) plus the sub-second re-seed.
services:
  - type: web
    name: health-intelligence
    runtime: python
    plan: free  # free has no disks and spins down when idle; see the durability upgrade at the bottom
    rootDir: backend                                    # pyproject.toml + uv.lock live here; build/start run here
    buildCommand: "pip install uv==0.11.14 && uv sync --frozen"  # uv pinned so the build stays reproducible
    startCommand: "uv run uvicorn api:app --host 0.0.0.0 --port $PORT"  # $PORT injected; ONE worker — free is 512 MB / 0.1 CPU shared, and two workers each loading the app risk an OOM kill mid-seed. The multi-worker design (WAL + per-request connections + idempotent writes + the cross-process flocks, §15) is unchanged and correct at any worker count; `make serve` still runs two to exercise it.
    healthCheckPath: /health  # served once the lifespan completes; the startup seed + auto-scan is sub-second (~0.3s for 15 members), so no cold-start health-check timeout
    # Python is pinned to 3.12 by the repo-root .python-version file: Render reads it from the repository
    # root and auto-selects the latest 3.12 patch. (The env-var PYTHON_VERSION method is NOT used — it
    # requires a fully-qualified patch, e.g. 3.12.7; the file form may omit it. Without a pin, new Render
    # services default to a much newer Python than this project's uv.lock was resolved against.)
    envVars:
      - key: ANTHROPIC_API_KEY                          # SECRET — set in the dashboard; sync:false keeps it out of the repo.
        sync: false                                     # Mode 1 runs without it; Mode 2 + the gate need it.
      - key: DATASET
        value: training_data
      # LANGSMITH_API_KEY is deliberately NOT declared: the /learn + eval trace sink is opt-in and a
      # no-op without the key (eval/llm_eval.is_enabled). To trace prod /learn runs, add it manually
      # as a dashboard secret — nothing else to change; the SDK ships but is never imported keyless.
      #
      # HEALTH_DB_PATH is deliberately NOT declared: unset, db.py defaults to backend/data/health.db on
      # the container FS. Setting it is the durability switch — see below.

# ---- Upgrading to durable storage --------------------------------------------------------------------
# To keep uploads, feedback, and promoted prompts across deploys and spin-downs, move to a paid plan
# with a disk (~$8/mo) — three additions, no code change:
#
#   plan: starter
#   envVars:
#     - key: HEALTH_DB_PATH
#       value: /data/health.db
#   disk:
#     name: health-data
#     mountPath: /data
#     sizeGB: 1
#
# The startup seed-if-empty still self-heals a FRESH disk, and leaves a non-empty one alone (the seed
# is if-empty; ingest is additive). Two consequences of durability worth knowing:
#   - An analysis.py/config.py change deployed over a durable DB needs a manual Scan (or /admin/reseed)
#     to refresh persisted observations — nothing re-derives them on deploy, by design. (Moot on free,
#     where every cold start re-seeds and re-scans from scratch.)
#   - A disk persists everything in the DB, but the dataset *folders* POST /members/upload writes (the
#     kept eval_set.jsonl / lab_panels.csv, for later `DATASET=<name> make eval`) still live under the
#     app dir. To persist those too, also set HEALTH_DATA_ROOT to a disk path (e.g. /data/datasets) AND
#     copy the shipped backend/data/training_data into it once — an empty relocated root has no
#     training_data for the startup seed to read, so the 15 members won't appear until it's present.
#
# NOTE when switching in either direction: the plan and the disk are ALSO dashboard state. Adding or
# removing the block here does not delete an existing disk or an already-set HEALTH_DB_PATH env var —
# do those in Settings → Disks / Environment, then sync the Blueprint.
