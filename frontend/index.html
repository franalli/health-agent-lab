    // transition detection from the PUBLIC escalations projection: a chat escalation that newly
    // appeared (or rose in level) this turn is the one loud moment. Re-sends the same day dedupe
    // server-side (no new row) → clean bubble, while the answer still renders in full (§4).
    const after = await refreshEscalations(id);
    if (after.ok && token === state.reqToken) {
      const showable = [];
      for (const e of state.activeEscalations) {
        const prev = before.get(e.escalation_id);
        const isNew = prev === undefined;
        const rose = prev !== undefined && escRank(e.level) > escRank(prev);
        const shown = state.transitionShown.get(e.escalation_id);
        if ((isNew || rose) && (shown === undefined || escRank(e.level) > escRank(shown))) showable.push(e);
      }
      if (showable.length) {
        // one loud takeover this turn, at the highest new level — but mark EVERY newly-appeared
        // escalation as shown, so a lower one riding the same turn isn't permanently denied its loud
        // moment (it was acknowledged here, not silently dropped) (#7).
        const top = showable.reduce((a, b) => (escRank(b.level) > escRank(a.level) ? b : a));
        turn.isTransition = true; turn.takeoverLevel = top.level;
        for (const e of showable) state.transitionShown.set(e.escalation_id, e.level);
        renderConversation();
      }
    }
    state.asking = false; updateAskDisabled();
  }

  // ---- control-panel route handlers -------------------------------------------------------------
  function withMember(fn) { if (state.currentMember) fn(state.currentMember); else renderReadout({ error: "No member selected." }); }

  async function readoutRoute(pathFn) {
    if (pathFn.length && !state.currentMember) return renderReadout({ error: "No member selected." });
    const path = pathFn(state.currentMember);
    if (state.readoutKey === path) { renderReadout("—"); return; } // second click on the same route → back to default
    const r = await api("GET", path, undefined, { what: `Loading ${path}` });
    renderReadout(r.data);
    state.readoutKey = path;
  }

  // Upload a dataset bundle (a .zip of a training_data-shaped folder holding one .json members file, one
  // .jsonl eval file, and one .csv panels file) as multipart to POST /members/upload, surface the
  // {members, results, ranges, member_ids, skipped} summary, and on success reload the picker onto the
  // last ingested member. A 422's structured detail.failures (each {file, row, field, detail}) is shown
  // as a readable per-row list here — the upload is the format check (ui-ux §2). Multipart can't go
  // through api() (which forces a JSON body), so this fetches directly; the browser sets the multipart
  // boundary Content-Type itself.
  async function onUploadFile(file) {
    const fd = new FormData();
    fd.append("file", file, file.name);
    let res, data;
    try { res = await fetch("/members/upload", { method: "POST", body: fd }); }
    catch (e) {
      showSysBanner("Uploading the bundle", { status: 0, data: { error: String(e) } }, () => onUploadFile(file));
      return renderReadout({ error: "Upload failed to reach the server", detail: String(e) });
    }
    const raw = await res.text();
    try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }
    // banner mirrors api()'s contract for this raw-fetch path: success clears, failure explains + acts
    // (409 name collision/ingest lock → retry or rename; 422 → the per-row detail lands in the readout below).
    if (res.ok) hideSysBanner();
    else showSysBanner("Uploading the bundle", { status: res.status, data });
    // A 422 carries {detail: {error, failures:[{file,row,field,detail}]}} — surface each failure at the
    // file+row it occurred, most legibly, rather than as raw JSON. (A plain-string detail falls through.)
    const fails = data && data.detail && Array.isArray(data.detail.failures) ? data.detail.failures : null;
    const fmt = (rows) => rows.map((f) => {
      const where = [f.file || "bundle", f.row != null ? `row ${f.row}` : null,
                     f.member_id ? `member ${f.member_id}` : null, f.field || null]
        .filter(Boolean).join(" · ");
      return `• ${where}: ${f.detail}`;
    }).join("\n");
    if (!res.ok && fails) {
      renderReadout(`Upload rejected — ${data.detail.error}:\n\n${fmt(fails)}`);
      return;
    }
    // Partial success: some member rows were skipped at ingest (buggy LATER rows) — surface them the same
    // legible way, above the summary, so a partial failure isn't buried in a JSON blob (the ask: always
    // surface the reason). A clean upload (no skips) shows the raw summary.
    const skipped = res.ok && data && Array.isArray(data.skipped) ? data.skipped : [];
    if (skipped.length) {
      renderReadout(`Ingested ${data.members} member(s); skipped ${skipped.length} malformed row(s):\n\n`
        + fmt(skipped) + `\n\n` + JSON.stringify(data, null, 2));
    } else {
      renderReadout(data);
    }
    const ids = data && data.member_ids;
    if (res.ok && ids && ids.length) await loadMembers(ids[ids.length - 1]);
  }

  // ---- Phase 7 control-panel handlers (Clinician feedback · Learning) ----------------------------
  async function runLearn() {
    renderReadout("Running /learn — rule-assembling a candidate prompt and gating it through the eval harness. This calls the real LLM and can take a minute…");
    const r = await api("POST", "/learn", undefined, { what: "Learn run" });
    renderReadout(r.data);  // {version, status, reason, report} — or a 409/503 detail (banner explains those)
  }

  // ---- /feedback form: the full Feedback surface (correction kinds + signal kinds), rendered into the
  // readout. The route's payload is dict[str, Any] (permissive) but db.py reads ONLY specific keys per
  // kind, so a wrong key is silently inert — this client encodes the real per-kind contract instead of
  // trusting the schema. Each kind declares which input it needs; a marker/finding target and a typed
  // payload are assembled deterministically, never free-form, so the POST can't no-op on a typo'd key.
  const FEEDBACK_KINDS = [
    { kind: "range_override", group: "Correction", target: "marker", payload: "range",
      hint: "Re-bound a marker. Set ref_low and/or ref_high (one-sided OK). Auto-scans on submit, so the flag change lands at once." },
    { kind: "suppress_marker", group: "Correction", target: "marker", payload: "none",
      hint: "Drop a marker entirely so the core never analyzes it. Inert against a panic floor (db.py). Auto-scans on submit." },
    { kind: "preference", group: "Correction", target: "none", payload: "text",
      hint: "A composer tone hint joined to the Mode-2 prompt — never a number or the escalation floor." },
    { kind: "helpful", group: "Signal", target: "finding", payload: "none", hint: "Positive signal on a finding. Advisory — recorded for audit; changes no prompt and does NOT feed /learn." },
    { kind: "incorrect", group: "Signal", target: "answer", payload: "correction",
      hint: "Correct a prior answer: pick the answered question, type the right answer. /learn folds {question, corrected_answer} in as a few-shot exemplar for the composer (architecture §58)." },
    { kind: "escalation_accept", group: "Signal", target: "finding", payload: "none", hint: "Confirm an escalation was warranted — the queue marks it acknowledged (kept listed, visibly triaged; Reset learning reverts). Advisory for learning: changes no prompt and does NOT feed /learn." },
    { kind: "escalation_reject", group: "Signal", target: "finding", payload: "reason",
      hint: "Mark an escalation as a false alarm and say why — the reason is stored on the audit trail (it never enters the composer prompt). Learnable: once it recurs, /learn toggles a softer-tone clause into the composer prompt." },
  ];

  async function feedbackForm() {
    if (!state.currentMember) return renderReadout({ error: "No member selected." });
    const m = state.currentMember;
    // Target options are sourced LIVE so the field is correct-by-construction, never open-ended: markers
    // from the member's trajectory (available pre-scan), findings from the current observations (a scan
    // must have run). A typed-in target matching nothing returns 200 but is silently inert on scan
    // (db._apply_overrides) — the dropdown removes that whole failure mode.
    const traj = await api("GET", `/members/${enc(m)}/trajectory`, undefined, { what: "Loading the marker list" });
    if (!traj.ok) return renderReadout(traj.data);  // surface the error, don't show an empty dropdown
    const markerOpts = (traj.data || []).map((t) => ({ value: t.marker, text: t.marker }));
    const findingOpts = [
      ...(state.observations || []).map((o) => ({ value: o.observation_id, text: `${o.title} — ${o.severity}` })),
      // A chat-driven (ask) escalation has NO observation row, so it never appears above — include those
      // observation-less escalations too, else escalation_accept/reject can't be filed on a chat escalation
      // from the UI at all. The escalation_id is a valid target: reject's target is audit-only (learn
      // counts by kind), and accept's acknowledged-overlay matches by escalation_id OR observation_id, so
      // both option kinds acknowledge; a SCAN escalation already appears via its observation (skip it).
      ...(state.activeEscalations || [])
        .filter((e) => !e.observation_id)
        .map((e) => ({ value: e.escalation_id, text: `chat escalation — ${e.level}` })),
    ];
    // 'incorrect' corrects an ANSWERED question. Each suggested prompt is a {question, answer} pair, loaded
    // on member-select (so no chat is needed first); selecting one auto-fills the question and the clinician
    // types only the corrected answer. That {question, corrected_answer} is the payload assemble_candidate()
    // turns into a few-shot exemplar (architecture §58) — the path that was non-functional when the form
    // sent no payload. Keep the rich objects (question/answer) in scope; the <option> carries only value.
    const answerOpts = (state.chips || []).map((sp) => ({
      // Key on response_id: it is UNIQUE per suggested answer, whereas a finding_id can repeat across
      // prompts that cite the same marker — and a duplicate value would make the by-value lookup auto-fill
      // the wrong question. It's an audit-only target (learn ignores a signal's target).
      value: sp.response?.metadata?.response_id || sp.prompt,
      text: sp.prompt,
      question: sp.prompt,
      answer: sp.response?.answer || "",
    }));
    const host = $("#cp-readout"); host.textContent = ""; host.classList.remove("is-empty"); state.readoutKey = null;
    const form = el("form", "cp-form"); form.setAttribute("autocomplete", "off");

    const sel = (label, opts, val) => {
      const wrap = el("div"); wrap.appendChild(el("label", null, label));
      const s = el("select");
      for (const o of opts) { const op = el("option", null, o.text); op.value = o.value; if (o.value === val) op.selected = true; s.appendChild(op); }
      wrap.appendChild(s); return { wrap, s };
    };
    const field = (label, node) => { const w = el("div"); w.appendChild(el("label", null, label)); w.appendChild(node); return w; };

    form.appendChild(el("div", "cp-form-hint", `Member: ${m}`));
    const kind = sel("Kind", FEEDBACK_KINDS.map((k) => ({ value: k.kind, text: `${k.kind} (${k.group})` })), "range_override");
    form.appendChild(kind.wrap);
    // Operator-panel feedback is always clinician-sourced (the panel is the clinician's surface; there is
    // no member-facing feedback path). 'member'/'system' stay valid model values for programmatic use, but
    // a member-sourced CORRECTION would be inert (db.resolve_overrides honors clinician/system only), so
    // offering them here would only invite a silent no-op — the source is fixed, not a field.

    // payload/target inputs, shown/hidden per kind. Target is a DROPDOWN (markers or findings per kind),
    // not a free-text box — a non-matching target can no longer be entered.
    const targetSel = el("select");
    const targetField = field("Target", targetSel);
    const setTargetOptions = (opts, placeholder) => {
      targetSel.textContent = "";
      const ph = el("option", null, placeholder); ph.value = ""; ph.disabled = true; ph.selected = true;
      targetSel.appendChild(ph);
      for (const o of opts) { const op = el("option", null, o.text); op.value = o.value; targetSel.appendChild(op); }
    };
    const refLow = el("input"); refLow.type = "number"; refLow.step = "any"; refLow.placeholder = "ref_low";
    const refHigh = el("input"); refHigh.type = "number"; refHigh.step = "any"; refHigh.placeholder = "ref_high";
    const rangeRow = el("div", "cp-form-row");
    rangeRow.appendChild(field("Ref low", refLow)); rangeRow.appendChild(field("Ref high", refHigh));
    const prefText = el("textarea"); prefText.placeholder = "preference hint (tone only — never numbers)";
    const prefField = field("Preference text", prefText);
    // 'incorrect' correction inputs: an auto-filled, read-only Question + the original answer for context,
    // and the one thing the clinician types — the corrected answer.
    const corrQ = el("input"); corrQ.disabled = true; corrQ.placeholder = "select an answered question above";
    const corrOrig = el("div", "cp-form-hint");
    const corrAnswer = el("textarea"); corrAnswer.placeholder = "the corrected answer (what the assistant should have said)";
    const corrField = el("div");
    corrField.appendChild(field("Question (auto-filled)", corrQ));
    corrField.appendChild(corrOrig);
    corrField.appendChild(field("Corrected answer", corrAnswer));
    // 'escalation_reject' descriptor: WHY this escalation is a false alarm. Required by the form (a bare
    // rejection carries no reviewable rationale) though the API keeps the payload optional for programmatic
    // use — /learn counts rejections by kind; the reason is audit text and never enters the prompt.
    const rejReason = el("textarea"); rejReason.placeholder = "why this is a false alarm (audit trail — never enters the prompt)";
    const rejField = field("Reason", rejReason);
    const hint = el("div", "cp-form-hint");
    const status = el("div", "cp-form-status");
    const submit = el("button", null, "Submit feedback"); submit.type = "submit";

    form.appendChild(targetField); form.appendChild(rangeRow); form.appendChild(prefField); form.appendChild(corrField); form.appendChild(rejField);
    form.appendChild(hint); form.appendChild(submit); form.appendChild(status);

    const optsFor = (t) => (t === "finding" ? findingOpts : t === "answer" ? answerOpts : markerOpts);
    const spec = () => FEEDBACK_KINDS.find((k) => k.kind === kind.s.value);
    function syncFields() {
      const k = spec();
      targetField.hidden = k.target === "none";
      if (k.target === "marker")
        setTargetOptions(markerOpts, markerOpts.length ? "Select a marker…" : "(this member has no markers)");
      else if (k.target === "finding")
        setTargetOptions(findingOpts, findingOpts.length ? "Select a finding…" : '(no findings or escalations yet — run "Scan" or ask a question)');
      else if (k.target === "answer")
        setTargetOptions(answerOpts, answerOpts.length ? "Select an answered question…" : "(no answers yet — ask a question or run a scan first)");
      rangeRow.hidden = k.payload !== "range";
      prefField.hidden = k.payload !== "text";
      corrField.hidden = k.payload !== "correction";
      rejField.hidden = k.payload !== "reason";
      hint.textContent = k.hint;
      status.textContent = ""; status.className = "cp-form-status";
      syncAnswerFill();
    }
    function syncAnswerFill() {  // auto-fill the read-only question + original answer from the picked answer
      const opt = answerOpts.find((o) => o.value === targetSel.value);
      corrQ.value = opt ? opt.question : "";
      corrOrig.textContent = opt ? `Current answer: ${opt.answer}` : "";
    }
    kind.s.addEventListener("change", syncFields);
    targetSel.addEventListener("change", syncAnswerFill);
    syncFields();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const k = spec();
      const target = targetSel.value;
      let payload = null;
      if (k.target !== "none" && !target) {
        const empty = { marker: "this member has no markers to target.",
          finding: 'no findings or escalations to signal on — run "Scan" or ask a question first.',
          answer: "no answers to correct yet — ask a question or run a scan first." };
        return setStatus(status, "err", optsFor(k.target).length === 0
          ? empty[k.target]
          : `select ${k.target === "answer" ? "an answer" : "a " + k.target} from the Target dropdown.`);
      }
      if (k.payload === "range") {
        const lo = refLow.value.trim(), hi = refHigh.value.trim();
        if (!lo && !hi) return setStatus(status, "err", "range_override needs at least one of ref_low / ref_high.");
        payload = {}; if (lo) payload.ref_low = Number(lo); if (hi) payload.ref_high = Number(hi);
      } else if (k.payload === "text") {
        const t = prefText.value.trim();
        if (!t) return setStatus(status, "err", "preference needs some text.");
        payload = { text: t };
      } else if (k.payload === "correction") {
        const opt = answerOpts.find((o) => o.value === target);  // target is set (passed the check above)
        const corrected = corrAnswer.value.trim();
        if (!corrected) return setStatus(status, "err", "type the corrected answer.");
        payload = { question: opt.question, corrected_answer: corrected };  // → assemble_candidate few-shot exemplar
      } else if (k.payload === "reason") {
        const t = rejReason.value.trim();
        if (!t) return setStatus(status, "err", "escalation_reject needs a reason — say why the escalation is a false alarm.");
        payload = { reason: t };  // audit descriptor (learn._screen_reject_reason bounds it; never prompt text)
      }
      const fb = { kind: k.kind, target: k.target === "none" ? null : target, payload, source: "clinician" };
      submit.disabled = true; setStatus(status, "", "Submitting…");
      const r = await api("POST", `/members/${enc(m)}/feedback`, fb, { what: "Submitting feedback" });
      submit.disabled = false;
      if (r.ok) {
        // Effect + call-to-action come from the backend's authoritative classification
        // (learn.classify_feedback): `effect` is self-contained — a learn-channel signal's effect already
        // carries the Run-learn CTA (immediate for `incorrect`, conditional on recurrence for
        // `escalation_reject`), an advisory signal points at neither. A `core` correction is AUTO-SCANNED
        // server-side (`rescanned` reports the outcome), so on success there is no "Run Scan" step to
        // advertise — the member panels just refresh below; only a FAILED auto-scan points at the manual
        // Scan button (the retry path).
        const { channel, effect, rescanned, acknowledged } = r.data;
        let note = ` ${effect || ""}`;
        if (channel === "core") {
          note += rescanned
            ? ' Auto-scanned — the panels now reflect it; revert with "Reset learning".'
            : ' Auto-scan failed — run "Scan" to see the flag change; revert with "Reset learning".';
        }
        // An accept that matched no LIVE escalation acknowledged nothing (e.g. it targeted a non-escalated
        // observation) — the effect sentence above would overpromise, so correct it honestly.
        if (k.kind === "escalation_accept" && !acknowledged) {
          note = " Recorded for audit, but the target matched no live escalation — nothing was acknowledged on the queue.";
        }
        setStatus(status, "ok", `Recorded ${k.kind} (feedback_id ${r.data.feedback_id}).${note}`);
        // A clean core auto-scan changed the persisted observations/escalations server-side — refresh the
        // member surfaces the same way scanAll does (observations + escalation flag + Mode-1 chips, and
        // invalidate the trajectory cache: /trajectory is a live re-analysis, so the override moves it too).
        // Guard on the member still being on-screen (they may have switched while the POST was in flight).
        if (channel === "core" && rescanned && m === state.currentMember) {
          invalidateTrajectory();
          await Promise.all([loadObservations(m), refreshEscalations(m), refreshSuggestions(m)]);
        }
        // An acknowledgment changed the queue's read-time status — refresh the escalation state so the
        // in-memory set carries the new status (the member flag itself is unchanged: acknowledged stays live).
        if (acknowledged && m === state.currentMember) await refreshEscalations(m);
      } else {
        // Prefer FastAPI's {detail} STRING (the input bar's "rephrase this" reason on a 422); fall back to
        // readable JSON for the other shapes — notably Pydantic body-validation errors, whose `detail` is an
        // ARRAY (stringifying the array directly would render "[object Object]").
        const detail = r.data && r.data.detail;
        const msg = typeof detail === "string" ? detail
          : typeof r.data === "string" ? r.data : JSON.stringify(r.data);
        setStatus(status, "err", msg);
      }
    });
    host.appendChild(form);
  }

  function setStatus(node, cls, msg) { node.className = "cp-form-status" + (cls ? " " + cls : ""); node.textContent = msg; }

  // Reset learning + factory reseed are irreversible-from-the-UI, so each routes through a confirm
  // popup before firing (house style: a custom modal overlay, never native confirm() — the panel owns
  // its own dialog). The wrappers below ARE the ROUTES handlers; the do* functions carry the actual
  // call, run only on Confirm. On confirm, run() renders the route result into the readout as usual.
  // Optional SECOND confirmation gate: pass `challenge` (a word) + `challengeHint` (why it's gated) and
  // Confirm stays disabled until the exact word is typed — clicking through a dialog is muscle memory,
  // typing a word is not. Reserved for the hardest wipe (reseed); Reset learning stays one-click.
  function confirmDestructive({ title, body, confirmLabel, challenge, challengeHint, run }) {
    const backdrop = el("div", "cp-modal-backdrop");
    const modal = el("div", "cp-modal");
    modal.setAttribute("role", "dialog"); modal.setAttribute("aria-modal", "true"); modal.setAttribute("aria-label", title);
    const status = el("div", "cp-modal-status");
    const row = el("div", "cp-modal-row");
    const cancel = el("button", "cp-confirm-cancel", "Cancel"); cancel.type = "button";
    const go = el("button", "cp-confirm-go", confirmLabel); go.type = "button";
    let busy = false;  // a destructive request is in flight
    let challengeWrap = null, challengeInput = null;
    if (challenge) {
      go.disabled = true;  // the typed challenge is the ONLY thing that enables Confirm
      challengeWrap = el("div", "cp-modal-challenge");
      challengeWrap.appendChild(el("div", "cp-modal-challenge-hint", challengeHint || `Type "${challenge}" to confirm.`));
      challengeInput = el("input");
      // No placeholder: the box must visibly start EMPTY (a placeholder echoing the word reads as
      // pre-filled text), and the word must be typed by hand — paste/drop are blocked and
      // autocomplete is off, so nothing can put "delete" in the box except the operator's own keys.
      challengeInput.type = "text";
      challengeInput.setAttribute("aria-label", `Type ${challenge} to confirm`);
      challengeInput.autocomplete = "off"; challengeInput.spellcheck = false;
      challengeInput.addEventListener("paste", (e) => e.preventDefault());
      challengeInput.addEventListener("drop", (e) => e.preventDefault());
      const matched = () => challengeInput.value.trim() === challenge;  // exact word, whitespace forgiven
      challengeInput.addEventListener("input", () => { if (!busy) go.disabled = !matched(); });
      challengeInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && matched() && !busy) go.click(); });
      challengeWrap.appendChild(challengeInput);
    }
    // Escape / backdrop-click must NOT dismiss while busy: there is no AbortController, so the request runs
    // to completion regardless — dismissing would read as "cancelled" while the wipe proceeds, and a later
    // error would write to the detached status node (never shown). Cancel is disabled while busy, so only
    // these two paths need the guard.
    const close = () => { if (busy) return; backdrop.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    cancel.addEventListener("click", close);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });  // click outside the card dismisses
    go.addEventListener("click", async () => {
      if (challengeInput && challengeInput.value.trim() !== challenge) return;  // belt-and-braces with the disabled state
      busy = true;
      go.disabled = cancel.disabled = true;
      if (challengeInput) challengeInput.disabled = true;  // no "un-confirming" mid-wipe
      status.className = "cp-modal-status"; status.textContent = "Working…";
      try { await run(); busy = false; close(); }  // route result lands in the readout; then dismiss the popup
      catch (e) {
        busy = false; status.className = "cp-modal-status err"; status.textContent = String(e);
        go.disabled = cancel.disabled = false;
        if (challengeInput) challengeInput.disabled = false;  // still holds the typed word, so go stays enabled
      }
    });
    row.appendChild(cancel); row.appendChild(go);
    modal.appendChild(el("div", "cp-modal-title", title));
    modal.appendChild(el("div", "cp-modal-body", body));
    if (challengeWrap) modal.appendChild(challengeWrap);
    modal.appendChild(row); modal.appendChild(status);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
    document.addEventListener("keydown", onKey);
    // Focus the SAFE default for keyboard flow: the challenge input when present (typing fires nothing;
    // Enter only submits once the word matches), else Cancel — never the destructive action.
    (challengeInput || cancel).focus();
  }

  function resetLearning() {
    confirmDestructive({
      title: "Reset all learning?",
      body: "Deactivates every feedback override and reverts the composer prompt to v0. Not a data wipe — feedback rows and prompt-version history are preserved — but it cannot be undone from the UI.",
      confirmLabel: "Reset learning",
      run: doResetLearning,
    });
  }
  async function doResetLearning() {
    const r = await api("POST", "/reset", undefined, { what: "Reset learning" });
    renderReadout(r.data);
    if (!r.ok) return;  // banner explains (e.g. 409: a /learn run holds the learning-state lock)
    // /reset now RE-SCANS (server-side) the members whose overrides it reverted, so the clinician queue,
    // observations, and Mode-1 chips actively revert. Reload the current member's view to reflect it.
    if (state.currentMember) {
      await Promise.all([
        loadObservations(state.currentMember),
        refreshEscalations(state.currentMember),
        refreshSuggestions(state.currentMember),
      ]);
      invalidateTrajectory();
      if (state.rightTab === "trajectory") ensureTrajectory(); else renderTrajectoryTab();
    }
  }

  function reseed() {
    confirmDestructive({
      title: "Factory reseed?",
      body: "Wipes every table and re-ingests the original training_data members. Permanently drops all uploaded datasets, feedback, learning, and audit history, restoring the initial 15 members. This cannot be undone.",
      confirmLabel: "Reseed (delete all)",
      challenge: "delete",
      challengeHint: "This will affect ALL current users of this instance and restore the database to its initial state. Type \"delete\" to confirm.",
      run: doReseed,
    });
  }
  async function doReseed() {
    const r = await api("POST", "/admin/reseed", undefined, { what: "Factory reseed" });
    renderReadout(r.data);
    if (!r.ok) return;  // banner explains; don't wipe the on-screen member state for a reseed that didn't run
    clearMemberView(); await loadMembers();  // picker repopulates with the restored 15
  }

  // ---- trajectory sparklines (the member-facing Trajectory tab) ----------------------------------------
  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  // the right-panel palette (svg stroke/fill attrs); the svg *background* is handled by CSS (.traj-card
  // svg.spark). `sparkSvg` still takes a `palette` arg so the geometry stays separable from the colours.
  const SPARK_LIGHT = { good: "#5F9457", bad: "#E06A45", axis: "#9A9382", trend: "#B7B1A6", line: "#5E7BB0", point: "#5E7BB0", flagAmber: "#D9A53E", flagPanic: "#E06A45" };
  // trim a reference bound to a short axis label: integers as-is, else one decimal, no trailing zero ("18.5", "100", "5.7").
  // Show the TRUE bound, matching the backend member_explanation format (templates._fmt_num = f"{x:g}"):
  // toFixed(1) rounded a real 2-decimal bound (creatinine 0.74/1.35) to a value the deterministic core
  // never produced (0.7/1.4), disagreeing with the narrated "0.74–1.35". toPrecision(6) trims float noise,
  // then Number→String drops trailing zeros — "0.74", "1.35", "100", "5.7" — the {:g} equivalent.
  const fmtBound = (v) => String(Number(v.toPrecision(6)));
  const SEV_RANK = { urgent: 3, attention: 2, notable: 1, info: 0 };  // Trajectory-tab ordering: flagged markers first
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  // format an ISO "YYYY-MM-DD" as "12 Feb 2024" by parts (NOT new Date(): that parses as UTC midnight and can
  // shift a day in a negative-offset timezone — these are calendar dates, never instants).
  function fmtReadingDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? `${parseInt(m[3], 10)} ${MONTHS[+m[2] - 1]} ${m[1]}` : (iso || "—");
  }

  // A member is "analyzed" once a scan has produced observations. ONLY the Observations tab gates on this —
  // it is the proactive surface ("we flagged this for you"), so it waits for the scan and shows NO_RESULTS_MSG
  // until one runs. The Trajectory tab does NOT gate: it is the inspection surface, drawn from GET /trajectory
  // (live analyze(), scan-independent), and renders the raw series + its core flags even before a scan —
  // sparkCard still surfaces out-of-range/panic as icon+text, so a pre-scan trajectory is MORE truthful, never
  // a falsely-calm one. The tabs are deliberately decoupled (Trajectory can show a flag pre-scan that
  // Observations will only echo once scanned).
  // Copy note: deliberately NOT "Not analyzed yet" — that would be false for a scanned-clean member (a calm
  // member's scan correctly writes zero observations), and would contradict an active care-team flag. This
  // wording is honest whether the member is unscanned OR scanned-with-nothing-notable.
  const NO_RESULTS_MSG = "No results to show yet — insights appear here once your latest lab results have been reviewed.";
  function isAnalyzed() { return state.observations.length > 0; }

  // shared 'message + Retry chip' empty-state builder (#10) — used by the load-error and trajectory-error paths.
  function appendRetry(host, msg, onRetry) {
    host.appendChild(el("div", "obs-sub", msg));
    const retry = el("button", "suggest-chip", "Retry");
    retry.addEventListener("click", onRetry);
    host.appendChild(retry);
  }

  // one card for one marker's series (the member-facing Trajectory tab). The caption is exactly the spec line
  // (no trend suffix), and a per-reading disclosure echoes the exact dated values beneath it.
  function sparkCard(t) {
    const card = el("div", "spark-card traj-card");
    const vals = t.readings.map((r) => r.value);
    const panic = t.flags.find((f) => f.startsWith("panic"));
    const flag = panic || t.flags.find((f) => f === "above_range" || f === "below_range");
    const rr = t.reference_range || {};
    const oneSided = (rr.ref_low == null) !== (rr.ref_high == null);  // exactly one bound → "threshold", not "range"
    const head = el("div", "spark-head");
    head.appendChild(el("span", "spark-name", t.marker));
    if (flag) {  // surface out-of-range/panic status as icon+TEXT, not colour alone — and not trend-only
      const lab = el("span", "spark-flag" + (panic ? " panic" : ""));
      const text = panic ? flag.replace("_", " ")
        : oneSided ? flag.replace("_range", " threshold") : flag.replace("_", " ");
      lab.textContent = `${panic ? "‼" : "⚑"} ${text}`;
      head.appendChild(lab);
    } else if ((rr.ref_low != null || rr.ref_high != null) && t.severity === "info") {
      // within its bound(s) AND benign per the deterministic core → a circled green check, icon only. Only when
      // the marker HAS a bound to be "in range" against, and only at severity "info" — an in-range value with an
      // escalating adverse trend (severity ≥ notable) must NOT get a calm check (Escalation ≠ out-of-range, but
      // in-range CAN escalate). A boundless marker asserts nothing either way, so gets no check.
      const ok = el("span", "spark-ok");
      ok.textContent = "✓";
      ok.setAttribute("title", oneSided ? "within threshold" : "within range");
      ok.setAttribute("aria-label", oneSided ? "within threshold" : "within range");
      head.appendChild(ok);
    }
    card.appendChild(head);
    card.appendChild(sparkSvg(t, vals, !!panic, !!flag, SPARK_LIGHT));
    const last = t.readings[t.readings.length - 1];
    const lastVal = last ? last.value : "—";
    card.appendChild(el("div", "spark-sub", `${vals.length} readings · latest ${lastVal}${t.unit ? " " + t.unit : ""}`));
    // per-reading disclosure: the exact dated value for every reading, so the sparkline isn't the only way to
    // read the numbers. Pure echo of /trajectory readings (the member's own measured inputs) — no recomputed
    // classification, so it asserts nothing the deterministic core didn't produce. Chronological, matching the
    // chart's left→right order.
    if (t.readings.length) card.appendChild(readingsDetails(t));
    return card;
  }

  // collapsible list of the exact dated value for every reading in a marker's series (member Trajectory tab).
  // Echoes t.readings verbatim (date + value + unit) — no classification, ordered oldest→newest like the chart.
  function readingsDetails(t) {
    const d = el("details");
    d.appendChild(el("summary", null, `All ${t.readings.length} readings`));
    const list = el("div", "traj-readings");
    for (const r of t.readings) {
      const row = el("div", "traj-reading");
      row.appendChild(el("span", "tr-date", fmtReadingDate(r.date)));
      row.appendChild(el("span", "tr-val", `${r.value}${t.unit ? " " + t.unit : ""}`));
      list.appendChild(row);
    }
    d.appendChild(list);
    return d;
  }

  function sparkSvg(t, vals, panic, flagged, palette) {
    const W = 240, H = 46, pad = 5, axisW = 32, n = vals.length;  // axisW: left gutter reserved for the bound numbers
    const rr = t.reference_range || {};
    const domain = [...vals];
    if (t.theil_sen) for (const p of t.theil_sen) domain.push(p.value);
    if (rr.ref_low != null) domain.push(rr.ref_low);
    if (rr.ref_high != null) domain.push(rr.ref_high);
    let lo = Math.min(...domain), hi = Math.max(...domain);
    if (hi === lo) { hi += 1; lo -= 1; }
    const plotL = axisW, plotR = W - pad;  // the plot area sits right of the axis gutter
    const x = (i) => (n <= 1 ? (plotL + plotR) / 2 : plotL + (i / (n - 1)) * (plotR - plotL));
    const y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "spark", width: W, height: H, role: "img", "aria-label": `${t.marker} trend over ${n} readings` });
    // reference regions: the good (in-range) area green, the bad (out-of-range) area red, both at 0.1 opacity.
    // The range's SHAPE defines "good" = inside — no adverse-direction config needed: only-ref_high ⇒ good is
    // below it (LDL <100), only-ref_low ⇒ good is above it (Vitamin D ≥20), both ⇒ good is the band between.
    // y() maps higher value → smaller y (top), so "above ref_high" is 0→y(ref_high) and "below ref_low" is y(ref_low)→H.
    const region = (yTop, yBot, fill) => s.appendChild(svg("rect",
      { x: plotL, y: yTop, width: plotR - plotL, height: Math.max(0, yBot - yTop), fill, "fill-opacity": "0.1" }));
    const bounds = [];
    if (rr.ref_high != null) { region(0, y(rr.ref_high), palette.bad); bounds.push(rr.ref_high); }  // above upper bound = bad
    if (rr.ref_low != null) { region(y(rr.ref_low), H, palette.bad); bounds.push(rr.ref_low); }      // below lower bound = bad
    if (rr.ref_low != null || rr.ref_high != null)  // the good area is what's left, open on any side with no bound
      region(rr.ref_high != null ? y(rr.ref_high) : 0, rr.ref_low != null ? y(rr.ref_low) : H, palette.good);
    for (const b of bounds) {  // a hairline divider + its numeric label at each bound
      s.appendChild(svg("line", { x1: plotL, y1: y(b), x2: plotR, y2: y(b), stroke: palette.axis, "stroke-width": "0.5", "stroke-opacity": "0.6" }));
      axisLabel(b);
    }
    // left-axis numeric label for a bound, right-aligned in the gutter at the bound's height
    function axisLabel(v) {
      const txt = svg("text", { x: axisW - 4, y: y(v) + 2.8, "text-anchor": "end", "font-size": "8", fill: palette.axis });
      txt.textContent = fmtBound(v);
      s.appendChild(txt);
    }
    if (t.theil_sen && t.theil_sen.length === 2)  // the already-computed Theil–Sen line, dashed
      s.appendChild(svg("line", { x1: x(0), y1: y(t.theil_sen[0].value), x2: x(n - 1), y2: y(t.theil_sen[1].value), stroke: palette.trend, "stroke-width": 1, "stroke-dasharray": "3 3" }));
    s.appendChild(svg("polyline", { points: vals.map((v, i) => `${x(i)},${y(v)}`).join(" "), fill: "none", stroke: palette.line, "stroke-width": 1.5 }));
    vals.forEach((v, i) => {
      const isLast = i === n - 1, mark = isLast && flagged;
      s.appendChild(svg("circle", { cx: x(i), cy: y(v), r: mark ? 3.5 : 2, fill: mark ? (panic ? palette.flagPanic : palette.flagAmber) : palette.point }));
    });
    return s;
  }

  // ---- right-panel tabs: Observations (default) | Trajectory ------------------------------------
  // The Trajectory tab is the member-facing surface of GET /trajectory. It is presentation only — the LLM
  // never consumes this; the model sees only the collapsed verdict.
  function selectRightTab(tab) {
    state.rightTab = tab;
    renderRightTabs();
    if (tab === "trajectory") ensureTrajectory();  // lazy: fetch on first open for this member
  }

  function renderRightTabs() {
    const onObs = state.rightTab !== "trajectory";
    const tabObs = $("#tab-obs"), tabTraj = $("#tab-traj");
    tabObs.setAttribute("aria-selected", String(onObs)); tabObs.tabIndex = onObs ? 0 : -1;
    tabTraj.setAttribute("aria-selected", String(!onObs)); tabTraj.tabIndex = onObs ? -1 : 0;
    $("#rp-body-obs").hidden = !onObs;
    $("#rp-body-traj").hidden = onObs;
  }

  // fetch the per-member trajectory once and cache it (state.trajectory). Guarded by trajToken so a result
  // that lands after a member switch OR a scan-invalidation is dropped (never paints a stale/wrong series).
  async function ensureTrajectory() {
    // trajectory is live-derived from analyze() (GET /trajectory) and is scan-independent — fetch as soon as a
    // member is selected, never wait for a scan. Only the Observations tab gates on isAnalyzed(); the tabs are
    // deliberately decoupled (the Trajectory tab is the inspection surface, shown even before a scan).
    if (!state.currentMember) { renderTrajectoryTab(); return; }
    if (state.trajLoading || state.trajectory !== null) { renderTrajectoryTab(); return; }
    state.trajLoading = true; state.trajError = false;
    renderTrajectoryTab();  // loading indicator
    const token = state.trajToken;  // bumped by member switch AND scan-invalidation (#3)
    const r = await api("GET", `/members/${enc(state.currentMember)}/trajectory`, undefined,
      { what: "Loading your trajectory", retry: () => ensureTrajectory() });
    if (token !== state.trajToken) return;  // member switched OR a scan invalidated mid-fetch → drop this stale result
    state.trajLoading = false;
    // sort once here at cache time (not on every paint, #12); flagged markers first, stable within tier.
    if (r.ok) state.trajectory = r.data.slice().sort((a, b) => (SEV_RANK[b.severity] || 0) - (SEV_RANK[a.severity] || 0));
    else state.trajError = true;
    renderTrajectoryTab();
  }

  // invalidate the cache after a scan changed this member's analysis, so the Trajectory tab can't show a
  // pre-scan series while Observations shows the post-scan findings. Bumps trajToken + clears trajLoading so an
  // in-flight pre-scan GET is DROPPED (not silently written back, #3); refetches only if it's the visible tab.
  function invalidateTrajectory() {
    state.trajectory = null; state.trajError = false; state.trajLoading = false; state.trajToken++;
    if (state.rightTab === "trajectory") ensureTrajectory();
  }

  function renderTrajectoryTab() {
    const host = $("#trajectory-list"); host.innerHTML = "";
    if (!state.currentMember) { host.appendChild(el("div", "obs-sub", "Select a member.")); return; }
    if (state.loadError)  // member-load failed → honest, never a false "run a scan" (matches Observations, #4)
      return appendRetry(host, "⚠ Couldn't load your results — check your connection.", () => { if (state.currentMember) selectMember(state.currentMember); });
    if (state.loading) { host.appendChild(el("div", "obs-sub", "Loading…")); return; }  // member-load in flight → not a false "run a scan" (#4)
    // no isAnalyzed() gate here — trajectory is scan-independent and shown pre-scan; only Observations waits for the scan.
    if (state.trajLoading) { host.appendChild(el("div", "obs-sub", "Loading your trends…")); return; }
    if (state.trajError) return appendRetry(host, "⚠ Couldn't load trends.", ensureTrajectory);
    if (state.trajectory === null) return;  // not fetched yet (tab hidden) — leave the body empty
    if (!state.trajectory.length) { host.appendChild(el("div", "obs-sub", "No markers to show.")); return; }
    // already sorted at cache time (flagged markers first, #12) — just render.
    for (const t of state.trajectory) host.appendChild(sparkCard(t));
  }

  // ============================== RENDER ==========================================================
  function renderControlPanel() {
    const host = $("#cp-groups"); host.innerHTML = "";
    const groups = [...new Set(ROUTES.map((r) => r.group))];
    for (const g of groups) {
      const sec = el("div", "cp-group");
      sec.appendChild(el("h3", null, g));
      // The upload dropzone lives at the TOP of the Data group, above the Reseed button. It's authored as
      // static markup (so wireStaticHandlers can bind its drag/drop by id) and relocated here into the
      // group. Safe because renderControlPanel runs exactly once (boot); it is not a re-render target.
      if (g === "Data") sec.appendChild($("#upload-drop"));
      for (const route of ROUTES.filter((r) => r.group === g)) {
        const b = el("button", "cp-btn" + (route.destructive ? " destructive" : ""));
        b.setAttribute("data-tip", route.tip);        // the styled hover tooltip
        b.setAttribute("aria-label", `${route.label}. ${route.tip}`); // screen-reader text (no title= → no duplicate native tooltip)
        b.appendChild(el("span", "verb verb-" + route.verb.toLowerCase(), route.verb));  // verb-get / verb-post → colour by method
        b.appendChild(document.createTextNode(route.label));
        b.addEventListener("click", route.handler);
        sec.appendChild(b);
      }
      host.appendChild(sec);
    }
  }

  // Route-button tooltips: ONE fixed-position box so the description sits to the RIGHT of the button and
  // ESCAPES the rail's overflow clip (.control scrolls → overflow-x computes to auto, which would clip an
  // in-flow ::after; cp-btn opts out of the ::after in CSS). Delegated, so it survives renderControlPanel()
  // re-renders, and keyboard :focus shows it too; it detaches on rail scroll / resize.
  (function routeTooltips() {
    const tip = el("div", "cp-tip");
    document.body.appendChild(tip);
    let cur = null;
    const show = (btn) => {
      const text = btn.getAttribute("data-tip");
      if (!text) return;
      cur = btn;
      // emphasise the leading route (METHOD /path) in its verb colour; rest stays plain text (both via
      // textContent, so no injection). e.g. "POST /members/{id}/feedback · open a form…".
      tip.textContent = "";
      const routeMatch = text.match(/^(GET|POST|PUT|PATCH|DELETE)\s+(\/\S*)/);
      if (routeMatch) {
        // destructive routes borrow the button's coral verb colour; otherwise colour by HTTP method
        const tone = btn.classList.contains("destructive") ? "danger" : routeMatch[1].toLowerCase();
        const route = el("span", "cp-tip-route " + tone, routeMatch[0]);
        tip.appendChild(route);
        tip.appendChild(document.createTextNode(text.slice(routeMatch[0].length)));
      } else {
        tip.textContent = text;
      }
      tip.classList.add("show"); // shown first so offsetHeight measures the wrapped height
      const r = btn.getBoundingClientRect();
      const m = 8;
      let top = r.top;
      if (top + tip.offsetHeight > window.innerHeight - m)
        top = Math.max(m, window.innerHeight - m - tip.offsetHeight); // clamp long tips into view
      tip.style.left = Math.round(r.right + 8) + "px";
      tip.style.top = Math.round(top) + "px";
    };
    const hide = () => { cur = null; tip.classList.remove("show"); };
    const btnAt = (e) => (e.target.closest ? e.target.closest(".cp-btn[data-tip]") : null);
    document.addEventListener("mouseover", (e) => { const b = btnAt(e); if (b && b !== cur) show(b); });
    document.addEventListener("mouseout", (e) => { const b = btnAt(e); if (b && !b.contains(e.relatedTarget)) hide(); });
    document.addEventListener("focusin", (e) => { const b = btnAt(e); if (b) show(b); });
    document.addEventListener("focusout", (e) => { if (btnAt(e)) hide(); });
    document.addEventListener("scroll", hide, true); // the rail scrolls → detach the fixed tip
    window.addEventListener("resize", hide);
  })();

  // ---- custom member dropdown (see .dropdown CSS for why it isn't a native <select>) ---------------
  const memberLabel = (m) => `${m.member_id} · ${m.sex}${m.age != null ? ", " + m.age : ""}`;

  function renderMemberPicker() {
    const list = $("#member-picker-list"); list.innerHTML = "";
    $("#picker-wrap").hidden = !operatorView;
    for (const m of state.members) {
      const li = el("li", "dd-opt", memberLabel(m));
      li.setAttribute("role", "option");
      li.dataset.value = m.member_id;
      li.addEventListener("click", () => commitPicker(m.member_id));
      list.appendChild(li);
    }
    syncPicker();
  }

  // reflect state.currentMember in the button label + the selected-row marker (replaces select.value = id)
  function syncPicker() {
    const m = state.members.find((x) => x.member_id === state.currentMember);
    $("#member-picker-label").textContent = m ? memberLabel(m) : "Select member";
    for (const li of $("#member-picker-list").children)
      li.setAttribute("aria-selected", String(li.dataset.value === state.currentMember));
  }

  const pickerOpen = () => !$("#member-picker-list").hidden;

  function openPicker() {
    if (!state.members.length) return;
    $("#member-picker-list").hidden = false;
    $("#member-picker-btn").setAttribute("aria-expanded", "true");
    setPickerActive([...$("#member-picker-list").children]
      .findIndex((li) => li.dataset.value === state.currentMember));
  }

  function closePicker() {
    $("#member-picker-list").hidden = true;
    $("#member-picker-btn").setAttribute("aria-expanded", "false");
  }

  function setPickerActive(i) {
    const opts = [...$("#member-picker-list").children];
    if (!opts.length) return;
    const idx = (i + opts.length) % opts.length;
    opts.forEach((li, k) => li.classList.toggle("active", k === idx));
    opts[idx].scrollIntoView({ block: "nearest" });
  }

  function movePickerActive(delta) {
    const opts = [...$("#member-picker-list").children];
    const cur = opts.findIndex((li) => li.classList.contains("active"));
    setPickerActive((cur < 0 ? 0 : cur) + delta);
  }

  // commit a selection: close, restore focus, and switch member only on an actual change (a native
  // <select> fires no `change` when re-picking the current value — match that, incl. the stale-readout clear).
  function commitPicker(id) {
    closePicker();
    $("#member-picker-btn").focus();
    if (id && id !== state.currentMember) {
      renderReadout("—");   // the prior member's route response is stale on switch (#3)
      selectMember(id);
    }
  }

  function onPickerKey(e) {
    if (e.key === "Escape") { if (pickerOpen()) { e.preventDefault(); closePicker(); } return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!pickerOpen()) { openPicker(); return; }
      movePickerActive(e.key === "ArrowDown" ? 1 : -1);
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && pickerOpen()) {
      e.preventDefault();
      const active = $("#member-picker-list").querySelector(".dd-opt.active");
      if (active) commitPicker(active.dataset.value);
    }
  }

  function renderModeToggle() {
    $("#mode1-btn").setAttribute("aria-checked", String(state.mode === 1));
    $("#mode2-btn").setAttribute("aria-checked", String(state.mode === 2));
    $("#chips").hidden = state.mode !== 1;
    $("#ask-form").hidden = state.mode !== 2;
  }

  // The ambient escalation flag — a badge on the Observations TAB label (so it's visible from either tab). A
  // load failure is NOT shown here — it surfaces in the panel body with a Retry (renderObservations), so the
  // flag stays a pure all-clear/flagged signal and a failed load is never mistaken for an escalation (#4).
  // Coloured by severity, never colour alone (§8). The badge glyph is decorative (aria-hidden); the full
  // message is carried by the FOCUSABLE tab button — as data-tip (mouse hover + keyboard :focus-visible
  // tooltip) and aria-label (screen readers) — because the span itself can't take focus (#5).
  function renderEscalationFlag() {
    const flag = $("#obs-flag"), tab = $("#tab-obs");
    const active = state.loadError ? [] : state.activeEscalations;
    if (!active.length) {  // all-clear: hide the badge AND strip the flag message from the tab
      flag.hidden = true;
      tab.classList.remove("tip-below"); tab.removeAttribute("data-tip"); tab.removeAttribute("aria-label");
      return;
    }
    const anyUrgent = active.some((e) => e.level === "urgent");
    // No count: the flag ambiently summarises BOTH scan findings and chat escalations (ui-ux §107/§110),
    // but the Observations panel only renders scan findings — so any number is unverifiable against what
    // the member can "view". The flag shows on active.length >= 1. Glyph + message differ by tier so the
    // urgent/attention distinction is never colour alone (§8): ‼ vs ⚑, matching ESCALATION_META.
    const msg = anyUrgent
      ? "Urgent: some results have been flagged for your care team."
      : "Some results have been flagged for your care team.";
    flag.hidden = false;
    flag.textContent = anyUrgent ? "‼" : "⚑";
    flag.className = `obs-flag ${anyUrgent ? "urgent" : "attention"}`;
    tab.classList.add("tip-below");
    tab.setAttribute("data-tip", msg);                        // mouse hover + keyboard :focus-visible tooltip
    tab.setAttribute("aria-label", `Observations — ${msg}`);  // full message in the tab's screen-reader name
  }

  function renderConversation() {
    const log = $("#conversation-log");
    if (!state.log.length) {
      log.replaceChildren(el("div", "empty-hint",
        state.mode === 1
          ? "Pick a suggested question below, or switch to Mode 2 to ask in your own words."
          : "Ask about your results in your own words below."));
      return;
    }
    // re-insert cached nodes for unchanged turns + build only new/changed ones (#6)
    log.replaceChildren(...state.log.map(turnNode));
    scrollConversationToEnd();
  }

  // Scroll the newest turn into view. #conversation-log itself never scrolls (no overflow) — the real
  // scroller is .center on desktop and <main> in the stacked <=820px layout — so target the convo-foot
  // (the log's sibling, always the bottom of the conversation column) and let scrollIntoView walk
  // whichever ancestor scrolls. Deliberately NOT "bottom of the scroller": in the stacked layout the
  // Observations panel sits BELOW the chat inside <main>, so scrolling main to scrollHeight would
  // overshoot past the newest message. Runs on every conversation render — i.e. both when the member's
  // message is pushed (with the pending bubble) and again when the full assistant answer replaces it.
  function scrollConversationToEnd() {
    document.querySelector(".convo-foot")?.scrollIntoView({ block: "end" });
  }

  // a turn's rendered node, cached by identity + a signature of the render-affecting fields (kind/text;
  // for an assistant card, whether a takeover was added). An unchanged turn returns its EXISTING node,
  // which replaceChildren moves rather than recreates — so an expanded <details> (evidence / trace)
  // survives the next turn's render instead of snapping shut (#6).
  // Animated "thinking" bubble: bouncing dots + a message that cycles through the deterministic
  // steps the service actually performs on an /ask (load labs → analyze → narrate). Purely cosmetic —
  // it does NOT reflect live backend progress (the call is a single round-trip), it sets the *expectation*
  // of grounded work. The interval self-cleans once the node is swapped out of the DOM (isConnected),
  // so there is no teardown to wire from onAsk. turnNode caches this node by sig, so the same element
  // (and its running interval) is reused across re-renders instead of being recreated.
  const THINKING_STEPS = [
    "Checking your labs",
    "Consulting clinician notes",
    "Reviewing your trajectory",
    "Formulating a response",
  ];
  function thinkingNode() {
    const wrap = el("div", "pending");
    const dots = el("div", "think-dots");
    dots.append(el("span"), el("span"), el("span"));
    const msg = el("span", "think-msg", THINKING_STEPS[0]);
    wrap.append(dots, msg);
    let i = 0;
    const tick = setInterval(() => {
      // stop once swapped for the answer, OR once we reach the final step — "Formulating a
      // response" then holds until the real answer replaces the bubble (no looping back).
      if (!wrap.isConnected || i >= THINKING_STEPS.length - 1) { clearInterval(tick); return; }
      i += 1;
      msg.style.opacity = "0";
      setTimeout(() => { msg.textContent = THINKING_STEPS[i]; msg.style.opacity = "1"; }, 220);
    }, 3000);
    return wrap;
  }

  function turnNode(turn) {
    const sig = turn.kind === "assistant"
      ? `a:${turn.isTransition}:${turn.takeoverLevel}`
      : `${turn.kind}:${turn.text || ""}`;
    const cached = _turnNodes.get(turn);
    if (cached && cached.sig === sig) return cached.node;
    let node;
    if (turn.kind === "member") node = el("div", "member-bubble", turn.text);
    else if (turn.kind === "pending") node = thinkingNode();
    else if (turn.kind === "error") node = el("div", "answer-card refused", turn.text);
    else node = renderAnswerCard(turn);
    _turnNodes.set(turn, { node, sig });
    return node;
  }

  // the two-axis card: BODY follows answer_disposition, CHROME follows escalation, independently (§3/§4)
  function renderAnswerCard(turn) {
    const resp = turn.resp;
    const disp = DISPOSITION_META[resp.answer_disposition] || DISPOSITION_META.answered;
    const card = el("div", `answer-card ${disp.cls}`);

    // loud takeover — transition turn ONLY; every later turn stays clean (the banner carries status)
    if (turn.isTransition && turn.takeoverLevel && turn.takeoverLevel !== "none") {
      const m = ESCALATION_META[turn.takeoverLevel];
      const t = el("div", `takeover ${turn.takeoverLevel}`);
      t.appendChild(el("span", "t-icon", m.icon));
      const tx = el("div");
      tx.appendChild(el("div", "t-label", m.label));
      tx.appendChild(el("div", "t-step", m.step));
      t.appendChild(tx);
      card.appendChild(t);
    }

    if (disp.tag) card.appendChild(el("div", "disp-tag", disp.tag));
    const answer = el("div", "answer-text");
    answer.innerHTML = mdToHtml(resp.answer || "");   // safe: mdToHtml escapes first, emits a fixed tag set
    // Bold-purple the marker names + values, matching the Observations panel. Mode-1 chip turns
    // (turn.askedPrompt) rebuild each block — safe, the deterministic prose has no inline markdown.
    // Mode-2 LLM answers get the text-node walker instead (highlightComposedMarkers), which preserves
    // the composer's own markdown and bolds only the markers the response's evidence cites; the
    // gate-routed safety templates (crisis / seek-care — their emergency numbers must not be restyled)
    // cite no findings, so they stay untouched.
    if (turn.askedPrompt) highlightAnswerValues(answer);
    else highlightComposedMarkers(answer, resp);
    card.appendChild(answer);
    if (resp.uncertainty) card.appendChild(el("div", "uncertainty", resp.uncertainty));

    // evidence chips — collapsed by default; only for an answered card that actually cites readings
    // (a friendly redirect / refusal shows no chips — ui-ux §4).
    const findings = (resp.answer_disposition === "answered") ? (resp.findings || []) : [];
    const withEvidence = findings.filter((f) => (f.evidence || []).length);
    if (withEvidence.length) {
      const n = withEvidence.reduce((a, f) => a + f.evidence.length, 0);
      const d = el("details", "evidence");
      const s = el("summary", null, `▸ Evidence (${n})`);
      s.setAttribute("title", "Show the readings each claim is based on");
      d.appendChild(s);
      for (const f of withEvidence) {
        if (f.text) d.appendChild(el("div", "finding-text", f.text));
        for (const ev of f.evidence) d.appendChild(renderChipRow(ev));
      }
      card.appendChild(d);
    }

    if (operatorView && resp.metadata) card.appendChild(renderTrace(resp.metadata));
    return card;
  }

  function renderChipRow(ev) {
    const row = el("div", "chip");
    row.appendChild(el("span", "c-marker", ev.marker));
    row.appendChild(el("span", "c-value", `${ev.value} ${ev.unit}`));
    row.appendChild(el("span", "c-date", ev.date));
    if (ev.ref_low != null || ev.ref_high != null) {
      const lo = ev.ref_low != null ? ev.ref_low : "–";
      const hi = ev.ref_high != null ? ev.ref_high : "–";
      row.appendChild(el("span", "c-range", `ref ${lo}–${hi}`));
    }
    if (ev.stat) row.appendChild(el("span", "c-stat", ev.stat));
    return row;
  }

  function renderTrace(md) {
    const d = el("details", "trace");
    const s = el("summary", null, "▸ trace");
    s.setAttribute("title", "Operator: the reproducibility + cost trace for this answer");
    d.appendChild(s);
    const g = el("div", "trace-grid");
    const rows = [
      ["model", md.model_version], ["data_version", md.data_version],
      ["config_version", md.config_version], ["prompt_version", md.prompt_version],
      ["latency_ms", md.latency_ms], ["tokens", md.tokens], ["cost_usd", md.cost_usd],
    ];
    for (const [k, v] of rows) if (v != null) g.appendChild(el("div", null, `${k}: ${v}`));
    d.appendChild(g);
    return d;
  }

  function renderChips() {
    const host = $("#chips"); host.innerHTML = "";
    if (state.mode !== 1) return;
    for (const sp of state.chips) {
      const b = el("button", "suggest-chip", sp.prompt);
      b.setAttribute("title", sp.prompt);
      b.addEventListener("click", () => onChipClick(sp));
      host.appendChild(b);
    }
    // when the map thins to revisits/anchors, surface the clean handoff to Mode 2 (architecture §2)
    if (state.currentMember) {
      const h = el("button", "suggest-chip handoff", "Don't see your question? Ask in your own words →");
      h.setAttribute("title", "Switch to Mode 2 (ask in your own words)");
      h.addEventListener("click", () => setMode(2));
      host.appendChild(h);
    }
  }

  function renderObservations() {
    const host = $("#observations-list"); host.innerHTML = "";
    if (state.loadError)  // honest: a failed load is not an all-clear (#4)
      return appendRetry(host, "⚠ Couldn't load your results — check your connection.", () => { if (state.currentMember) selectMember(state.currentMember); });
    if (!state.currentMember) { host.appendChild(el("div", "obs-sub", "Select a member.")); return; }
    if (state.loading) { host.appendChild(el("div", "obs-sub", "Loading…")); return; }  // member-load in flight → not a false empty state (#4)
    if (!isAnalyzed()) {  // no scan yet → the shared empty state (Trajectory shows the SAME — they wait together)
      host.appendChild(el("div", "obs-sub", NO_RESULTS_MSG));
      return;
    }
    for (const obs of state.observations) {
      const meta = SEVERITY_META[obs.severity] || SEVERITY_META.info;
      const item = el("div", `obs-item ${meta.cls}`);
      const kicker = el("div", "obs-kicker");
      kicker.appendChild(el("span", null, meta.icon));
      kicker.appendChild(el("span", null, meta.label));
      item.appendChild(kicker);
      item.appendChild(el("div", "obs-title", obs.title));
      const d = el("details");
      d.appendChild(el("summary", null, "why am I seeing this?"));
      // member audience: deterministic plain-language explanation (states the range, never the
      // statistics). The clinician trigger_reason stays on the operator console (raw-JSON readouts).
      d.appendChild(highlightValues(el("div", "obs-why"), obs.member_explanation));
      item.appendChild(d);
      host.appendChild(item);
    }
  }

  function renderReadout(data) {
    state.readoutKey = null;  // any non-toggle write disarms the toggle, so the next route click shows output
    const el = $("#cp-readout");
    const text = typeof data === "string" ? data : JSON.stringify(data, null, 2);
    el.textContent = text;
    el.classList.toggle("is-empty", text === "—");  // collapse to a small window in the default empty state
  }

  function updateAskDisabled() {
    const btn = $("#ask-form button"); const inp = $("#ask-input");
    const blocked = state.asking || state.loading;  // also blocked while the member loads (#2)
    if (btn) btn.disabled = blocked;
    if (inp) inp.disabled = blocked;
  }

  // ---- resizable side panels (drag the gutters; widths held in memory only — no storage, CLAUDE.md) -
  // The 40vw ceiling here MUST match the grid template's clamp(): both sides capped at 40vw guarantees
  // the centre always keeps ~20vw above the stacking breakpoint. sign maps a rightward drag to a width
  // delta (+1 the left panel grows, -1 the right panel grows as its separator moves left).
  const MAX_FRAC = 0.4;
  const RESIZE = {
    control: { cssVar: "--control-w", def: 248, min: 170, sign: 1,  panel: ".control" },
    obs:     { cssVar: "--obs-w",     def: 300, min: 220, sign: -1, panel: ".observations" },
  };

  function wireResizers() {
    for (const handle of document.querySelectorAll(".resizer")) {
      const cfg = RESIZE[handle.dataset.resize];
      const panel = $(cfg.panel);

      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = panel.getBoundingClientRect().width; // live width, not the var (clamp may cap it)
        handle.setPointerCapture(e.pointerId);
        handle.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        const onMove = (ev) => applyWidth(handle, cfg, startW + cfg.sign * (ev.clientX - startX));
        const onUp = () => {
          handle.classList.remove("dragging");
          document.body.style.cursor = "";
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          handle.removeEventListener("pointercancel", onUp);
        };
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
        handle.addEventListener("pointercancel", onUp);
      });

      // keyboard: ←/→ moves the separator (the panel grows in the arrow's direction); Home resets
      handle.addEventListener("keydown", (e) => {
        if (e.key === "Home") { applyWidth(handle, cfg, cfg.def); e.preventDefault(); return; }
        const dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!dir) return;
        e.preventDefault();
        const cur = panel.getBoundingClientRect().width;
        applyWidth(handle, cfg, cur + cfg.sign * dir * (e.shiftKey ? 48 : 16));
      });

      handle.addEventListener("dblclick", () => applyWidth(handle, cfg, cfg.def));
      syncAria(handle, cfg, panel);
    }
    // forward-safe: if the operator surface is ever hidden (operatorView=false), don't dangle its gutter
    if (!operatorView) $('.resizer[data-resize="control"]').hidden = true;
    // the layout re-flexes on resize via the CSS clamp with no JS, but the separators' announced
    // aria-valuenow/valuemax would otherwise go stale — re-sync them when the window resizes (#14).
    window.addEventListener("resize", () => {
      for (const h of document.querySelectorAll(".resizer")) {
        const c = RESIZE[h.dataset.resize];
        syncAria(h, c, $(c.panel));
      }
    });
  }

  function applyWidth(handle, cfg, desired) {
    const max = Math.round(window.innerWidth * MAX_FRAC);
    const px = Math.max(cfg.min, Math.min(Math.round(desired), max));
    document.documentElement.style.setProperty(cfg.cssVar, px + "px");
    syncAria(handle, cfg, $(cfg.panel));
  }

  function syncAria(handle, cfg, panel) {
    handle.setAttribute("aria-valuenow", String(Math.round(panel.getBoundingClientRect().width)));
    handle.setAttribute("aria-valuemin", String(cfg.min));
    handle.setAttribute("aria-valuemax", String(Math.round(window.innerWidth * MAX_FRAC)));
  }

  // ---- static handlers --------------------------------------------------------------------------
  function setMode(m) { state.mode = m; renderModeToggle(); renderChips(); }

  // clicking the (flagged) Observations tab: bring the flagged observations into view AND pulse them, so the
  // action is visible even on desktop where the panel is already on-screen (scrollIntoView alone is a no-op).
  function viewFlagged() {
    const obs = $(".observations");
    const flagged = [...obs.querySelectorAll(".obs-item.attention, .obs-item.urgent")];
    const targets = flagged.length ? flagged : [...obs.querySelectorAll(".obs-item")];
    (targets[0] || obs).scrollIntoView({ behavior: "smooth", block: "nearest" });
    for (const item of targets) { item.classList.remove("flash"); void item.offsetWidth; item.classList.add("flash"); }
  }

  // activate the Observations tab; if anything is flagged, also pulse the flagged cards into view — the old
  // flag-click affordance, now shared by BOTH mouse click and keyboard activation (#7).
  function showObservationsTab() {
    selectRightTab("observations");
    if (state.activeEscalations.length) viewFlagged();
  }

  // ARIA tablist keyboard nav for the two right-panel tabs (Left/Home → Observations, Right/End → Trajectory).
  function onRightTabKey(e) {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    e.preventDefault();
    const goTraj = e.key === "ArrowRight" || e.key === "End";
    if (goTraj) selectRightTab("trajectory"); else showObservationsTab();
    $(goTraj ? "#tab-traj" : "#tab-obs").focus();
  }

  function wireStaticHandlers() {
    // member dropdown: toggle on the button, navigate with keyboard, close on outside-click (the
    // stale-readout clear + member switch happen in commitPicker on an option choice).
    $("#member-picker-btn").addEventListener("click", () => (pickerOpen() ? closePicker() : openPicker()));
    $("#member-picker-btn").addEventListener("keydown", onPickerKey);
    $("#member-picker-list").addEventListener("keydown", onPickerKey);
    document.addEventListener("click", (e) => {
      if (pickerOpen() && !$("#member-dd").contains(e.target)) closePicker();
    });
    $("#mode1-btn").addEventListener("click", () => setMode(1));
    $("#mode2-btn").addEventListener("click", () => setMode(2));
    $("#readout-toggle").addEventListener("click", (e) => {
      const collapsed = document.querySelector(".control").classList.toggle("readout-collapsed");
      const btn = e.currentTarget;
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.title = collapsed ? "Expand" : "Minimize";
      btn.setAttribute("aria-label", (collapsed ? "Expand" : "Minimize") + " route response");
    });
    // right-panel tabs: switch bodies; activating the Observations tab while flagged also pulses the flagged
    // cards (the old flag-click affordance, shared by click + keyboard via showObservationsTab, #7).
    $("#tab-obs").addEventListener("click", showObservationsTab);
    $("#tab-traj").addEventListener("click", () => selectRightTab("trajectory"));
    $(".rp-tabs").addEventListener("keydown", onRightTabKey);
    $("#upload-file").addEventListener("change", (e) => { if (e.target.files[0]) onUploadFile(e.target.files[0]); e.target.value = ""; });
    // Drag-and-drop bundle upload — the picker-independent path (see .dropzone CSS). A dropped file
    // reaches us via dataTransfer WITHOUT the OS file-selection dialog, so upload works even where a
    // browser silently refuses to open that dialog. Click stays as the fallback for browsers where it works.
    const drop = $("#upload-drop");
    drop.addEventListener("click", () => $("#upload-file").click());
    const swallow = (e) => { e.preventDefault(); e.stopPropagation(); };
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { swallow(e); drop.classList.add("dragover"); }));
    ["dragleave", "dragend"].forEach((ev) => drop.addEventListener(ev, (e) => { swallow(e); drop.classList.remove("dragover"); }));
    drop.addEventListener("drop", (e) => {
      swallow(e); drop.classList.remove("dragover");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) onUploadFile(f);
    });
    // A miss (drop anywhere else on the page) must not make the browser navigate to / open the file.
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());
    $("#ask-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = $("#ask-input").value.trim();
      if (v) { $("#ask-input").value = ""; onAsk(v); }
    });
    renderModeToggle();
  }

  boot();
})();
</script>
</body>
</html>
