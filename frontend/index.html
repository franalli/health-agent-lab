<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Health Intelligence Service</title>
<!--
  Phase 6 — the thin consumer surface (docs/ui-ux.md). One static page, vanilla JS, NO build step,
  NO browser storage (state lives in memory only — CLAUDE.md). FastAPI serves this same-origin at /,
  so every fetch is a relative path and there is no CORS.

  Three regions (ui-ux §2): an operator CONTROL PANEL (left, held apart, not member-facing), the
  member CONVERSATION (center, Mode 1 chips + Mode 2 ask), and proactive OBSERVATIONS (right). The
  card splits BODY (answer_disposition) from CHROME (escalation) on two independent axes (§4); an
  escalation is loud exactly once then ambient (§4 hard rule); severity/disposition/escalation are
  never conveyed by colour alone — icon + text label everywhere (§8).
-->
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1f2933; --muted: #6b7280;
    --line: #e2e6eb; --accent: #2563eb; --accent-ink: #ffffff;
    /* calm, not klaxon (§2/§8) */
    --amber-bg: #fef3c7; --amber-line: #d97706; --amber-ink: #8a5a06;
    --red-bg: #fde8e8; --red-line: #dc2626; --red-ink: #991b1b;
    --info-ink: #6b7280;
    --radius: 10px;
    /* resizable layout: side-column widths (drag-set, in memory only) + gutter track width */
    --control-w: 248px; --obs-w: 300px; --gutter: 7px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column; height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  button { font: inherit; cursor: pointer; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }

  /* ---- header ---------------------------------------------------------------------------------- */
  header { border-bottom: 1px solid var(--line); background: var(--panel); }
  /* sample-data notice — a persistent warning glyph in the header (next to Member); the full text
     shows on hover/focus via its data-tip, and aria-label keeps it available to screen readers. */
  .data-warning { font-size: 16px; line-height: 1; color: var(--amber-line); cursor: help; }
  .data-warning:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap; }
  .brand { font-size: 16px; font-weight: 700; margin-right: auto; }
  .picker-wrap, .mode-wrap { display: flex; align-items: center; gap: 8px; }
  .picker-wrap label, .mode-wrap > span { font-size: 12.5px; color: var(--muted); }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

  /* mode toggle */
  .mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .mode-toggle button { border: 0; background: #fff; color: var(--muted); padding: 6px 14px; font-size: 13px; }
  .mode-toggle button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* ambient escalation banner (§4 layer 2) */
  #escalation-banner {
    display: flex; align-items: center; gap: 10px; padding: 9px 16px;
    background: var(--amber-bg); border-bottom: 1px solid var(--amber-line); color: var(--amber-ink); font-size: 13.5px;
  }
  #escalation-banner.urgent { background: var(--red-bg); border-bottom-color: var(--red-line); color: var(--red-ink); }
  #escalation-banner[hidden] { display: none; }
  #escalation-banner .esc-icon { font-size: 16px; }
  #escalation-banner button {
    margin-left: auto; border: 1px solid currentColor; background: transparent; color: inherit;
    border-radius: 7px; padding: 3px 10px; font-size: 12.5px;
  }

  /* ---- layout ---------------------------------------------------------------------------------- */
  /* Three regions on a grid; the two side columns are drag-resizable via the .resizer gutters below.
     Their widths live in --control-w / --obs-w, but the template wraps each in clamp(min, var, 40vw):
     a user-set width is honoured until the window narrows enough that 40vw is smaller, at which point
     the panel yields automatically — so the layout re-flexes with NO JS resize listener, and the two
     sides can never together starve the centre above the stacking breakpoint. State is in memory only. */
  main {
    display: grid;
    grid-template-columns:
      clamp(170px, var(--control-w), 40vw)
      var(--gutter)
      minmax(0, 1fr)
      var(--gutter)
      clamp(220px, var(--obs-w), 40vw);
    gap: 0; flex: 1; min-height: 0;
  }
  /* production member build (operatorView=false → body.member-only): drop the operator column AND its
     gutter entirely so the panel can't be seen or clicked, and reclaim the two left tracks (#5). */
  body.member-only .control,
  body.member-only .resizer[data-resize="control"] { display: none; }
  body.member-only main {
    grid-template-columns: 0 0 minmax(0, 1fr) var(--gutter) clamp(220px, var(--obs-w), 40vw);
  }
  aside, .center { min-height: 0; overflow: auto; }
  /* the control panel keeps overflow:visible so button hover-tooltips can escape the narrow column to
     the right (you can't have overflow-x:visible + overflow-y:auto — one non-visible axis forces both
     to auto). So instead of scrolling the panel, it is a flex column: the buttons/labels hold their
     natural height and ONLY the readout flexes + scrolls to absorb leftover space, so a long route
     response can never push the panel below the bottom of the page. */
  .control { display: flex; flex-direction: column; background: #fbfcfd; padding: 12px; overflow: visible; }
  .control > * { flex-shrink: 0; }
  .center { display: flex; flex-direction: column; }
  .observations { background: var(--panel); padding: 14px; }

  /* drag gutter — a transparent col-resize track whose centred 1px ::before is the resting divider
     (it replaces the panels' old side borders, so the seam looks identical at rest). Keyboard-operable:
     focus a separator, then ←/→ to nudge (Shift = larger step), double-click or Home to reset. */
  .resizer { position: relative; background: transparent; cursor: col-resize; touch-action: none; user-select: none; }
  .resizer::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%);
    background: var(--line); transition: width .12s, background .12s;
  }
  .resizer:hover::before, .resizer.dragging::before, .resizer:focus-visible::before { width: 3px; background: var(--accent); }
  .resizer:focus-visible { outline: none; }

  /* narrow screens: stack to one scrolling column and drop the gutters (clamp handles the wide middle) */
  @media (max-width: 820px) {
    main { display: block; overflow-y: auto; }
    .resizer { display: none; }
    .control { border-bottom: 1px solid var(--line); }
    .observations { border-top: 1px solid var(--line); }
    .control, .center, .observations { overflow: visible; }
    .center { min-height: 60vh; }
  }

  /* ---- control panel (operator) ---------------------------------------------------------------- */
  .operator-tag {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    background: #eceff2; border: 1px dashed #c4cbd3; border-radius: 6px; padding: 5px 8px; margin: 0 0 12px;
  }
  .cp-group { margin-bottom: 12px; }
  .cp-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .cp-btn {
    position: relative; display: block; width: 100%; text-align: left; margin-bottom: 5px;
    border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 9px; font-size: 13px; color: var(--ink);
  }
  .cp-btn:hover { border-color: var(--accent); }
  .cp-btn .verb { font-size: 10px; font-weight: 700; letter-spacing: .03em; color: var(--accent); margin-right: 6px; }
  .cp-btn.destructive .verb { color: var(--red-line); }
  .cp-btn.destructive:hover { border-color: var(--red-line); }

  /* hover tooltip — the explicit "what does this button do" affordance (escapes the narrow column to
     the right so it never clips). Also set as title= for a native/screen-reader fallback. */
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 0; z-index: 50;
    width: 230px; background: #111827; color: #f9fafb; font-size: 11.5px; line-height: 1.45;
    padding: 7px 9px; border-radius: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none;
  }
  /* tooltips for elements where right-side would overflow the viewport flip below-left */
  .tip-below:hover::after, .tip-below:focus-visible::after { left: auto; right: 0; top: calc(100% + 6px); }

  .readout-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 5px; }
  #cp-readout {
    background: #0f172a; color: #cbd5e1; border-radius: 8px; padding: 9px; font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* flex:0 1 auto — don't grow (short output stays a small box), but shrink to fit the panel's
       height when output is long; min-height:0 lets it shrink below content so overflow:auto scrolls. */
    flex: 0 1 auto; min-height: 0; max-height: 260px; overflow: auto;
  }

  /* ---- conversation ---------------------------------------------------------------------------- */
  #conversation-log { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .empty-hint { color: var(--muted); font-size: 13.5px; text-align: center; margin: 32px 12px; }
  .member-bubble {
    align-self: flex-end; max-width: 78%; background: var(--accent); color: #fff;
    padding: 8px 12px; border-radius: 14px 14px 4px 14px; font-size: 14px;
  }
  .pending { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; }

  .answer-card {
    align-self: flex-start; max-width: 88%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px 14px 14px 14px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .answer-card.oos { background: #f7f9fc; }
  .answer-card.refused { background: #f7f9fc; }
  .answer-text { font-size: 14.5px; }
  /* rendered markdown from the Mode-2 LLM prose (see mdToHtml) — kept compact for the answer card */
  .answer-text > :first-child { margin-top: 0; }
  .answer-text > :last-child { margin-bottom: 0; }
  .answer-text p { margin: 0 0 8px; }
  .answer-text h3 { font-size: 14px; font-weight: 650; margin: 13px 0 5px; }
  .answer-text h4 { font-size: 13px; font-weight: 650; margin: 11px 0 4px; }
  .answer-text ul, .answer-text ol { margin: 5px 0 9px; padding-left: 20px; }
  .answer-text li { margin: 2px 0; }
  .answer-text hr { border: 0; border-top: 1px solid var(--line); margin: 11px 0; }
  .answer-text code { background: #f1f5f9; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-family: ui-monospace, Menlo, monospace; font-size: .92em; }
  .answer-text strong { font-weight: 680; }
  .disp-tag { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .uncertainty { margin-top: 7px; font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; }

  /* in-bubble loud takeover — transition turn ONLY (§4 layer 3) */
  .takeover { margin: -12px -14px 10px; padding: 9px 14px; border-radius: 4px 14px 0 0; display: flex; gap: 9px; align-items: flex-start; }
  .takeover.clinician_review { background: var(--amber-bg); color: var(--amber-ink); border-bottom: 1px solid var(--amber-line); }
  .takeover.urgent { background: var(--red-bg); color: var(--red-ink); border-bottom: 1px solid var(--red-line); }
  .takeover .t-icon { font-size: 17px; line-height: 1.2; }
  .takeover .t-label { font-weight: 700; }
  .takeover .t-step { font-size: 12.5px; }

  details.evidence, details.trace { margin-top: 9px; }
  details.evidence > summary, details.trace > summary {
    cursor: pointer; font-size: 12px; color: var(--accent); list-style: none; user-select: none;
  }
  details.trace > summary { color: var(--muted); }
  summary::-webkit-details-marker { display: none; }
  .finding-text { font-size: 12.5px; color: var(--ink); margin: 7px 0 4px; }
  .chip {
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
    background: #f1f5f9; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0; font-size: 12px;
  }
  .chip .c-marker { font-weight: 650; }
  .chip .c-value { color: var(--accent); font-weight: 600; }
  .chip .c-date, .chip .c-range, .chip .c-stat { color: var(--muted); }
  .trace-grid { margin-top: 6px; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .trace-grid div { padding: 1px 0; }

  /* mode 1 chips + ask form */
  .convo-foot { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--panel); }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest-chip {
    border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 999px;
    padding: 7px 13px; font-size: 13px; max-width: 100%; text-align: left;
  }
  .suggest-chip:hover { background: #eff4ff; }
  .suggest-chip.handoff { border-style: dashed; color: var(--muted); border-color: var(--muted); }
  #ask-form { display: flex; gap: 8px; }
  #ask-input { flex: 1; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
  #ask-form button { border: 0; background: var(--accent); color: #fff; border-radius: 9px; padding: 9px 16px; font-weight: 600; }
  #ask-form button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }

  /* ---- observations ---------------------------------------------------------------------------- */
  .observations h2 { font-size: 14px; margin-bottom: 4px; }
  .obs-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .obs-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 9px; background: #fff; }
  /* the header "view" button pulses the flagged items so the action has a visible effect even when the
     panel is already on-screen (a plain scrollIntoView is a no-op on desktop). */
  .obs-item.flash { animation: obs-flash 1.2s ease-out 2; }
  @keyframes obs-flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    25%      { box-shadow: 0 0 0 4px rgba(37, 99, 235, .38); }
  }
  @media (prefers-reduced-motion: reduce) { .obs-item.flash { animation: none; } }
  .obs-item.attention { background: var(--amber-bg); border-color: var(--amber-line); }
  .obs-item.urgent { background: var(--red-bg); border-color: var(--red-line); }
  .obs-kicker { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .obs-item.attention .obs-kicker { color: var(--amber-ink); }
  .obs-item.urgent .obs-kicker { color: var(--red-ink); }
  .obs-item.info .obs-kicker, .obs-item.notable .obs-kicker { color: var(--info-ink); }
  .obs-title { font-size: 13.5px; font-weight: 600; margin: 4px 0; }
  .obs-item details > summary { cursor: pointer; font-size: 12px; color: var(--accent); list-style: none; }
  .obs-why { font-size: 12px; color: var(--ink); margin-top: 5px; }

  /* ---- confirm modal --------------------------------------------------------------------------- */
  .modal-scrim { position: fixed; inset: 0; background: rgba(15,23,42,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 12px; padding: 18px; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { margin-bottom: 8px; }
  .modal p { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-actions button { border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: #fff; }
  .modal-actions .danger { background: var(--red-line); color: #fff; border-color: var(--red-line); }
</style>
</head>
<body>
  <header>
    <div id="escalation-banner" role="status" aria-live="polite" hidden>
      <span class="esc-icon" aria-hidden="true">⚑</span>
      <span class="esc-text"></span>
      <button id="esc-view-btn" data-tip="Jump to the Observations panel to see what's flagged."
              aria-label="View the flagged results in the Observations panel" class="tip-below">view</button>
    </div>

    <div class="topbar">
      <span class="brand">Health Intelligence</span>

      <span class="data-warning tip-below" role="img" tabindex="0"
            data-tip="Sample data — synthetic only. This does not constitute medical advice, diagnosis, or treatment."
            aria-label="Sample data — synthetic only. This does not constitute medical advice, diagnosis, or treatment.">&#9888;&#65038;</span>

      <div class="picker-wrap" id="picker-wrap">
        <label for="member-picker">Member</label>
        <select id="member-picker" aria-label="Select member"></select>
      </div>

      <div class="mode-wrap">
        <span>Mode</span>
        <div class="mode-toggle" role="radiogroup" aria-label="Answer mode">
          <button id="mode1-btn" role="radio" aria-checked="true" class="tip-below"
                  data-tip="Mode 1 · deterministic, instant, ~free. Curated questions answered from your own data with no LLM.">
            1 · Guided
          </button>
          <button id="mode2-btn" role="radio" aria-checked="false" class="tip-below"
                  data-tip="Mode 2 · ask in your own words. An LLM renders the same grounded facts and the same safety floor.">
            2 · Ask
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- LEFT · operator control panel (not member-facing) -->
    <aside class="control" aria-label="Operator control panel">
      <p class="operator-tag">Operator only — not part of the member view</p>
      <div id="cp-groups"></div>
      <input id="upload-file" type="file" accept="application/json,.json" hidden />
      <div class="readout-label">Route response</div>
      <pre id="cp-readout" aria-live="polite">—</pre>
    </aside>

    <div class="resizer" data-resize="control" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize operator panel" title="Drag to resize · double-click to reset"></div>

    <!-- CENTER · conversation -->
    <section class="center" aria-label="Conversation">
      <div id="conversation-log"></div>
      <div class="convo-foot">
        <div id="chips" role="group" aria-label="Suggested questions"></div>
        <form id="ask-form" hidden autocomplete="off">
          <input id="ask-input" type="text" placeholder="Ask about your results in your own words…"
                 aria-label="Ask a question" />
          <button type="submit">Ask</button>
        </form>
      </div>
    </section>

    <div class="resizer" data-resize="obs" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize observations panel" title="Drag to resize · double-click to reset"></div>

    <!-- RIGHT · proactive observations -->
    <aside class="observations" aria-label="Observations">
      <h2>Observations</h2>
      <div class="obs-sub">Raised proactively from your trajectory, ranked by what's worth knowing.</div>
      <div id="observations-list"></div>
    </aside>
  </main>

  <div id="confirm-host"></div>

<script>
"use strict";
(() => {
  // operator affordances (control panel, picker, per-answer trace) are gated on this one flag — a
  // production member build flips it false and the surface becomes member-only (ui-ux §2/§58).
  const operatorView = true;

  // ---- a11y meta: icon + text label for every severity/disposition/escalation (never colour alone, §8)
  const SEVERITY_META = {
    info:      { icon: "◦", label: "Observation",    cls: "info" },
    notable:   { icon: "•", label: "Observation",    cls: "notable" },
    attention: { icon: "▲", label: "Needs follow-up", cls: "attention" },
    urgent:    { icon: "‼", label: "Needs follow-up", cls: "urgent" },
  };
  const DISPOSITION_META = {
    answered:     { cls: "answered", tag: null },
    out_of_scope: { cls: "oos",      tag: "Outside what I can help with" },
    refused:      { cls: "refused",  tag: "I can't answer that from your data" },
  };
  const ESCALATION_META = {
    none:             { rank: 0 },
    clinician_review: { rank: 1, icon: "⚑", label: "Worth a clinician's eyes",
                        step: "Worth raising with your GP — not an emergency." },
    urgent:           { rank: 2, icon: "‼", label: "Flagged for your care team",
                        step: "Please act on the next step in the message below." },
  };
  const escRank = (lvl) => (ESCALATION_META[lvl] ? ESCALATION_META[lvl].rank : 0);

  // ---- route registry: drives BOTH the control-panel buttons AND their hover tooltips. The Learning
  // group (/learn, /feedback, /reset) is a Phase-7 drop-in — it appears here unchanged once those
  // routes scaffold; the panel is a projection of the routes that exist (architecture §56).
  const ROUTES = [
    { group: "Data", label: "Upload bundle", verb: "POST", handler: () => $("#upload-file").click(),
      tip: "POST /members · pick a MemberBundle JSON file and ingest it now. A malformed file shows the validation error here — the upload is the format check." },
    { group: "Data", label: "Seed sample", verb: "POST", handler: seedSample,
      tip: "POST /members · ingest the shipped sample bundle (member C13). Upsert: re-ingesting refreshes facts and preserves the audit/learning trail." },
    { group: "Data", label: "Clear member", verb: "DELETE", destructive: true, handler: confirmClear,
      tip: "DELETE /members/{id} · remove the selected member and all their data. Asks to confirm." },
    { group: "Proactive", label: "Run scan", verb: "POST", handler: () => withMember(async (m) => { await runScan(m, true); await refreshEscalations(m); }),
      tip: "POST /members/{id}/scan · run the proactive drift scan now and refresh the Observations panel." },
    { group: "Proactive", label: "Observations", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/observations`),
      tip: "GET /members/{id}/observations · the member's current proactive findings (raw JSON)." },
    { group: "Proactive", label: "Suggestions", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/suggestions`),
      tip: "GET /members/{id}/suggestions · the Mode-1 preset chips + pre-computed answers (raw JSON)." },
    { group: "Proactive", label: "Clinician queue", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/escalations`),
      tip: "GET /members/{id}/escalations · the clinician-review hand-off queue (raw JSON)." },
    { group: "System", label: "Health", verb: "GET", handler: () => readoutRoute(() => `/health`),
      tip: "GET /health · liveness check." },
  ];

  // ---- in-memory state (no browser storage; resets on reload — CLAUDE.md) -----------------------
  const state = {
    members: [], currentMember: null, mode: 1,
    focus: null, asked: [], chips: [],
    log: [], asking: false,
    loading: false,             // member-load in flight: blocks asks until the safety state is loaded
    loadError: false,           // a member-load fetch failed → surface honestly, never a false all-clear
    observations: [], activeEscalations: [],
    transitionShown: new Map(), // escalation_id -> level already shown loud (so it never re-alarms)
    reqToken: 0,                // bumped on every member switch; stale async results are dropped
  };

  // answer-card DOM cache: a turn object → { node, sig }. renderConversation re-inserts cached nodes for
  // unchanged turns so an expanded <details> (evidence / trace) survives the next turn's render (#6).
  const _turnNodes = new WeakMap();

  // ---- tiny helpers -----------------------------------------------------------------------------
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const enc = encodeURIComponent;

  // ---- markdown → safe HTML (the Mode-2 LLM emits markdown; Mode-1 plain prose passes through as one
  // paragraph). No external library — keeps the page a single static file with no build step. EVERYTHING
  // is HTML-escaped FIRST, so the only tags in the output are the small, fixed set this renderer emits
  // (headings, strong/em/code, hr, lists, paragraphs); the model can never inject live markup.
  const mdEsc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function mdInline(s) {
    // operate on already-escaped text. Split out `code` spans first so bold/italic never run inside
    // them (and so real numbers can't be mistaken for a placeholder); format only the plain segments.
    return s.split(/(`[^`]+`)/g).map((part) =>
      (part.length > 1 && part[0] === "`" && part[part.length - 1] === "`")
        ? `<code>${part.slice(1, -1)}</code>`
        : part.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
              .replace(/\*([^*]+)\*/g, "<em>$1</em>")
              .replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>") // _italic_, not snake_case
    ).join("");
  }
  function mdToHtml(src) {
    const lines = mdEsc(String(src).replace(/\r\n?/g, "\n")).split("\n");
    const out = [];
    let para = [], list = null; // list = { type: "ul"|"ol", items: [] }
    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(mdInline).join("<br>")}</p>`); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.type}>${list.items.map((i) => `<li>${mdInline(i)}</li>`).join("")}</${list.type}>`); list = null; } };
    const flush = () => { flushPara(); flushList(); };
    for (const line of lines) {
      let m;
      if (!line.trim()) { flush(); }
      else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const lvl = m[1].length <= 2 ? 3 : 4; out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`); }
      else if (/^\s*(?:---|\*\*\*|___)\s*$/.test(line)) { flush(); out.push("<hr>"); }
      else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flushPara(); if (!list || list.type !== "ul") { flushList(); list = { type: "ul", items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { flushPara(); if (!list || list.type !== "ol") { flushList(); list = { type: "ol", items: [] }; } list.items.push(m[1]); }
      else { flushList(); para.push(line); }
    }
    flush();
    return out.join("");
  }

  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(path, opts); }
    catch (e) { return { ok: false, status: 0, data: { error: String(e) } }; }
    const raw = await res.text();
    let data; try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }
    return { ok: res.ok, status: res.status, data };
  }

  function flushMemberState() {
    state.focus = null; state.asked = []; state.chips = [];
    state.log = []; state.asking = false; state.loading = false; state.loadError = false;
    state.observations = []; state.activeEscalations = [];
    state.transitionShown = new Map();
    state.reqToken++;
  }

  // wipe the member surface when no member is selected (e.g. the last member was just cleared) so a
  // deleted member's conversation, observations, and safety banner never linger on screen (#3).
  function clearMemberView() {
    flushMemberState();
    state.currentMember = null;
    $("#member-picker").value = "";
    renderConversation(); renderObservations(); renderEscalationBanner(); renderChips(); updateAskDisabled();
  }

  // ---- boot -------------------------------------------------------------------------------------
  async function boot() {
    // a production member build (operatorView=false) drops the WHOLE operator column, not just the
    // picker/trace/gutter — so the panel (incl. the destructive Clear button) can't reach a member (#5).
    if (!operatorView) document.body.classList.add("member-only");
    renderControlPanel();
    wireStaticHandlers();
    wireResizers();
    await loadMembers();
  }

  async function loadMembers(selectId) {
    const r = await api("GET", "/members");
    if (!r.ok) { renderReadout(r.data); return; }
    state.members = r.data;
    renderMemberPicker();
    const target = selectId || (state.members[0] && state.members[0].member_id);
    if (target) await selectMember(target);
    else clearMemberView();   // roster empty (last member cleared) → don't leave a stale surface (#3)
  }

  // member-load sequence: scan → escalations → suggestions (scan-on-ingest isn't wired server-side,
  // so the UI scans on select — which keeps "findings exist before chat" true for the flow).
  async function selectMember(id) {
    flushMemberState();
    state.currentMember = id;
    state.loading = true;        // block asks until the member's safety state is loaded (#2)
    $("#member-picker").value = id;
    renderConversation(); renderObservations(); renderEscalationBanner(); renderChips(); updateAskDisabled();

    const token = state.reqToken;
    const scanR = await runScan(id, false);   // runScan no longer refreshes escalations itself (#9)
    if (token !== state.reqToken) return;
    // escalations + suggestions both depend only on the completed scan, not each other → parallel (#12)
    const [escR] = await Promise.all([refreshEscalations(id), refreshSuggestions(id)]);
    if (token !== state.reqToken) return;
    state.loading = false;
    // honest surface: if a safety-critical load fetch failed, don't render a falsely-calm all-clear (#4)
    state.loadError = !(scanR.ok && escR.ok);
    renderObservations(); renderEscalationBanner(); updateAskDisabled();
  }

  async function runScan(id, toReadout) {
    const r = await api("POST", `/members/${enc(id)}/scan`);
    if (toReadout) renderReadout(r.data);
    if (r.ok && id === state.currentMember) { state.observations = r.data; renderObservations(); }
    // NOTE: callers refresh escalations after a scan (selectMember in parallel with suggestions; the
    // operator "Run scan" handler right after) — runScan no longer double-fetches them (#9).
    return r;
  }

  async function refreshEscalations(id) {
    const r = await api("GET", `/members/${enc(id)}/escalations`);
    if (r.ok && id === state.currentMember) { state.activeEscalations = r.data; renderEscalationBanner(); }
    return r;
  }

  async function refreshSuggestions(id) {
    const q = new URLSearchParams();
    if (state.focus) q.set("focus", state.focus);
    state.asked.forEach((m) => q.append("asked", m));
    const r = await api("GET", `/members/${enc(id)}/suggestions?${q.toString()}`);
    if (r.ok && id === state.currentMember) { state.chips = r.data; renderChips(); }
    return r;
  }

  // ---- Mode 1: a chip click is a pure read; render its pre-computed answer, then regenerate chips -
  async function onChipClick(sp) {
    state.log.push({ kind: "member", text: sp.prompt });
    state.log.push({ kind: "assistant", resp: sp.response, isTransition: false });
    // derive the focus marker (first cited) and remember it as visited; imperfect focus can't dead-end
    // the loop because the anchors are always present (architecture §2).
    const marker = sp.response.findings?.[0]?.evidence?.[0]?.marker || null;
    if (marker) { state.focus = marker; if (!state.asked.includes(marker)) state.asked.push(marker); }
    renderConversation();
    await refreshSuggestions(state.currentMember);
  }

  // ---- Mode 2: free-form ask → pending bubble → /ask → card → escalation diff → maybe loud once ---
  async function onAsk(message) {
    const id = state.currentMember;
    if (!id || state.asking || state.loading) return;  // don't ask before the member's escalations load (#2)
    state.asking = true; updateAskDisabled();
    state.log.push({ kind: "member", text: message });
    const pending = { kind: "pending" };
    state.log.push(pending);
    renderConversation();

    const token = state.reqToken;
    const before = new Map(state.activeEscalations.map((e) => [e.escalation_id, e.level]));
    const r = await api("POST", `/members/${enc(id)}/ask`, { message });
    if (token !== state.reqToken) return; // member switched mid-flight

    const idx = state.log.indexOf(pending);
    if (!r.ok) {
      if (idx >= 0) state.log[idx] = { kind: "error", text: `Request failed (${r.status}).` };
      renderReadout(r.data); renderConversation(); state.asking = false; updateAskDisabled(); return;
    }
    const turn = { kind: "assistant", resp: r.data, isTransition: false, takeoverLevel: null };
    if (idx >= 0) state.log[idx] = turn;
    renderConversation();

    // transition detection from the PUBLIC escalations projection: a chat escalation that newly
    // appeared (or rose in level) this turn is the one loud moment. Re-sends the same day dedupe
    // server-side (no new row) → clean bubble, while the answer still renders in full (§4).
    const after = await refreshEscalations(id);
    if (after.ok && token === state.reqToken) {
      const showable = [];
      for (const e of state.activeEscalations) {
        const prev = before.get(e.escalation_id);
        const isNew = prev === undefined;
        const rose = prev !== undefined && escRank(e.level) > escRank(prev);
        const shown = state.transitionShown.get(e.escalation_id);
        if ((isNew || rose) && (shown === undefined || escRank(e.level) > escRank(shown))) showable.push(e);
      }
      if (showable.length) {
        // one loud takeover this turn, at the highest new level — but mark EVERY newly-appeared
        // escalation as shown, so a lower one riding the same turn isn't permanently denied its loud
        // moment (it was acknowledged here, not silently dropped) (#7).
        const top = showable.reduce((a, b) => (escRank(b.level) > escRank(a.level) ? b : a));
        turn.isTransition = true; turn.takeoverLevel = top.level;
        for (const e of showable) state.transitionShown.set(e.escalation_id, e.level);
        renderConversation();
      }
    }
    state.asking = false; updateAskDisabled();
  }

  // ---- control-panel route handlers -------------------------------------------------------------
  function withMember(fn) { if (state.currentMember) fn(state.currentMember); else renderReadout({ error: "No member selected." }); }

  async function readoutRoute(pathFn) {
    if (pathFn.length && !state.currentMember) return renderReadout({ error: "No member selected." });
    const r = await api("GET", pathFn(state.currentMember));
    renderReadout(r.data);
  }

  // POST a bundle dict, surface the result, and on success reload the picker onto it — the shared tail
  // of both ingest entry points (Seed sample, Upload bundle) (#11). A 422 shows the field error in the
  // readout (the upload is the format check, ui-ux §2).
  async function postBundle(bundle) {
    const r = await api("POST", "/members", bundle);
    renderReadout(r.data);
    if (r.ok) await loadMembers(r.data.member_id);
  }

  async function seedSample() {
    const f = await api("GET", "/sample_member_bundle.json");
    if (!f.ok) return renderReadout({ error: "sample bundle not found" });
    await postBundle(f.data);
  }

  async function onUploadFile(file) {
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch (e) { return renderReadout({ error: "File is not valid JSON", detail: String(e) }); }
    await postBundle(parsed);
  }

  function confirmClear() {
    withMember((m) => openConfirm(
      "Clear this member?",
      `This permanently removes ${m} and all of their data (labs, notes, observations, escalations). This can't be undone.`,
      async () => {
        const r = await api("DELETE", `/members/${enc(m)}`);
        renderReadout(r.data);
        if (r.ok) { clearMemberView(); await loadMembers(); }  // wipe first → a failed reload can't leave it stale (#3)
      }
    ));
  }

  // ============================== RENDER ==========================================================
  function renderControlPanel() {
    const host = $("#cp-groups"); host.innerHTML = "";
    const groups = [...new Set(ROUTES.map((r) => r.group))];
    for (const g of groups) {
      const sec = el("div", "cp-group");
      sec.appendChild(el("h3", null, g));
      for (const route of ROUTES.filter((r) => r.group === g)) {
        const b = el("button", "cp-btn" + (route.destructive ? " destructive" : ""));
        b.setAttribute("data-tip", route.tip);        // the styled hover tooltip
        b.setAttribute("aria-label", `${route.label}. ${route.tip}`); // screen-reader text (no title= → no duplicate native tooltip)
        b.appendChild(el("span", "verb", route.verb));
        b.appendChild(document.createTextNode(route.label));
        b.addEventListener("click", route.handler);
        sec.appendChild(b);
      }
      host.appendChild(sec);
    }
  }

  function renderMemberPicker() {
    const sel = $("#member-picker"); sel.innerHTML = "";
    $("#picker-wrap").hidden = !operatorView;
    for (const m of state.members) {
      const o = el("option", null, `${m.member_id} · ${m.sex}${m.age != null ? ", " + m.age : ""}`);
      o.value = m.member_id;
      sel.appendChild(o);
    }
    if (state.currentMember) sel.value = state.currentMember;
  }

  function renderModeToggle() {
    $("#mode1-btn").setAttribute("aria-checked", String(state.mode === 1));
    $("#mode2-btn").setAttribute("aria-checked", String(state.mode === 2));
    $("#chips").hidden = state.mode !== 1;
    $("#ask-form").hidden = state.mode !== 2;
  }

  function renderEscalationBanner() {
    const banner = $("#escalation-banner");
    if (state.loadError) {  // a load fetch failed → say so; never a silent all-clear (#4)
      banner.hidden = false; banner.classList.remove("urgent");
      banner.querySelector(".esc-icon").textContent = "⚠";
      banner.querySelector(".esc-text").textContent =
        "Couldn't load your latest results — tap Retry in the Observations panel.";
      return;
    }
    const active = state.activeEscalations;
    if (!active.length) { banner.hidden = true; return; }
    const anyUrgent = active.some((e) => e.level === "urgent");
    banner.hidden = false;
    banner.classList.toggle("urgent", anyUrgent);
    banner.querySelector(".esc-icon").textContent = anyUrgent ? "‼" : "⚑";
    // No count: the banner ambiently summarises BOTH scan findings and chat escalations (ui-ux §107/§110),
    // but the Observations panel only renders scan findings — so any number is unverifiable against what
    // the member can "view". The documented copy has none; the banner shows on active.length >= 1.
    banner.querySelector(".esc-text").textContent =
      "Some results have been flagged for your care team.";
  }

  function renderConversation() {
    const log = $("#conversation-log");
    if (!state.log.length) {
      log.replaceChildren(el("div", "empty-hint",
        state.mode === 1
          ? "Pick a suggested question below, or switch to Mode 2 to ask in your own words."
          : "Ask about your results in your own words below."));
      return;
    }
    // re-insert cached nodes for unchanged turns + build only new/changed ones (#6)
    log.replaceChildren(...state.log.map(turnNode));
    log.scrollTop = log.scrollHeight;
  }

  // a turn's rendered node, cached by identity + a signature of the render-affecting fields (kind/text;
  // for an assistant card, whether a takeover was added). An unchanged turn returns its EXISTING node,
  // which replaceChildren moves rather than recreates — so an expanded <details> (evidence / trace)
  // survives the next turn's render instead of snapping shut (#6).
  function turnNode(turn) {
    const sig = turn.kind === "assistant"
      ? `a:${turn.isTransition}:${turn.takeoverLevel}`
      : `${turn.kind}:${turn.text || ""}`;
    const cached = _turnNodes.get(turn);
    if (cached && cached.sig === sig) return cached.node;
    let node;
    if (turn.kind === "member") node = el("div", "member-bubble", turn.text);
    else if (turn.kind === "pending") node = el("div", "pending", "…thinking");
    else if (turn.kind === "error") node = el("div", "answer-card refused", turn.text);
    else node = renderAnswerCard(turn);
    _turnNodes.set(turn, { node, sig });
    return node;
  }

  // the two-axis card: BODY follows answer_disposition, CHROME follows escalation, independently (§3/§4)
  function renderAnswerCard(turn) {
    const resp = turn.resp;
    const disp = DISPOSITION_META[resp.answer_disposition] || DISPOSITION_META.answered;
    const card = el("div", `answer-card ${disp.cls}`);

    // loud takeover — transition turn ONLY; every later turn stays clean (the banner carries status)
    if (turn.isTransition && turn.takeoverLevel && turn.takeoverLevel !== "none") {
      const m = ESCALATION_META[turn.takeoverLevel];
      const t = el("div", `takeover ${turn.takeoverLevel}`);
      t.appendChild(el("span", "t-icon", m.icon));
      const tx = el("div");
      tx.appendChild(el("div", "t-label", m.label));
      tx.appendChild(el("div", "t-step", m.step));
      t.appendChild(tx);
      card.appendChild(t);
    }

    if (disp.tag) card.appendChild(el("div", "disp-tag", disp.tag));
    const answer = el("div", "answer-text");
    answer.innerHTML = mdToHtml(resp.answer || "");   // safe: mdToHtml escapes first, emits a fixed tag set
    card.appendChild(answer);
    if (resp.uncertainty) card.appendChild(el("div", "uncertainty", resp.uncertainty));

    // evidence chips — collapsed by default; only for an answered card that actually cites readings
    // (a friendly redirect / refusal shows no chips — ui-ux §4).
    const findings = (resp.answer_disposition === "answered") ? (resp.findings || []) : [];
    const withEvidence = findings.filter((f) => (f.evidence || []).length);
    if (withEvidence.length) {
      const n = withEvidence.reduce((a, f) => a + f.evidence.length, 0);
      const d = el("details", "evidence");
      const s = el("summary", null, `▸ Evidence (${n})`);
      s.setAttribute("title", "Show the readings each claim is based on");
      d.appendChild(s);
      for (const f of withEvidence) {
        if (f.text) d.appendChild(el("div", "finding-text", f.text));
        for (const ev of f.evidence) d.appendChild(renderChipRow(ev));
      }
      card.appendChild(d);
    }

    if (operatorView && resp.metadata) card.appendChild(renderTrace(resp.metadata));
    return card;
  }

  function renderChipRow(ev) {
    const row = el("div", "chip");
    row.appendChild(el("span", "c-marker", ev.marker));
    row.appendChild(el("span", "c-value", `${ev.value} ${ev.unit}`));
    row.appendChild(el("span", "c-date", ev.date));
    if (ev.ref_low != null || ev.ref_high != null) {
      const lo = ev.ref_low != null ? ev.ref_low : "–";
      const hi = ev.ref_high != null ? ev.ref_high : "–";
      row.appendChild(el("span", "c-range", `ref ${lo}–${hi}`));
    }
    if (ev.stat) row.appendChild(el("span", "c-stat", ev.stat));
    return row;
  }

  function renderTrace(md) {
    const d = el("details", "trace");
    const s = el("summary", null, "▸ trace");
    s.setAttribute("title", "Operator: the reproducibility + cost trace for this answer");
    d.appendChild(s);
    const g = el("div", "trace-grid");
    const rows = [
      ["model", md.model_version], ["data_version", md.data_version],
      ["config_version", md.config_version], ["prompt_version", md.prompt_version],
      ["latency_ms", md.latency_ms], ["tokens", md.tokens], ["cost_usd", md.cost_usd],
    ];
    for (const [k, v] of rows) if (v != null) g.appendChild(el("div", null, `${k}: ${v}`));
    d.appendChild(g);
    return d;
  }

  function renderChips() {
    const host = $("#chips"); host.innerHTML = "";
    if (state.mode !== 1) return;
    for (const sp of state.chips) {
      const b = el("button", "suggest-chip", sp.prompt);
      b.setAttribute("title", sp.prompt);
      b.addEventListener("click", () => onChipClick(sp));
      host.appendChild(b);
    }
    // when the map thins to revisits/anchors, surface the clean handoff to Mode 2 (architecture §2)
    if (state.currentMember) {
      const h = el("button", "suggest-chip handoff", "Don't see your question? Ask in your own words →");
      h.setAttribute("title", "Switch to Mode 2 (ask in your own words)");
      h.addEventListener("click", () => setMode(2));
      host.appendChild(h);
    }
  }

  function renderObservations() {
    const host = $("#observations-list"); host.innerHTML = "";
    if (state.loadError) {  // honest: a failed load is not an all-clear (#4)
      host.appendChild(el("div", "obs-sub", "⚠ Couldn't load your results — check your connection."));
      const retry = el("button", "suggest-chip", "Retry");
      retry.addEventListener("click", () => { if (state.currentMember) selectMember(state.currentMember); });
      host.appendChild(retry);
      return;
    }
    if (!state.observations.length) {
      host.appendChild(el("div", "obs-sub", state.currentMember ? "Nothing stands out right now." : "Select a member."));
      return;
    }
    for (const obs of state.observations) {
      const meta = SEVERITY_META[obs.severity] || SEVERITY_META.info;
      const item = el("div", `obs-item ${meta.cls}`);
      const kicker = el("div", "obs-kicker");
      kicker.appendChild(el("span", null, meta.icon));
      kicker.appendChild(el("span", null, meta.label));
      item.appendChild(kicker);
      item.appendChild(el("div", "obs-title", obs.title));
      const d = el("details");
      d.appendChild(el("summary", null, "why am I seeing this?"));
      d.appendChild(el("div", "obs-why", obs.trigger_reason));
      item.appendChild(d);
      host.appendChild(item);
    }
  }

  function renderReadout(data) {
    $("#cp-readout").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }

  function updateAskDisabled() {
    const btn = $("#ask-form button"); const inp = $("#ask-input");
    const blocked = state.asking || state.loading;  // also blocked while the member loads (#2)
    if (btn) btn.disabled = blocked;
    if (inp) inp.disabled = blocked;
  }

  // ---- confirm modal (destructive actions behind a confirm — ui-ux §2) --------------------------
  function openConfirm(title, body, onYes) {
    const host = $("#confirm-host");
    const scrim = el("div", "modal-scrim");
    const modal = el("div", "modal");
    modal.setAttribute("role", "dialog"); modal.setAttribute("aria-modal", "true");
    modal.appendChild(el("h3", null, title));
    modal.appendChild(el("p", null, body));
    const actions = el("div", "modal-actions");
    const cancel = el("button", null, "Cancel");
    const yes = el("button", "danger", "Clear member");
    cancel.addEventListener("click", () => host.innerHTML = "");
    yes.addEventListener("click", async () => { host.innerHTML = ""; await onYes(); });
    actions.appendChild(cancel); actions.appendChild(yes);
    modal.appendChild(actions); scrim.appendChild(modal);
    scrim.addEventListener("click", (e) => { if (e.target === scrim) host.innerHTML = ""; });
    host.appendChild(scrim);
  }

  // ---- resizable side panels (drag the gutters; widths held in memory only — no storage, CLAUDE.md) -
  // The 40vw ceiling here MUST match the grid template's clamp(): both sides capped at 40vw guarantees
  // the centre always keeps ~20vw above the stacking breakpoint. sign maps a rightward drag to a width
  // delta (+1 the left panel grows, -1 the right panel grows as its separator moves left).
  const MAX_FRAC = 0.4;
  const RESIZE = {
    control: { cssVar: "--control-w", def: 248, min: 170, sign: 1,  panel: ".control" },
    obs:     { cssVar: "--obs-w",     def: 300, min: 220, sign: -1, panel: ".observations" },
  };

  function wireResizers() {
    for (const handle of document.querySelectorAll(".resizer")) {
      const cfg = RESIZE[handle.dataset.resize];
      const panel = $(cfg.panel);

      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = panel.getBoundingClientRect().width; // live width, not the var (clamp may cap it)
        handle.setPointerCapture(e.pointerId);
        handle.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        const onMove = (ev) => applyWidth(handle, cfg, startW + cfg.sign * (ev.clientX - startX));
        const onUp = () => {
          handle.classList.remove("dragging");
          document.body.style.cursor = "";
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          handle.removeEventListener("pointercancel", onUp);
        };
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
        handle.addEventListener("pointercancel", onUp);
      });

      // keyboard: ←/→ moves the separator (the panel grows in the arrow's direction); Home resets
      handle.addEventListener("keydown", (e) => {
        if (e.key === "Home") { applyWidth(handle, cfg, cfg.def); e.preventDefault(); return; }
        const dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!dir) return;
        e.preventDefault();
        const cur = panel.getBoundingClientRect().width;
        applyWidth(handle, cfg, cur + cfg.sign * dir * (e.shiftKey ? 48 : 16));
      });

      handle.addEventListener("dblclick", () => applyWidth(handle, cfg, cfg.def));
      syncAria(handle, cfg, panel);
    }
    // forward-safe: if the operator surface is ever hidden (operatorView=false), don't dangle its gutter
    if (!operatorView) $('.resizer[data-resize="control"]').hidden = true;
    // the layout re-flexes on resize via the CSS clamp with no JS, but the separators' announced
    // aria-valuenow/valuemax would otherwise go stale — re-sync them when the window resizes (#14).
    window.addEventListener("resize", () => {
      for (const h of document.querySelectorAll(".resizer")) {
        const c = RESIZE[h.dataset.resize];
        syncAria(h, c, $(c.panel));
      }
    });
  }

  function applyWidth(handle, cfg, desired) {
    const max = Math.round(window.innerWidth * MAX_FRAC);
    const px = Math.max(cfg.min, Math.min(Math.round(desired), max));
    document.documentElement.style.setProperty(cfg.cssVar, px + "px");
    syncAria(handle, cfg, $(cfg.panel));
  }

  function syncAria(handle, cfg, panel) {
    handle.setAttribute("aria-valuenow", String(Math.round(panel.getBoundingClientRect().width)));
    handle.setAttribute("aria-valuemin", String(cfg.min));
    handle.setAttribute("aria-valuemax", String(Math.round(window.innerWidth * MAX_FRAC)));
  }

  // ---- static handlers --------------------------------------------------------------------------
  function setMode(m) { state.mode = m; renderModeToggle(); renderChips(); }

  // the banner "view" button: bring the flagged observations into view AND pulse them, so the action
  // is visible even on desktop where the panel is already on-screen (scrollIntoView alone is a no-op).
  function viewFlagged() {
    const obs = $(".observations");
    const flagged = [...obs.querySelectorAll(".obs-item.attention, .obs-item.urgent")];
    const targets = flagged.length ? flagged : [...obs.querySelectorAll(".obs-item")];
    (targets[0] || obs).scrollIntoView({ behavior: "smooth", block: "nearest" });
    for (const item of targets) { item.classList.remove("flash"); void item.offsetWidth; item.classList.add("flash"); }
  }

  function wireStaticHandlers() {
    $("#member-picker").addEventListener("change", (e) => {
      renderReadout("—");                 // the prior member's route response is stale on switch — clear it
      selectMember(e.target.value);
    });
    $("#mode1-btn").addEventListener("click", () => setMode(1));
    $("#mode2-btn").addEventListener("click", () => setMode(2));
    $("#esc-view-btn").addEventListener("click", viewFlagged);
    $("#upload-file").addEventListener("change", (e) => { if (e.target.files[0]) onUploadFile(e.target.files[0]); e.target.value = ""; });
    $("#ask-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = $("#ask-input").value.trim();
      if (v) { $("#ask-input").value = ""; onAsk(v); }
    });
    renderModeToggle();
  }

  boot();
})();
</script>
</body>
</html>
