<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<title>Health Intelligence Service</title>
<link rel="icon" href="data:," /><!-- silence the default /favicon.ico 404 (no asset pipeline) -->
<!--
  Phase 6 — the thin consumer surface (docs/ui-ux.md). One static page, vanilla JS, NO build step,
  NO browser storage (state lives in memory only — CLAUDE.md). FastAPI serves this same-origin at /,
  so every fetch is a relative path and there is no CORS.

  Three regions (ui-ux §2): an operator CONTROL PANEL (left, held apart, not member-facing), the
  member CONVERSATION (center, Mode 1 chips + Mode 2 ask), and proactive OBSERVATIONS (right). The
  card splits BODY (answer_disposition) from CHROME (escalation) on two independent axes (§4); an
  escalation is loud exactly once then ambient (§4 hard rule); severity/disposition/escalation are
  never conveyed by colour alone — icon + text label everywhere (§8).
-->
<style>
  :root {
    --bg:#F1F0EC; --panel:#FFFFFF; --panel-2:#F6F4F0; --panel-3:#EEEBE4;
    --ink:#1A1916; --muted:#76726B; --faint:#9C988F;
    --line:#E6E2DA; --line-soft:#EFEBE3;
    --accent:#5B2A49; --accent-press:#491F3B; --accent-tint:#F3EBEF; --accent-ink:#FFFFFF;
    --good:#5F9457; --sand:#D6C4AC; --periwinkle:#9FBBE9; --coral:#E06A45;
    /* calm, never klaxon — attention = honey, urgent = coral; always paired with icon+text (§8) */
    --amber-bg:#FBF1DC; --amber-line:#D9A53E; --amber-ink:#7E5C1B;
    --red-bg:#FAE7DF; --red-line:#E06A45; --red-ink:#9C3A1F;
    --info-ink:#76726B;
    --radius:16px;
    --shadow-sm:0 1px 2px rgba(40,33,25,.05);
    --shadow:0 8px 26px rgba(40,33,25,.08);
    /* resizable layout: side-column widths (drag-set, in memory only) + gutter track width */
    --control-w:248px; --obs-w:300px; --gutter:7px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 400 15px/1.55 'Hanken Grotesk', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; }
  button { font: inherit; cursor: pointer; color: inherit; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  ::selection { background: var(--accent-tint); }

  /* ---- header ---------------------------------------------------------------------------------- */
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 13px 22px; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: var(--ink); margin-right: auto; white-space: nowrap; }
  /* sample-data notice — a persistent warning glyph (full text on hover/focus via data-tip; aria-label for SR) */
  .data-warning { font-size: 15px; line-height: 1; color: var(--amber-line); cursor: help; display: inline-flex; }
  .data-warning:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 5px; }
  .picker-wrap, .mode-wrap { display: flex; align-items: center; gap: 9px; }
  .picker-wrap label, .mode-wrap > span { font-size: 12px; font-weight: 500; color: var(--muted); }
  /* custom member dropdown — always anchored UNDER the button (top:100%), button-width */
  .dropdown { position: relative; }
  .dd-btn {
    font: inherit; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
    min-width: 164px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s;
  }
  .dd-btn:hover { border-color: var(--faint); background: var(--panel-2); }
  .dd-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dd-caret { font-size: 9px; color: var(--muted); }
  .dd-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60; margin: 0; padding: 6px;
    list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); max-height: 300px; overflow-y: auto;
  }
  .dd-list[hidden] { display: none; }
  .dd-opt { padding: 8px 10px; border-radius: 9px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .dd-opt:hover, .dd-opt.active { background: var(--panel-2); }
  .dd-opt[aria-selected="true"] { font-weight: 600; color: var(--accent); }

  /* mode toggle — Ahead nav-pill (dark active on a soft track) */
  .mode-toggle { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); }
  .mode-toggle button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; font-size: 13px; font-weight: 500; border-radius: 999px; white-space: nowrap; transition: color .15s, background .15s; }
  .mode-toggle button:hover { color: var(--ink); }
  .mode-toggle button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* ambient escalation flag beside the Observations heading (§4 layer 2) — coloured + icon, never colour alone */
  .obs-flag { border: 0; background: transparent; padding: 0; margin-left: 7px; cursor: help; font-size: 15px; line-height: 1; vertical-align: middle; }
  .obs-flag.attention { color: var(--amber-line); }
  .obs-flag.urgent { color: var(--red-line); }
  .obs-flag[hidden] { display: none; }

  /* ---- layout ---------------------------------------------------------------------------------- */
  /* Three regions on a grid; side columns drag-resizable via .resizer gutters. Widths live in
     --control-w / --obs-w, each wrapped in clamp(min, var, 40vw) so the layout re-flexes with NO JS
     resize listener and the two sides can never starve the centre above the stacking breakpoint. */
  main {
    display: grid;
    grid-template-columns:
      clamp(170px, var(--control-w), 40vw)
      var(--gutter)
      minmax(0, 1fr)
      var(--gutter)
      clamp(220px, var(--obs-w), 40vw);
    gap: 0; flex: 1; min-height: 0;
  }
  body.member-only .control,
  body.member-only .resizer[data-resize="control"] { display: none; }
  body.member-only main {
    grid-template-columns: 0 0 minmax(0, 1fr) var(--gutter) clamp(220px, var(--obs-w), 40vw);
  }
  aside, .center { min-height: 0; overflow: auto; }
  /* operator rail: held visually apart (warm utility tint). overflow-y:auto forces overflow-x:auto,
     so route tooltips open full-width BELOW their button (see .cp-btn[data-tip]); children don't shrink. */
  .control { display: flex; flex-direction: column; background: var(--panel-3); padding: 16px 14px; overflow-y: auto; }
  .control > * { flex-shrink: 0; }
  .center { display: flex; flex-direction: column; background: var(--bg); }
  /* observations keeps overflow:visible so the heading-flag tooltip can escape; only the list scrolls. */
  .observations { display: flex; flex-direction: column; background: var(--panel); padding: 18px 17px; overflow: visible; }
  .observations > h2, .observations > .obs-sub { flex-shrink: 0; }
  #observations-list { flex: 1 1 auto; min-height: 0; overflow: auto; }

  /* drag gutter — transparent col-resize track; centred 1px ::before is the resting divider. */
  .resizer { position: relative; background: transparent; cursor: col-resize; touch-action: none; user-select: none; }
  .resizer::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%);
    background: var(--line); transition: width .12s, background .12s;
  }
  .resizer:hover::before, .resizer.dragging::before, .resizer:focus-visible::before { width: 3px; background: var(--accent); }
  .resizer:focus-visible { outline: none; }

  /* narrow screens: stack to one scrolling column and drop the gutters */
  @media (max-width: 820px) {
    main { display: block; overflow-y: auto; }
    .resizer { display: none; }
    .control { border-bottom: 1px solid var(--line); }
    .observations { border-top: 1px solid var(--line); }
    .control, .center, .observations { overflow: visible; }
    .center { min-height: 60vh; }
  }

  /* ---- control panel (operator — deliberately plain, held apart) -------------------------------- */
  .operator-tag {
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    background: var(--panel); border: 1px dashed #CDC6B8; border-radius: 9px; padding: 7px 10px; margin: 0 0 14px;
  }
  .cp-group { margin-bottom: 14px; }
  .cp-group h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; margin-bottom: 7px; }
  .cp-btn {
    position: relative; display: block; width: 100%; text-align: left; margin-bottom: 6px;
    border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-weight: 500; color: var(--ink);
    transition: border-color .15s, background .15s;
  }
  .cp-btn:hover { border-color: var(--faint); background: var(--panel-2); }
  .cp-btn .verb { font-size: 9px; font-weight: 700; letter-spacing: .05em; color: var(--accent); margin-right: 7px; }
  .cp-btn.destructive .verb { color: var(--coral); }
  .cp-btn.destructive:hover { border-color: var(--coral); }

  /* hover tooltip — "what does this button do" (escapes the narrow column to the right) */
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 0; z-index: 50;
    width: 230px; background: var(--ink); color: #F5F2EC; font-size: 11.5px; line-height: 1.45;
    padding: 8px 10px; border-radius: 9px; box-shadow: var(--shadow); pointer-events: none;
  }
  .tip-below:hover::after, .tip-below:focus-visible::after { left: auto; right: 0; top: calc(100% + 6px); }
  .cp-btn[data-tip]:hover::after, .cp-btn[data-tip]:focus-visible::after { left: 0; right: 0; top: calc(100% + 4px); width: auto; }

  .readout-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; margin: 16px 0 6px; }
  #cp-readout {
    background: #211E1A; color: #D6CFC4; border-radius: 12px; padding: 11px; font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    flex: 0 0 auto; max-height: 260px; overflow: auto;
  }

  /* ---- feedback form (rendered into #cp-readout — styled for the dark readout) ------------------- */
  .cp-form { display: flex; flex-direction: column; gap: 8px; font-family: inherit; color: #E7E0D5; }
  .cp-form label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #A59C8C; margin-bottom: 2px; display: block; }
  .cp-form select, .cp-form input, .cp-form textarea {
    width: 100%; box-sizing: border-box; background: #2C2823; color: #E7E0D5;
    border: 1px solid #45403A; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12px;
  }
  .cp-form textarea { resize: vertical; min-height: 44px; }
  .cp-form .cp-form-row { display: flex; gap: 8px; }
  .cp-form .cp-form-row > div { flex: 1; }
  .cp-form button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 10px;
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 2px;
  }
  .cp-form button:disabled { opacity: .5; cursor: default; }
  .cp-form-hint { font-size: 10.5px; color: #A59C8C; line-height: 1.45; }
  .cp-form-status { font-size: 11px; line-height: 1.45; white-space: pre-wrap; }
  .cp-form-status.ok { color: #9BD3A0; }
  .cp-form-status.err { color: #E8A28C; }

  /* ---- conversation ---------------------------------------------------------------------------- */
  #conversation-log { flex: 1; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px; }
  .empty-hint { color: var(--muted); font-size: 14px; line-height: 1.55; text-align: center; max-width: 340px; margin: auto; }
  .member-bubble {
    align-self: flex-end; max-width: 78%; background: var(--accent); color: #fff;
    padding: 11px 15px; border-radius: 18px 18px 5px 18px; font-size: 14.5px; line-height: 1.5; box-shadow: var(--shadow-sm);
  }
  .pending { align-self: flex-start; color: var(--muted); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 16px 5px; padding: 10px 14px; box-shadow: var(--shadow-sm); }

  .answer-card {
    align-self: flex-start; max-width: 90%; background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: 5px 20px 20px 20px; padding: 16px 18px; box-shadow: var(--shadow-sm);
  }
  .answer-card.oos, .answer-card.refused { background: var(--panel-2); }
  .answer-text { font-size: 14.5px; line-height: 1.6; }
  .answer-text > :first-child { margin-top: 0; }
  .answer-text > :last-child { margin-bottom: 0; }
  .answer-text p { margin: 0 0 9px; }
  .answer-text h3 { font-size: 14.5px; font-weight: 600; margin: 15px 0 6px; letter-spacing: -.01em; }
  .answer-text h4 { font-size: 13.5px; font-weight: 600; margin: 12px 0 4px; }
  .answer-text ul, .answer-text ol { margin: 6px 0 10px; padding-left: 20px; }
  .answer-text li { margin: 3px 0; }
  .answer-text hr { border: 0; border-top: 1px solid var(--line); margin: 13px 0; }
  .answer-text code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-family: ui-monospace, Menlo, monospace; font-size: .92em; }
  .answer-text strong { font-weight: 600; }
  .disp-tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .uncertainty { margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: var(--muted); border-left: 2px solid var(--sand); padding-left: 11px; }

  /* in-bubble loud takeover — transition turn ONLY (§4 layer 3) */
  .takeover { margin: -16px -18px 12px; padding: 12px 16px; border-radius: 5px 20px 0 0; display: flex; gap: 11px; align-items: flex-start; }
  .takeover.clinician_review { background: var(--amber-bg); color: var(--amber-ink); border-bottom: 1px solid var(--amber-line); }
  .takeover.urgent { background: var(--red-bg); color: var(--red-ink); border-bottom: 1px solid var(--red-line); }
  .takeover .t-icon { font-size: 16px; line-height: 1.3; }
  .takeover .t-label { font-weight: 700; letter-spacing: -.01em; }
  .takeover .t-step { font-size: 12.5px; line-height: 1.45; margin-top: 1px; }

  details.evidence, details.trace { margin-top: 12px; }
  details.evidence > summary, details.trace > summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--accent); list-style: none; user-select: none;
  }
  details.trace > summary { color: var(--muted); font-weight: 500; }
  summary::-webkit-details-marker { display: none; }
  .finding-text { font-size: 12.5px; color: var(--ink); margin: 9px 0 5px; }
  .chip {
    display: block; line-height: 1.65;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; margin: 5px 0; font-size: 12px;
  }
  .chip > span { margin-right: 9px; }
  .chip > span:last-child { margin-right: 0; }
  .chip .c-marker { font-weight: 600; color: var(--ink); }
  .chip .c-value { color: var(--accent); font-weight: 600; }
  .chip .c-date, .chip .c-range, .chip .c-stat { color: var(--muted); }
  .trace-grid { margin-top: 7px; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .trace-grid div { padding: 1px 0; }

  /* mode 1 chips + ask form (Ahead suggestion-pill style) */
  .convo-foot { border-top: 1px solid var(--line); padding: 14px 18px 16px; background: var(--panel); }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest-chip {
    border: 1px solid var(--line); color: var(--ink); background: var(--panel); border-radius: 999px;
    padding: 9px 15px; font-size: 13px; font-weight: 500; max-width: 100%; text-align: left;
    transition: border-color .15s, background .15s, color .15s;
  }
  .suggest-chip:hover { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-press); }
  .suggest-chip.handoff { border-style: dashed; color: var(--muted); border-color: var(--line); }
  .suggest-chip.handoff:hover { background: var(--panel-2); color: var(--ink); border-color: var(--faint); }
  #ask-form { display: flex; gap: 9px; }
  #ask-input { flex: 1; padding: 11px 15px; border: 1px solid var(--line); border-radius: 999px; font: inherit; font-size: 14px; background: var(--panel-2); transition: border-color .15s, background .15s; }
  #ask-input:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  #ask-form button { border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 14px; transition: background .15s; }
  #ask-form button:hover:not(:disabled) { background: var(--accent-press); }
  #ask-form button:disabled { opacity: .45; cursor: default; }
  [hidden] { display: none !important; }

  /* ---- observations ---------------------------------------------------------------------------- */
  .observations h2 { font-size: 15px; font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; }
  .obs-sub { font-size: 12px; line-height: 1.5; color: var(--muted); margin-bottom: 16px; }
  .obs-item { border: 1px solid var(--line-soft); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; background: var(--panel-2); }
  .obs-item.flash, .answer-card.flash { animation: obs-flash 1.2s ease-out 2; }
  @keyframes obs-flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(91, 42, 73, 0); }
    25%      { box-shadow: 0 0 0 4px rgba(91, 42, 73, .30); }
  }
  @media (prefers-reduced-motion: reduce) { .obs-item.flash, .answer-card.flash { animation: none; } }
  .obs-item.attention { background: var(--amber-bg); border-color: var(--amber-line); }
  .obs-item.urgent { background: var(--red-bg); border-color: var(--red-line); }
  .obs-kicker { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .obs-item.attention .obs-kicker { color: var(--amber-ink); }
  .obs-item.urgent .obs-kicker { color: var(--red-ink); }
  .obs-item.info .obs-kicker, .obs-item.notable .obs-kicker { color: var(--good); }
  .obs-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; margin: 6px 0; }
  .obs-item details > summary { cursor: pointer; font-size: 12px; font-weight: 500; color: var(--accent); list-style: none; }
  .obs-why { font-size: 12px; line-height: 1.5; color: var(--ink); margin-top: 6px; }

  /* ---- trajectory sparklines (operator-only; rendered on the dark readout) ----------------------- */
  .spark-wrap { display: flex; flex-direction: column; gap: 12px; }
  .spark-card { display: flex; flex-direction: column; gap: 4px; }
  .spark-head { display: flex; align-items: baseline; gap: 8px; }
  .spark-name { font-weight: 600; color: #E7E0D5; }
  .spark-flag { font-size: 10.5px; color: #E0B86A; }   /* honey out-of-range — icon+TEXT, never colour alone */
  .spark-flag.panic { color: #E8957A; }                /* coral panic */
  .spark-sub { color: #A59C8C; font-size: 10.5px; }
  svg.spark { display: block; background: #191613; border-radius: 7px; }
</style>
</head>
<body>
  <header>
    <div class="topbar">
      <span class="brand">Health Intelligence</span>

      <span class="data-warning tip-below" role="img" tabindex="0"
            data-tip="Sample data — synthetic only. This does not constitute medical advice, diagnosis, or treatment."
            aria-label="Sample data — synthetic only. This does not constitute medical advice, diagnosis, or treatment.">&#9888;&#65038;</span>

      <div class="picker-wrap" id="picker-wrap">
        <label id="picker-label-txt">Member</label>
        <div class="dropdown" id="member-dd">
          <button type="button" id="member-picker-btn" class="dd-btn" aria-haspopup="listbox"
                  aria-expanded="false" aria-labelledby="picker-label-txt member-picker-label">
            <span id="member-picker-label">Select member</span>
            <span class="dd-caret" aria-hidden="true">▾</span>
          </button>
          <ul id="member-picker-list" class="dd-list" role="listbox" aria-label="Members" hidden></ul>
        </div>
      </div>

      <div class="mode-wrap">
        <span>Mode</span>
        <div class="mode-toggle" role="radiogroup" aria-label="Answer mode">
          <button id="mode1-btn" role="radio" aria-checked="true" class="tip-below"
                  data-tip="Mode 1 · deterministic, instant, ~free. Curated questions answered from your own data with no LLM.">
            1 · Guided
          </button>
          <button id="mode2-btn" role="radio" aria-checked="false" class="tip-below"
                  data-tip="Mode 2 · ask in your own words. An LLM renders the same grounded facts and the same safety floor.">
            2 · Ask
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- LEFT · operator control panel (not member-facing) -->
    <aside class="control" aria-label="Operator control panel">
      <p class="operator-tag">Operator only — not part of the member view</p>
      <div id="cp-groups"></div>
      <input id="upload-file" type="file" accept="application/json,.json" hidden />
      <div class="readout-label">Route response</div>
      <pre id="cp-readout" aria-live="polite">—</pre>
    </aside>

    <div class="resizer" data-resize="control" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize operator panel" title="Drag to resize · double-click to reset"></div>

    <!-- CENTER · conversation -->
    <section class="center" aria-label="Conversation">
      <div id="conversation-log"></div>
      <div class="convo-foot">
        <div id="chips" role="group" aria-label="Suggested questions"></div>
        <form id="ask-form" hidden autocomplete="off">
          <input id="ask-input" type="text" placeholder="Ask about your results in your own words…"
                 aria-label="Ask a question" />
          <button type="submit">Ask</button>
        </form>
      </div>
    </section>

    <div class="resizer" data-resize="obs" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize observations panel" title="Drag to resize · double-click to reset"></div>

    <!-- RIGHT · proactive observations -->
    <aside class="observations" aria-label="Observations">
      <h2>Observations<button id="obs-flag" type="button" class="obs-flag tip-below" hidden>⚑</button></h2>
      <div class="obs-sub">Raised proactively from your trajectory, ranked by what's worth knowing.</div>
      <div id="observations-list"></div>
    </aside>
  </main>

<script>
"use strict";
(() => {

  // operator affordances (control panel, picker, per-answer trace) are gated on this one flag — a
  // production member build flips it false and the surface becomes member-only (ui-ux §2/§58).
  const operatorView = true;

  // ---- a11y meta: icon + text label for every severity/disposition/escalation (never colour alone, §8)
  const SEVERITY_META = {
    info:      { icon: "◦", label: "Observation",    cls: "info" },
    notable:   { icon: "•", label: "Observation",    cls: "notable" },
    attention: { icon: "▲", label: "Needs follow-up", cls: "attention" },
    urgent:    { icon: "‼", label: "Needs follow-up", cls: "urgent" },
  };
  const DISPOSITION_META = {
    answered:     { cls: "answered", tag: null },
    out_of_scope: { cls: "oos",      tag: "Outside what I can help with" },
    refused:      { cls: "refused",  tag: "I can't answer that from your data" },
  };
  const ESCALATION_META = {
    none:             { rank: 0 },
    clinician_review: { rank: 1, icon: "⚑", label: "Worth a clinician's eyes",
                        step: "Worth raising with your GP — not an emergency." },
    urgent:           { rank: 2, icon: "‼", label: "Flagged for your care team",
                        step: "Please act on the next step in the message below." },
  };
  const escRank = (lvl) => (ESCALATION_META[lvl] ? ESCALATION_META[lvl].rank : 0);

  // ---- route registry: drives BOTH the control-panel buttons AND their hover tooltips. The Learning
  // group (/learn, /feedback, /reset) is a Phase-7 drop-in — it appears here unchanged once those
  // routes scaffold; the panel is a projection of the routes that exist (architecture §56).
  const ROUTES = [
    { group: "Data", label: "Upload bundle", verb: "POST", handler: () => $("#upload-file").click(),
      tip: "POST /members · pick a MemberBundle JSON file and ingest it now. A malformed file shows the validation error here — the upload is the format check." },
    { group: "Data", label: "Reseed (factory)", verb: "POST", destructive: true, handler: reseed,
      tip: "POST /admin/reseed · TRUNCATE all tables and re-ingest the original training_data members. Drops uploads + all learning/audit history. Fires immediately — red cue only, no confirm." },
    { group: "Proactive", label: "Scan member", verb: "POST", handler: () => withMember(async (m) => { await runScan(m, true); await refreshEscalations(m); }),
      tip: "POST /members/{id}/scan · run the proactive drift scan now and refresh the Observations panel." },
    { group: "Proactive", label: "Scan all", verb: "POST", handler: scanAll,
      tip: "POST /members/{id}/scan for every member in turn · run the proactive drift scan across all members and summarise the per-member result here." },
    { group: "Proactive", label: "Observations", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/observations`),
      tip: "GET /members/{id}/observations · the member's current proactive findings (raw JSON)." },
    { group: "Proactive", label: "Suggestions", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/suggestions`),
      tip: "GET /members/{id}/suggestions · the Mode-1 preset chips + pre-computed answers (raw JSON)." },
    { group: "Proactive", label: "Clinician queue", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/escalations`),
      tip: "GET /members/{id}/escalations · the clinician-review hand-off queue (raw JSON)." },
    { group: "Proactive", label: "Trajectory", verb: "GET", handler: showTrajectory,
      tip: "GET /members/{id}/trajectory · each marker's series with its Theil–Sen line + flagged points, drawn as sparklines (human verification of a finding). The LLM never sees this raw series." },
    { group: "Learning", label: "Run learn", verb: "POST", handler: runLearn,
      tip: "POST /learn · rule-assemble a candidate composer prompt from feedback signals and gate it through the eval harness; promote iff nothing regresses. Needs ANTHROPIC_API_KEY; can take a minute." },
    { group: "Learning", label: "Submit feedback", verb: "POST", handler: feedbackForm,
      tip: "POST /members/{id}/feedback · open a form to record a correction (range_override · suppress_marker · preference) or a signal (helpful · incorrect · escalation_accept|reject) on the selected member. Corrections re-resolve into the core on the next scan/ask; revert with Reset learning." },
    { group: "Learning", label: "Sample override", verb: "POST", handler: sampleOverride,
      tip: "POST /members/{id}/feedback · one-click demo: apply a sample clinician range-override to the selected member's first flagged marker; then run Scan member to see its out-of-range flag clear. Revert with Reset learning." },
    { group: "Learning", label: "Reset learning", verb: "POST", destructive: true, handler: resetLearning,
      tip: "POST /reset · deactivate all feedback overrides and revert the composer prompt to v0. Not a data wipe. Fires immediately — red cue only, no confirm." },
    { group: "System", label: "Health", verb: "GET", handler: () => readoutRoute(() => `/health`),
      tip: "GET /health · liveness check." },
  ];

  // ---- in-memory state (no browser storage; resets on reload — CLAUDE.md) -----------------------
  const state = {
    members: [], currentMember: null, mode: 1,
    focus: null, asked: [], chips: [],
    log: [], asking: false,
    loading: false,             // member-load in flight: blocks asks until the safety state is loaded
    loadError: false,           // a member-load fetch failed → surface honestly, never a false all-clear
    observations: [], activeEscalations: [],
    readoutKey: null,           // path currently shown in the route readout; a repeat click toggles it back to default
    transitionShown: new Map(), // escalation_id -> level already shown loud (so it never re-alarms)
    reqToken: 0,                // bumped on every member switch; stale async results are dropped
  };

  // answer-card DOM cache: a turn object → { node, sig }. renderConversation re-inserts cached nodes for
  // unchanged turns so an expanded <details> (evidence / trace) survives the next turn's render (#6).
  const _turnNodes = new WeakMap();

  // ---- tiny helpers -----------------------------------------------------------------------------
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const enc = encodeURIComponent;

  // ---- markdown → safe HTML (the Mode-2 LLM emits markdown; Mode-1 plain prose passes through as one
  // paragraph). No external library — keeps the page a single static file with no build step. EVERYTHING
  // is HTML-escaped FIRST, so the only tags in the output are the small, fixed set this renderer emits
  // (headings, strong/em/code, hr, lists, paragraphs); the model can never inject live markup.
  const mdEsc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function mdInline(s) {
    // operate on already-escaped text. Split out `code` spans first so bold/italic never run inside
    // them (and so real numbers can't be mistaken for a placeholder); format only the plain segments.
    return s.split(/(`[^`]+`)/g).map((part) =>
      (part.length > 1 && part[0] === "`" && part[part.length - 1] === "`")
        ? `<code>${part.slice(1, -1)}</code>`
        : part.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
              .replace(/\*([^*]+)\*/g, "<em>$1</em>")
              .replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>") // _italic_, not snake_case
    ).join("");
  }
  function mdToHtml(src) {
    const lines = mdEsc(String(src).replace(/\r\n?/g, "\n")).split("\n");
    const out = [];
    let para = [], list = null; // list = { type: "ul"|"ol", items: [] }
    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(mdInline).join("<br>")}</p>`); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.type}>${list.items.map((i) => `<li>${mdInline(i)}</li>`).join("")}</${list.type}>`); list = null; } };
    const flush = () => { flushPara(); flushList(); };
    for (const line of lines) {
      let m;
      if (!line.trim()) { flush(); }
      else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const lvl = m[1].length <= 2 ? 3 : 4; out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`); }
      else if (/^\s*(?:---|\*\*\*|___)\s*$/.test(line)) { flush(); out.push("<hr>"); }
      else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flushPara(); if (!list || list.type !== "ul") { flushList(); list = { type: "ul", items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { flushPara(); if (!list || list.type !== "ol") { flushList(); list = { type: "ol", items: [] }; } list.items.push(m[1]); }
      else { flushList(); para.push(line); }
    }
    flush();
    return out.join("");
  }

  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(path, opts); }
    catch (e) { return { ok: false, status: 0, data: { error: String(e) } }; }
    const raw = await res.text();
    let data; try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }
    return { ok: res.ok, status: res.status, data };
  }

  function flushMemberState() {
    state.focus = null; state.asked = []; state.chips = [];
    state.log = []; state.asking = false; state.loading = false; state.loadError = false;
    state.observations = []; state.activeEscalations = [];
    state.transitionShown = new Map();
    state.reqToken++;
  }

  // wipe the member surface when no member is selected (e.g. the last member was just cleared) so a
  // deleted member's conversation, observations, and safety banner never linger on screen (#3).
  function clearMemberView() {
    flushMemberState();
    state.currentMember = null;
    syncPicker();
    renderConversation(); renderObservations(); renderEscalationFlag(); renderChips(); updateAskDisabled();
  }

  // ---- boot -------------------------------------------------------------------------------------
  async function boot() {
    // a production member build (operatorView=false) drops the WHOLE operator column, not just the
    // picker/trace/gutter — so the operator panel can't reach a member (#5).
    if (!operatorView) document.body.classList.add("member-only");
    renderControlPanel();
    wireStaticHandlers();
    wireResizers();
    await loadMembers();
  }

  async function loadMembers(selectId) {
    const r = await api("GET", "/members");
    if (!r.ok) { renderReadout(r.data); return; }
    state.members = r.data;
    renderMemberPicker();
    const target = selectId || (state.members[0] && state.members[0].member_id);
    if (target) await selectMember(target);
    else clearMemberView();   // roster empty (last member cleared) → don't leave a stale surface (#3)
  }

  // member-load sequence: load EXISTING state only (observations + escalations + suggestions) — all
  // READS, never a scan. A member scan is only ever triggered manually via the "Run scan" button, so
  // selecting a member shows whatever the last scan left (nothing until the operator runs one).
  async function selectMember(id) {
    flushMemberState();
    state.currentMember = id;
    state.loading = true;        // block asks until the member's safety state is loaded (#2)
    syncPicker();
    renderConversation(); renderObservations(); renderEscalationFlag(); renderChips(); updateAskDisabled();

    const token = state.reqToken;
    // all three are READS (GET observations / escalations / suggestions); none triggers a scan.
    const [obsR, escR] = await Promise.all([loadObservations(id), refreshEscalations(id), refreshSuggestions(id)]);
    if (token !== state.reqToken) return;
    state.loading = false;
    // honest surface: if a safety-critical load fetch failed, don't render a falsely-calm all-clear (#4)
    state.loadError = !(obsR.ok && escR.ok);
    renderObservations(); renderEscalationFlag(); updateAskDisabled();
  }

  // GET the member's current observations (a READ of the last scan's output — never triggers a scan).
  async function loadObservations(id) {
    const r = await api("GET", `/members/${enc(id)}/observations`);
    if (r.ok && id === state.currentMember) { state.observations = r.data; renderObservations(); }
    return r;
  }

  // The ONLY scan trigger — wired solely to the operator "Run scan" button (a member scan is manual-only).
  async function runScan(id, toReadout) {
    const r = await api("POST", `/members/${enc(id)}/scan`);
    if (toReadout) renderReadout(r.data);
    if (r.ok && id === state.currentMember) { state.observations = r.data; renderObservations(); }
    return r;
  }

  // Operator "Scan all": fire the existing per-member scan route for every member in turn (the panel
  // adds no new route — it only drives ones the API already exposes), then summarise per-member in the
  // readout. The on-screen member's panel + escalation flag are refreshed from its own fresh scan.
  async function scanAll() {
    const members = state.members;
    if (!members.length) return renderReadout({ error: "No members to scan." });
    renderReadout(`Scanning ${members.length} members…`);
    const results = [];
    for (const m of members) {
      const r = await api("POST", `/members/${enc(m.member_id)}/scan`);
      results.push(r.ok ? { member_id: m.member_id, observations: r.data.length }
                        : { member_id: m.member_id, error: r.status });
      if (r.ok && m.member_id === state.currentMember) { state.observations = r.data; renderObservations(); }
    }
    if (state.currentMember) await refreshEscalations(state.currentMember);
    const failed = results.filter((x) => x.error != null).length;
    renderReadout({ scanned: results.length, failed, results });
  }

  async function refreshEscalations(id) {
    const r = await api("GET", `/members/${enc(id)}/escalations`);
    if (r.ok && id === state.currentMember) { state.activeEscalations = r.data; renderEscalationFlag(); }
    return r;
  }

  async function refreshSuggestions(id) {
    const q = new URLSearchParams();
    if (state.focus) q.set("focus", state.focus);
    state.asked.forEach((m) => q.append("asked", m));
    const r = await api("GET", `/members/${enc(id)}/suggestions?${q.toString()}`);
    if (r.ok && id === state.currentMember) { state.chips = r.data; renderChips(); }
    return r;
  }

  // ---- Mode 1: a chip click is a pure read; render its pre-computed answer, then regenerate chips -
  async function onChipClick(sp) {
    // a chip's answer is a pure pre-computed read; clicking the same question again must not duplicate
    // the exchange — find the existing answer already in the log and flash it instead (re-render is moot).
    const prior = state.log.find((t) => t.kind === "assistant" && t.askedPrompt === sp.prompt);
    if (prior) { flashTurn(prior); return; }
    state.log.push({ kind: "member", text: sp.prompt });
    state.log.push({ kind: "assistant", resp: sp.response, isTransition: false, askedPrompt: sp.prompt });
    // derive the focus marker (first cited) and remember it as visited; imperfect focus can't dead-end
    // the loop because the anchors are always present (architecture §2).
    const marker = sp.response.findings?.[0]?.evidence?.[0]?.marker || null;
    if (marker) { state.focus = marker; if (!state.asked.includes(marker)) state.asked.push(marker); }
    renderConversation();
    await refreshSuggestions(state.currentMember);
  }

  // scroll the existing answer for a turn into view and pulse it — the affordance for "you already
  // asked this; here's the answer" (mirrors the Observations panel's view-flash).
  function flashTurn(turn) {
    const cached = _turnNodes.get(turn);
    if (!cached) return;
    cached.node.scrollIntoView({ behavior: "smooth", block: "nearest" });
    cached.node.classList.remove("flash"); void cached.node.offsetWidth; cached.node.classList.add("flash");
  }

  // ---- Mode 2: free-form ask → pending bubble → /ask → card → escalation diff → maybe loud once ---
  async function onAsk(message) {
    const id = state.currentMember;
    if (!id || state.asking || state.loading) return;  // don't ask before the member's escalations load (#2)
    state.asking = true; updateAskDisabled();
    state.log.push({ kind: "member", text: message });
    const pending = { kind: "pending" };
    state.log.push(pending);
    renderConversation();

    const token = state.reqToken;
    const before = new Map(state.activeEscalations.map((e) => [e.escalation_id, e.level]));
    const r = await api("POST", `/members/${enc(id)}/ask`, { message });
    if (token !== state.reqToken) return; // member switched mid-flight

    const idx = state.log.indexOf(pending);
    if (!r.ok) {
      if (idx >= 0) state.log[idx] = { kind: "error", text: `Request failed (${r.status}).` };
      renderReadout(r.data); renderConversation(); state.asking = false; updateAskDisabled(); return;
    }
    const turn = { kind: "assistant", resp: r.data, isTransition: false, takeoverLevel: null };
    if (idx >= 0) state.log[idx] = turn;
    renderConversation();

    // transition detection from the PUBLIC escalations projection: a chat escalation that newly
    // appeared (or rose in level) this turn is the one loud moment. Re-sends the same day dedupe
    // server-side (no new row) → clean bubble, while the answer still renders in full (§4).
    const after = await refreshEscalations(id);
    if (after.ok && token === state.reqToken) {
      const showable = [];
      for (const e of state.activeEscalations) {
        const prev = before.get(e.escalation_id);
        const isNew = prev === undefined;
        const rose = prev !== undefined && escRank(e.level) > escRank(prev);
        const shown = state.transitionShown.get(e.escalation_id);
        if ((isNew || rose) && (shown === undefined || escRank(e.level) > escRank(shown))) showable.push(e);
      }
      if (showable.length) {
        // one loud takeover this turn, at the highest new level — but mark EVERY newly-appeared
        // escalation as shown, so a lower one riding the same turn isn't permanently denied its loud
        // moment (it was acknowledged here, not silently dropped) (#7).
        const top = showable.reduce((a, b) => (escRank(b.level) > escRank(a.level) ? b : a));
        turn.isTransition = true; turn.takeoverLevel = top.level;
        for (const e of showable) state.transitionShown.set(e.escalation_id, e.level);
        renderConversation();
      }
    }
    state.asking = false; updateAskDisabled();
  }

  // ---- control-panel route handlers -------------------------------------------------------------
  function withMember(fn) { if (state.currentMember) fn(state.currentMember); else renderReadout({ error: "No member selected." }); }

  async function readoutRoute(pathFn) {
    if (pathFn.length && !state.currentMember) return renderReadout({ error: "No member selected." });
    const path = pathFn(state.currentMember);
    if (state.readoutKey === path) { renderReadout("—"); return; } // second click on the same route → back to default
    const r = await api("GET", path);
    renderReadout(r.data);
    state.readoutKey = path;
  }

  // POST a bundle dict, surface the result, and on success reload the picker onto it — the ingest tail
  // for Upload bundle (#11). A 422 shows the field error in the readout (the upload is the format
  // check, ui-ux §2).
  async function postBundle(bundle) {
    const r = await api("POST", "/members", bundle);
    renderReadout(r.data);
    if (r.ok) await loadMembers(r.data.member_id);
  }

  async function onUploadFile(file) {
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch (e) { return renderReadout({ error: "File is not valid JSON", detail: String(e) }); }
    await postBundle(parsed);
  }

  // ---- Phase 7 control-panel handlers (Learning group + Trajectory) -----------------------------
  async function runLearn() {
    renderReadout("Running /learn — rule-assembling a candidate prompt and gating it through the eval harness. This calls the real LLM and can take a minute…");
    const r = await api("POST", "/learn");
    renderReadout(r.data);  // {version, status, reason, report} — or a 409/503 detail
  }

  // Demonstrate a clinician range-override: widen a marker's range. Fires directly and always — it
  // prefers a non-panic out-of-range marker (so a later scan visibly clears its flag), else just takes
  // the first marker so the POST goes through regardless. Does NOT scan — run "Scan member" to see the
  // effect. Reverted by "Reset learning".
  async function sampleOverride() {
    if (!state.currentMember) return renderReadout({ error: "No member selected." });
    const m = state.currentMember;
    const traj = await api("GET", `/members/${enc(m)}/trajectory`);
    if (!traj.ok) return renderReadout(traj.data);
    const markers = traj.data || [];
    if (!markers.length) return renderReadout({ note: `${m} has no markers to override.` });
    const flagged = markers.find((t) =>
      !t.flags.some((f) => f.startsWith("panic")) &&
      (t.flags.includes("above_range") || t.flags.includes("below_range")));
    const t = flagged || markers[0];
    const latest = t.readings[t.readings.length - 1].value;
    const payload = t.flags.includes("below_range")
      ? { ref_low: Math.floor(latest * 0.5) }
      : { ref_high: Math.ceil(latest * 1.5) };
    const fb = { kind: "range_override", target: t.marker, payload, source: "clinician" };
    const r = await api("POST", `/members/${enc(m)}/feedback`, fb);
    renderReadout(r.ok ? { applied_override: fb, feedback_id: r.data.feedback_id,
      note: `Override applied to ${t.marker} on ${m}. Run "Scan member" to see its flag change; revert with "Reset learning".` } : r.data);
  }

  // ---- /feedback form: the full Feedback surface (correction kinds + signal kinds), rendered into the
  // readout. The route's payload is dict[str, Any] (permissive) but db.py reads ONLY specific keys per
  // kind, so a wrong key is silently inert — this client encodes the real per-kind contract instead of
  // trusting the schema. Each kind declares which input it needs; a marker/finding target and a typed
  // payload are assembled deterministically, never free-form, so the POST can't no-op on a typo'd key.
  const FEEDBACK_KINDS = [
    { kind: "range_override", group: "Correction", target: "marker", payload: "range",
      hint: "Re-bound a marker. Set ref_low and/or ref_high (one-sided OK). Re-resolves into analysis on the next scan." },
    { kind: "suppress_marker", group: "Correction", target: "marker", payload: "none",
      hint: "Drop a marker entirely so the core never analyzes it. Inert against a panic floor (db.py)." },
    { kind: "preference", group: "Correction", target: "none", payload: "text",
      hint: "A composer tone hint joined to the Mode-2 prompt — never a number or the escalation floor." },
    { kind: "helpful", group: "Signal", target: "finding", payload: "none", hint: "Positive signal on a finding; feeds /learn." },
    { kind: "incorrect", group: "Signal", target: "finding", payload: "none", hint: "Negative signal on a finding; feeds /learn." },
    { kind: "escalation_accept", group: "Signal", target: "finding", payload: "none", hint: "Confirm an escalation was warranted; feeds /learn." },
    { kind: "escalation_reject", group: "Signal", target: "finding", payload: "none", hint: "Mark an escalation as a false alarm; feeds /learn." },
  ];

  function feedbackForm() {
    if (!state.currentMember) return renderReadout({ error: "No member selected." });
    const m = state.currentMember;
    const host = $("#cp-readout"); host.textContent = ""; state.readoutKey = null;
    const form = el("form", "cp-form"); form.setAttribute("autocomplete", "off");

    const sel = (label, opts, val) => {
      const wrap = el("div"); wrap.appendChild(el("label", null, label));
      const s = el("select");
      for (const o of opts) { const op = el("option", null, o.text); op.value = o.value; if (o.value === val) op.selected = true; s.appendChild(op); }
      wrap.appendChild(s); return { wrap, s };
    };
    const field = (label, node) => { const w = el("div"); w.appendChild(el("label", null, label)); w.appendChild(node); return w; };

    form.appendChild(el("div", "cp-form-hint", `Member: ${m}`));
    const kind = sel("Kind", FEEDBACK_KINDS.map((k) => ({ value: k.kind, text: `${k.kind} (${k.group})` })), "range_override");
    form.appendChild(kind.wrap);
    const source = sel("Source", [{ value: "clinician", text: "clinician" }, { value: "member", text: "member" }, { value: "system", text: "system" }], "clinician");
    form.appendChild(source.wrap);

    // payload/target inputs, shown/hidden per kind
    const targetInput = el("input"); targetInput.placeholder = "marker key (e.g. HbA1c)";
    const targetField = field("Target", targetInput);
    const refLow = el("input"); refLow.type = "number"; refLow.step = "any"; refLow.placeholder = "ref_low";
    const refHigh = el("input"); refHigh.type = "number"; refHigh.step = "any"; refHigh.placeholder = "ref_high";
    const rangeRow = el("div", "cp-form-row");
    rangeRow.appendChild(field("Ref low", refLow)); rangeRow.appendChild(field("Ref high", refHigh));
    const prefText = el("textarea"); prefText.placeholder = "preference hint (tone only — never numbers)";
    const prefField = field("Preference text", prefText);
    const hint = el("div", "cp-form-hint");
    const status = el("div", "cp-form-status");
    const submit = el("button", null, "Submit feedback"); submit.type = "submit";

    form.appendChild(targetField); form.appendChild(rangeRow); form.appendChild(prefField);
    form.appendChild(hint); form.appendChild(submit); form.appendChild(status);

    const spec = () => FEEDBACK_KINDS.find((k) => k.kind === kind.s.value);
    function syncFields() {
      const k = spec();
      targetField.hidden = k.target === "none";
      targetInput.placeholder = k.target === "finding" ? "finding_id" : "marker key (e.g. HbA1c)";
      rangeRow.hidden = k.payload !== "range";
      prefField.hidden = k.payload !== "text";
      hint.textContent = k.hint;
      status.textContent = ""; status.className = "cp-form-status";
    }
    kind.s.addEventListener("change", syncFields);
    syncFields();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const k = spec();
      const target = targetInput.value.trim();
      let payload = null;
      if (k.target !== "none" && !target)
        return setStatus(status, "err", `${k.kind} needs a ${k.target === "finding" ? "finding_id" : "marker"} target — without it the feedback matches nothing and silently no-ops.`);
      if (k.payload === "range") {
        const lo = refLow.value.trim(), hi = refHigh.value.trim();
        if (!lo && !hi) return setStatus(status, "err", "range_override needs at least one of ref_low / ref_high.");
        payload = {}; if (lo) payload.ref_low = Number(lo); if (hi) payload.ref_high = Number(hi);
      } else if (k.payload === "text") {
        const t = prefText.value.trim();
        if (!t) return setStatus(status, "err", "preference needs some text.");
        payload = { text: t };
      }
      const fb = { kind: k.kind, target: k.target === "none" ? null : target, payload, source: source.s.value };
      submit.disabled = true; setStatus(status, "", "Submitting…");
      const r = await api("POST", `/members/${enc(m)}/feedback`, fb);
      submit.disabled = false;
      if (r.ok) {
        const note = k.payload === "range" || k.kind === "suppress_marker"
          ? ' Run "Scan member" to see the flag change; revert with "Reset learning".'
          : ' Feeds the next "Run learn" gate.';
        setStatus(status, "ok", `Recorded ${k.kind} (feedback_id ${r.data.feedback_id}).${note}`);
      } else {
        setStatus(status, "err", typeof r.data === "string" ? r.data : JSON.stringify(r.data));
      }
    });
    host.appendChild(form);
  }

  function setStatus(node, cls, msg) { node.className = "cp-form-status" + (cls ? " " + cls : ""); node.textContent = msg; }

  // Reset learning + factory reseed fire DIRECTLY (no confirm) — the operator panel is an unrestricted
  // API console; whatever the route returns is shown in the readout.
  async function resetLearning() {
    const r = await api("POST", "/reset");
    renderReadout(r.data);
    if (state.currentMember) await refreshEscalations(state.currentMember);  // a READ; no scan (run one to see flag changes)
  }

  async function reseed() {
    const r = await api("POST", "/admin/reseed");
    renderReadout(r.data);
    clearMemberView(); await loadMembers();  // picker repopulates with the restored 15
  }

  // ---- trajectory sparklines -------------------------------------------------------------------
  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  async function showTrajectory() {
    if (!state.currentMember) return renderReadout({ error: "No member selected." });
    const path = `/members/${enc(state.currentMember)}/trajectory`;
    if (state.readoutKey === path) { renderReadout("—"); return; }  // second click toggles back to default
    const r = await api("GET", path);
    if (!r.ok) return renderReadout(r.data);
    renderTrajectory(r.data);
    state.readoutKey = path;  // toggle armed, like readoutRoute (renderReadout disarms it on any other write)
  }

  function renderTrajectory(markers) {
    const host = $("#cp-readout");
    host.textContent = "";
    if (!markers || !markers.length) { host.textContent = "No markers."; return; }
    const wrap = el("div", "spark-wrap");
    for (const t of markers) wrap.appendChild(sparkCard(t));
    host.appendChild(wrap);
  }

  function sparkCard(t) {
    const card = el("div", "spark-card");
    const vals = t.readings.map((r) => r.value);
    const panic = t.flags.find((f) => f.startsWith("panic"));
    const flag = panic || t.flags.find((f) => f === "above_range" || f === "below_range");
    const head = el("div", "spark-head");
    head.appendChild(el("span", "spark-name", t.marker));
    if (flag) {
      const lab = el("span", "spark-flag" + (panic ? " panic" : ""));
      lab.textContent = `${panic ? "‼" : "⚑"} ${flag.replace("_", " ")}`;  // icon + TEXT (never colour alone)
      head.appendChild(lab);
    }
    card.appendChild(head);
    card.appendChild(sparkSvg(t, vals, !!panic, !!flag));
    const last = t.readings[t.readings.length - 1];
    // show the Theil–Sen direction where one is asserted; for a sub-n_min series (no MK verdict) say so
    // explicitly, so the absent trend line reads as an honest abstention rather than a missing element.
    const dir = t.trend
      ? (t.trend.slope != null ? ` · ${t.trend.direction}` : "")
      : " · trend not computed (short series)";
    card.appendChild(el("div", "spark-sub", `${vals.length} readings · latest ${last ? last.value : "—"} ${t.unit || ""}${dir}`));
    return card;
  }

  function sparkSvg(t, vals, panic, flagged) {
    const W = 240, H = 46, pad = 5, n = vals.length;
    const rr = t.reference_range || {};
    const domain = [...vals];
    if (t.theil_sen) for (const p of t.theil_sen) domain.push(p.value);
    if (rr.ref_low != null) domain.push(rr.ref_low);
    if (rr.ref_high != null) domain.push(rr.ref_high);
    let lo = Math.min(...domain), hi = Math.max(...domain);
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = (i) => (n <= 1 ? W / 2 : pad + (i / (n - 1)) * (W - 2 * pad));
    const y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "spark", width: W, height: H, role: "img", "aria-label": `${t.marker} trend over ${n} readings` });
    if (rr.ref_low != null && rr.ref_high != null)  // the normal band, faint
      s.appendChild(svg("rect", { x: 0, y: y(rr.ref_high), width: W, height: Math.max(1, y(rr.ref_low) - y(rr.ref_high)), fill: "#2C2823" }));
    if (t.theil_sen && t.theil_sen.length === 2)  // the already-computed Theil–Sen line, dashed
      s.appendChild(svg("line", { x1: x(0), y1: y(t.theil_sen[0].value), x2: x(n - 1), y2: y(t.theil_sen[1].value), stroke: "#8A8276", "stroke-width": 1, "stroke-dasharray": "3 3" }));
    s.appendChild(svg("polyline", { points: vals.map((v, i) => `${x(i)},${y(v)}`).join(" "), fill: "none", stroke: "#9FBBE9", "stroke-width": 1.5 }));
    vals.forEach((v, i) => {
      const isLast = i === n - 1, mark = isLast && flagged;
      s.appendChild(svg("circle", { cx: x(i), cy: y(v), r: mark ? 3.5 : 2, fill: mark ? (panic ? "#E8957A" : "#E0B86A") : "#9FBBE9" }));
    });
    return s;
  }

  // ============================== RENDER ==========================================================
  function renderControlPanel() {
    const host = $("#cp-groups"); host.innerHTML = "";
    const groups = [...new Set(ROUTES.map((r) => r.group))];
    for (const g of groups) {
      const sec = el("div", "cp-group");
      sec.appendChild(el("h3", null, g));
      for (const route of ROUTES.filter((r) => r.group === g)) {
        const b = el("button", "cp-btn" + (route.destructive ? " destructive" : ""));
        b.setAttribute("data-tip", route.tip);        // the styled hover tooltip
        b.setAttribute("aria-label", `${route.label}. ${route.tip}`); // screen-reader text (no title= → no duplicate native tooltip)
        b.appendChild(el("span", "verb", route.verb));
        b.appendChild(document.createTextNode(route.label));
        b.addEventListener("click", route.handler);
        sec.appendChild(b);
      }
      host.appendChild(sec);
    }
  }

  // ---- custom member dropdown (see .dropdown CSS for why it isn't a native <select>) ---------------
  const memberLabel = (m) => `${m.member_id} · ${m.sex}${m.age != null ? ", " + m.age : ""}`;

  function renderMemberPicker() {
    const list = $("#member-picker-list"); list.innerHTML = "";
    $("#picker-wrap").hidden = !operatorView;
    for (const m of state.members) {
      const li = el("li", "dd-opt", memberLabel(m));
      li.setAttribute("role", "option");
      li.dataset.value = m.member_id;
      li.addEventListener("click", () => commitPicker(m.member_id));
      list.appendChild(li);
    }
    syncPicker();
  }

  // reflect state.currentMember in the button label + the selected-row marker (replaces select.value = id)
  function syncPicker() {
    const m = state.members.find((x) => x.member_id === state.currentMember);
    $("#member-picker-label").textContent = m ? memberLabel(m) : "Select member";
    for (const li of $("#member-picker-list").children)
      li.setAttribute("aria-selected", String(li.dataset.value === state.currentMember));
  }

  const pickerOpen = () => !$("#member-picker-list").hidden;

  function openPicker() {
    if (!state.members.length) return;
    $("#member-picker-list").hidden = false;
    $("#member-picker-btn").setAttribute("aria-expanded", "true");
    setPickerActive([...$("#member-picker-list").children]
      .findIndex((li) => li.dataset.value === state.currentMember));
  }

  function closePicker() {
    $("#member-picker-list").hidden = true;
    $("#member-picker-btn").setAttribute("aria-expanded", "false");
  }

  function setPickerActive(i) {
    const opts = [...$("#member-picker-list").children];
    if (!opts.length) return;
    const idx = (i + opts.length) % opts.length;
    opts.forEach((li, k) => li.classList.toggle("active", k === idx));
    opts[idx].scrollIntoView({ block: "nearest" });
  }

  function movePickerActive(delta) {
    const opts = [...$("#member-picker-list").children];
    const cur = opts.findIndex((li) => li.classList.contains("active"));
    setPickerActive((cur < 0 ? 0 : cur) + delta);
  }

  // commit a selection: close, restore focus, and switch member only on an actual change (a native
  // <select> fires no `change` when re-picking the current value — match that, incl. the stale-readout clear).
  function commitPicker(id) {
    closePicker();
    $("#member-picker-btn").focus();
    if (id && id !== state.currentMember) {
      renderReadout("—");   // the prior member's route response is stale on switch (#3)
      selectMember(id);
    }
  }

  function onPickerKey(e) {
    if (e.key === "Escape") { if (pickerOpen()) { e.preventDefault(); closePicker(); } return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!pickerOpen()) { openPicker(); return; }
      movePickerActive(e.key === "ArrowDown" ? 1 : -1);
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && pickerOpen()) {
      e.preventDefault();
      const active = $("#member-picker-list").querySelector(".dd-opt.active");
      if (active) commitPicker(active.dataset.value);
    }
  }

  function renderModeToggle() {
    $("#mode1-btn").setAttribute("aria-checked", String(state.mode === 1));
    $("#mode2-btn").setAttribute("aria-checked", String(state.mode === 2));
    $("#chips").hidden = state.mode !== 1;
    $("#ask-form").hidden = state.mode !== 2;
  }

  // The ambient escalation flag beside the Observations heading. A load failure is NOT shown here — it
  // surfaces in the panel body with a Retry (renderObservations), so the flag stays a pure all-clear/flagged
  // signal and a failed load is never mistaken for an escalation (#4). Coloured by severity, never colour
  // alone: it carries a hover/focus message and an aria-label (§8).
  function renderEscalationFlag() {
    const flag = $("#obs-flag");
    const active = state.loadError ? [] : state.activeEscalations;
    if (!active.length) { flag.hidden = true; return; }
    const anyUrgent = active.some((e) => e.level === "urgent");
    // No count: the flag ambiently summarises BOTH scan findings and chat escalations (ui-ux §107/§110),
    // but the Observations panel only renders scan findings — so any number is unverifiable against what
    // the member can "view". The flag shows on active.length >= 1. Glyph + message differ by tier so the
    // urgent/attention distinction is never colour alone (§8): ‼ vs ⚑, matching ESCALATION_META.
    const msg = anyUrgent
      ? "Urgent: some results have been flagged for your care team."
      : "Some results have been flagged for your care team.";
    flag.hidden = false;
    flag.textContent = anyUrgent ? "‼" : "⚑";
    flag.className = `obs-flag tip-below ${anyUrgent ? "urgent" : "attention"}`;
    flag.setAttribute("data-tip", msg);
    flag.setAttribute("aria-label", msg);
  }

  function renderConversation() {
    const log = $("#conversation-log");
    if (!state.log.length) {
      log.replaceChildren(el("div", "empty-hint",
        state.mode === 1
          ? "Pick a suggested question below, or switch to Mode 2 to ask in your own words."
          : "Ask about your results in your own words below."));
      return;
    }
    // re-insert cached nodes for unchanged turns + build only new/changed ones (#6)
    log.replaceChildren(...state.log.map(turnNode));
    log.scrollTop = log.scrollHeight;
  }

  // a turn's rendered node, cached by identity + a signature of the render-affecting fields (kind/text;
  // for an assistant card, whether a takeover was added). An unchanged turn returns its EXISTING node,
  // which replaceChildren moves rather than recreates — so an expanded <details> (evidence / trace)
  // survives the next turn's render instead of snapping shut (#6).
  function turnNode(turn) {
    const sig = turn.kind === "assistant"
      ? `a:${turn.isTransition}:${turn.takeoverLevel}`
      : `${turn.kind}:${turn.text || ""}`;
    const cached = _turnNodes.get(turn);
    if (cached && cached.sig === sig) return cached.node;
    let node;
    if (turn.kind === "member") node = el("div", "member-bubble", turn.text);
    else if (turn.kind === "pending") node = el("div", "pending", "…thinking");
    else if (turn.kind === "error") node = el("div", "answer-card refused", turn.text);
    else node = renderAnswerCard(turn);
    _turnNodes.set(turn, { node, sig });
    return node;
  }

  // the two-axis card: BODY follows answer_disposition, CHROME follows escalation, independently (§3/§4)
  function renderAnswerCard(turn) {
    const resp = turn.resp;
    const disp = DISPOSITION_META[resp.answer_disposition] || DISPOSITION_META.answered;
    const card = el("div", `answer-card ${disp.cls}`);

    // loud takeover — transition turn ONLY; every later turn stays clean (the banner carries status)
    if (turn.isTransition && turn.takeoverLevel && turn.takeoverLevel !== "none") {
      const m = ESCALATION_META[turn.takeoverLevel];
      const t = el("div", `takeover ${turn.takeoverLevel}`);
      t.appendChild(el("span", "t-icon", m.icon));
      const tx = el("div");
      tx.appendChild(el("div", "t-label", m.label));
      tx.appendChild(el("div", "t-step", m.step));
      t.appendChild(tx);
      card.appendChild(t);
    }

    if (disp.tag) card.appendChild(el("div", "disp-tag", disp.tag));
    const answer = el("div", "answer-text");
    answer.innerHTML = mdToHtml(resp.answer || "");   // safe: mdToHtml escapes first, emits a fixed tag set
    card.appendChild(answer);
    if (resp.uncertainty) card.appendChild(el("div", "uncertainty", resp.uncertainty));

    // evidence chips — collapsed by default; only for an answered card that actually cites readings
    // (a friendly redirect / refusal shows no chips — ui-ux §4).
    const findings = (resp.answer_disposition === "answered") ? (resp.findings || []) : [];
    const withEvidence = findings.filter((f) => (f.evidence || []).length);
    if (withEvidence.length) {
      const n = withEvidence.reduce((a, f) => a + f.evidence.length, 0);
      const d = el("details", "evidence");
      const s = el("summary", null, `▸ Evidence (${n})`);
      s.setAttribute("title", "Show the readings each claim is based on");
      d.appendChild(s);
      for (const f of withEvidence) {
        if (f.text) d.appendChild(el("div", "finding-text", f.text));
        for (const ev of f.evidence) d.appendChild(renderChipRow(ev));
      }
      card.appendChild(d);
    }

    if (operatorView && resp.metadata) card.appendChild(renderTrace(resp.metadata));
    return card;
  }

  function renderChipRow(ev) {
    const row = el("div", "chip");
    row.appendChild(el("span", "c-marker", ev.marker));
    row.appendChild(el("span", "c-value", `${ev.value} ${ev.unit}`));
    row.appendChild(el("span", "c-date", ev.date));
    if (ev.ref_low != null || ev.ref_high != null) {
      const lo = ev.ref_low != null ? ev.ref_low : "–";
      const hi = ev.ref_high != null ? ev.ref_high : "–";
      row.appendChild(el("span", "c-range", `ref ${lo}–${hi}`));
    }
    if (ev.stat) row.appendChild(el("span", "c-stat", ev.stat));
    return row;
  }

  function renderTrace(md) {
    const d = el("details", "trace");
    const s = el("summary", null, "▸ trace");
    s.setAttribute("title", "Operator: the reproducibility + cost trace for this answer");
    d.appendChild(s);
    const g = el("div", "trace-grid");
    const rows = [
      ["model", md.model_version], ["data_version", md.data_version],
      ["config_version", md.config_version], ["prompt_version", md.prompt_version],
      ["latency_ms", md.latency_ms], ["tokens", md.tokens], ["cost_usd", md.cost_usd],
    ];
    for (const [k, v] of rows) if (v != null) g.appendChild(el("div", null, `${k}: ${v}`));
    d.appendChild(g);
    return d;
  }

  function renderChips() {
    const host = $("#chips"); host.innerHTML = "";
    if (state.mode !== 1) return;
    for (const sp of state.chips) {
      const b = el("button", "suggest-chip", sp.prompt);
      b.setAttribute("title", sp.prompt);
      b.addEventListener("click", () => onChipClick(sp));
      host.appendChild(b);
    }
    // when the map thins to revisits/anchors, surface the clean handoff to Mode 2 (architecture §2)
    if (state.currentMember) {
      const h = el("button", "suggest-chip handoff", "Don't see your question? Ask in your own words →");
      h.setAttribute("title", "Switch to Mode 2 (ask in your own words)");
      h.addEventListener("click", () => setMode(2));
      host.appendChild(h);
    }
  }

  function renderObservations() {
    const host = $("#observations-list"); host.innerHTML = "";
    if (state.loadError) {  // honest: a failed load is not an all-clear (#4)
      host.appendChild(el("div", "obs-sub", "⚠ Couldn't load your results — check your connection."));
      const retry = el("button", "suggest-chip", "Retry");
      retry.addEventListener("click", () => { if (state.currentMember) selectMember(state.currentMember); });
      host.appendChild(retry);
      return;
    }
    if (!state.observations.length) {
      host.appendChild(el("div", "obs-sub", state.currentMember ? "Nothing stands out right now." : "Select a member."));
      return;
    }
    for (const obs of state.observations) {
      const meta = SEVERITY_META[obs.severity] || SEVERITY_META.info;
      const item = el("div", `obs-item ${meta.cls}`);
      const kicker = el("div", "obs-kicker");
      kicker.appendChild(el("span", null, meta.icon));
      kicker.appendChild(el("span", null, meta.label));
      item.appendChild(kicker);
      item.appendChild(el("div", "obs-title", obs.title));
      const d = el("details");
      d.appendChild(el("summary", null, "why am I seeing this?"));
      d.appendChild(el("div", "obs-why", obs.trigger_reason));
      item.appendChild(d);
      host.appendChild(item);
    }
  }

  function renderReadout(data) {
    state.readoutKey = null;  // any non-toggle write disarms the toggle, so the next route click shows output
    $("#cp-readout").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }

  function updateAskDisabled() {
    const btn = $("#ask-form button"); const inp = $("#ask-input");
    const blocked = state.asking || state.loading;  // also blocked while the member loads (#2)
    if (btn) btn.disabled = blocked;
    if (inp) inp.disabled = blocked;
  }

  // ---- resizable side panels (drag the gutters; widths held in memory only — no storage, CLAUDE.md) -
  // The 40vw ceiling here MUST match the grid template's clamp(): both sides capped at 40vw guarantees
  // the centre always keeps ~20vw above the stacking breakpoint. sign maps a rightward drag to a width
  // delta (+1 the left panel grows, -1 the right panel grows as its separator moves left).
  const MAX_FRAC = 0.4;
  const RESIZE = {
    control: { cssVar: "--control-w", def: 248, min: 170, sign: 1,  panel: ".control" },
    obs:     { cssVar: "--obs-w",     def: 300, min: 220, sign: -1, panel: ".observations" },
  };

  function wireResizers() {
    for (const handle of document.querySelectorAll(".resizer")) {
      const cfg = RESIZE[handle.dataset.resize];
      const panel = $(cfg.panel);

      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = panel.getBoundingClientRect().width; // live width, not the var (clamp may cap it)
        handle.setPointerCapture(e.pointerId);
        handle.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        const onMove = (ev) => applyWidth(handle, cfg, startW + cfg.sign * (ev.clientX - startX));
        const onUp = () => {
          handle.classList.remove("dragging");
          document.body.style.cursor = "";
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          handle.removeEventListener("pointercancel", onUp);
        };
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
        handle.addEventListener("pointercancel", onUp);
      });

      // keyboard: ←/→ moves the separator (the panel grows in the arrow's direction); Home resets
      handle.addEventListener("keydown", (e) => {
        if (e.key === "Home") { applyWidth(handle, cfg, cfg.def); e.preventDefault(); return; }
        const dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!dir) return;
        e.preventDefault();
        const cur = panel.getBoundingClientRect().width;
        applyWidth(handle, cfg, cur + cfg.sign * dir * (e.shiftKey ? 48 : 16));
      });

      handle.addEventListener("dblclick", () => applyWidth(handle, cfg, cfg.def));
      syncAria(handle, cfg, panel);
    }
    // forward-safe: if the operator surface is ever hidden (operatorView=false), don't dangle its gutter
    if (!operatorView) $('.resizer[data-resize="control"]').hidden = true;
    // the layout re-flexes on resize via the CSS clamp with no JS, but the separators' announced
    // aria-valuenow/valuemax would otherwise go stale — re-sync them when the window resizes (#14).
    window.addEventListener("resize", () => {
      for (const h of document.querySelectorAll(".resizer")) {
        const c = RESIZE[h.dataset.resize];
        syncAria(h, c, $(c.panel));
      }
    });
  }

  function applyWidth(handle, cfg, desired) {
    const max = Math.round(window.innerWidth * MAX_FRAC);
    const px = Math.max(cfg.min, Math.min(Math.round(desired), max));
    document.documentElement.style.setProperty(cfg.cssVar, px + "px");
    syncAria(handle, cfg, $(cfg.panel));
  }

  function syncAria(handle, cfg, panel) {
    handle.setAttribute("aria-valuenow", String(Math.round(panel.getBoundingClientRect().width)));
    handle.setAttribute("aria-valuemin", String(cfg.min));
    handle.setAttribute("aria-valuemax", String(Math.round(window.innerWidth * MAX_FRAC)));
  }

  // ---- static handlers --------------------------------------------------------------------------
  function setMode(m) { state.mode = m; renderModeToggle(); renderChips(); }

  // clicking the Observations flag: bring the flagged observations into view AND pulse them, so the action
  // is visible even on desktop where the panel is already on-screen (scrollIntoView alone is a no-op).
  function viewFlagged() {
    const obs = $(".observations");
    const flagged = [...obs.querySelectorAll(".obs-item.attention, .obs-item.urgent")];
    const targets = flagged.length ? flagged : [...obs.querySelectorAll(".obs-item")];
    (targets[0] || obs).scrollIntoView({ behavior: "smooth", block: "nearest" });
    for (const item of targets) { item.classList.remove("flash"); void item.offsetWidth; item.classList.add("flash"); }
  }

  function wireStaticHandlers() {
    // member dropdown: toggle on the button, navigate with keyboard, close on outside-click (the
    // stale-readout clear + member switch happen in commitPicker on an option choice).
    $("#member-picker-btn").addEventListener("click", () => (pickerOpen() ? closePicker() : openPicker()));
    $("#member-picker-btn").addEventListener("keydown", onPickerKey);
    $("#member-picker-list").addEventListener("keydown", onPickerKey);
    document.addEventListener("click", (e) => {
      if (pickerOpen() && !$("#member-dd").contains(e.target)) closePicker();
    });
    $("#mode1-btn").addEventListener("click", () => setMode(1));
    $("#mode2-btn").addEventListener("click", () => setMode(2));
    $("#obs-flag").addEventListener("click", viewFlagged);
    $("#upload-file").addEventListener("change", (e) => { if (e.target.files[0]) onUploadFile(e.target.files[0]); e.target.value = ""; });
    $("#ask-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = $("#ask-input").value.trim();
      if (v) { $("#ask-input").value = ""; onAsk(v); }
    });
    renderModeToggle();
  }

  boot();
})();
</script>
</body>
</html>
