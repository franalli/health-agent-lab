<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<title>Health Intelligence Service</title>
<link rel="icon" href="data:," /><!-- silence the default /favicon.ico 404 (no asset pipeline) -->
<!--
  Phase 6 — the thin consumer surface (docs/ui-ux.md). One static page, vanilla JS, NO build step,
  NO browser storage (state lives in memory only — CLAUDE.md). FastAPI serves this same-origin at /,
  so every fetch is a relative path and there is no CORS.

  Three regions (ui-ux §2): an operator CONTROL PANEL (left, held apart, not member-facing), the
  member CONVERSATION (center, Mode 1 chips + Mode 2 ask), and proactive OBSERVATIONS (right). The
  card splits BODY (answer_disposition) from CHROME (escalation) on two independent axes (§4); an
  escalation is loud exactly once then ambient (§4 hard rule); severity/disposition/escalation are
  never conveyed by colour alone — icon + text label everywhere (§8).
-->
<style>
  :root {
    --bg:#F1F0EC; --panel:#FFFFFF; --panel-2:#F6F4F0; --panel-3:#EEEBE4;
    --ink:#1A1916; --muted:#76726B; --faint:#9C988F;
    --line:#E6E2DA; --line-soft:#EFEBE3;
    --accent:#5B2A49; --accent-press:#491F3B; --accent-tint:#F3EBEF; --accent-ink:#FFFFFF;
    --accent-blue:#5E7BB0;  /* brand blue (the member-trajectory line tone) — readable on white, used for GET verbs */
    --good:#5F9457; --sand:#D6C4AC; --periwinkle:#9FBBE9; --coral:#E06A45;
    /* calm, never klaxon — attention = honey, urgent = coral; always paired with icon+text (§8) */
    --amber-bg:#FBF1DC; --amber-line:#D9A53E; --amber-ink:#7E5C1B;
    --red-bg:#FAE7DF; --red-line:#E06A45; --red-ink:#9C3A1F;
    --info-ink:#76726B;
    --radius:16px;
    --shadow-sm:0 1px 2px rgba(40,33,25,.05);
    --shadow:0 8px 26px rgba(40,33,25,.08);
    /* resizable layout: side-column widths (drag-set, in memory only) + gutter track width */
    --control-w:248px; --obs-w:300px; --gutter:7px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 400 15px/1.55 'Hanken Grotesk', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; }
  button { font: inherit; cursor: pointer; color: inherit; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  ::selection { background: var(--accent-tint); }

  /* ---- header ---------------------------------------------------------------------------------- */
  /* position+z-index so header sits in its own stacking context ABOVE main; without it, the
     later-in-DOM observations panel paints over header's escaping tooltips/dropdown and clips them. */
  header { position: relative; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 13px 22px; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: var(--ink); margin-right: auto; white-space: nowrap; }
  /* sample-data notice — a persistent warning glyph (full text on hover/focus via data-tip; aria-label for SR) */
  .data-warning { font-size: 15px; line-height: 1; color: var(--amber-line); cursor: help; display: inline-flex; }
  .data-warning:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 5px; }
  .picker-wrap, .mode-wrap { display: flex; align-items: center; gap: 9px; }
  .picker-wrap label, .mode-wrap > span { font-size: 12px; font-weight: 500; color: var(--muted); }
  /* custom member dropdown — always anchored UNDER the button (top:100%), button-width */
  .dropdown { position: relative; }
  .dd-btn {
    font: inherit; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
    min-width: 164px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s;
  }
  .dd-btn:hover { border-color: var(--faint); background: var(--panel-2); }
  .dd-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dd-caret { font-size: 9px; color: var(--muted); }
  .dd-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60; margin: 0; padding: 6px;
    list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); max-height: 300px; overflow-y: auto;
  }
  .dd-list[hidden] { display: none; }
  .dd-opt { padding: 8px 10px; border-radius: 9px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .dd-opt:hover, .dd-opt.active { background: var(--panel-2); }
  .dd-opt[aria-selected="true"] { font-weight: 600; color: var(--accent); }

  /* mode toggle — Ahead nav-pill (dark active on a soft track) */
  .mode-toggle { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); }
  .mode-toggle button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; font-size: 13px; font-weight: 500; border-radius: 999px; white-space: nowrap; transition: color .15s, background .15s; }
  .mode-toggle button:hover { color: var(--ink); }
  .mode-toggle button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* ambient escalation flag — a badge on the Observations tab label (§4 layer 2), so it stays visible even
     on the Trajectory tab. A non-interactive span inside the tab <button>; clicks bubble to the tab. */
  .obs-flag { border: 0; background: transparent; padding: 0; margin-left: 6px; cursor: inherit; font-size: 13.5px; line-height: 1; vertical-align: middle; }
  .obs-flag.attention { color: var(--amber-line); }
  .obs-flag.urgent { color: var(--red-line); }
  .obs-flag[hidden] { display: none; }

  /* ---- layout ---------------------------------------------------------------------------------- */
  /* Three regions on a grid; side columns drag-resizable via .resizer gutters. Widths live in
     --control-w / --obs-w, each wrapped in clamp(min, var, 40vw) so the layout re-flexes with NO JS
     resize listener and the two sides can never starve the centre above the stacking breakpoint. */
  main {
    display: grid;
    grid-template-columns:
      clamp(170px, var(--control-w), 40vw)
      var(--gutter)
      minmax(0, 1fr)
      var(--gutter)
      clamp(220px, var(--obs-w), 40vw);
    gap: 0; flex: 1; min-height: 0;
  }
  body.member-only .control,
  body.member-only .resizer[data-resize="control"] { display: none; }
  body.member-only main {
    grid-template-columns: 0 0 minmax(0, 1fr) var(--gutter) clamp(220px, var(--obs-w), 40vw);
  }
  aside, .center { min-height: 0; overflow: auto; }
  /* operator rail: held visually apart (warm utility tint). overflow-y:auto forces overflow-x:auto, so
     it clips in-flow tooltips — route descriptions are drawn as a fixed-position .cp-tip to the RIGHT
     (JS, escaping the clip) instead of an ::after; children don't shrink. */
  .control { display: flex; flex-direction: column; background: var(--panel-3); padding: 16px 14px; overflow-y: auto; }
  .control > * { flex-shrink: 0; }
  .center { display: flex; flex-direction: column; background: var(--bg); }
  /* observations keeps overflow:visible so the tab-flag tooltip can escape; the tab bar is fixed, each body scrolls. */
  .observations { display: flex; flex-direction: column; background: var(--panel); padding: 18px 17px; overflow: visible; }
  .observations > .rp-tabs { flex-shrink: 0; }
  .rp-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .rp-body[hidden] { display: none; }

  /* drag gutter — transparent col-resize track; centred 1px ::before is the resting divider. */
  .resizer { position: relative; background: transparent; cursor: col-resize; touch-action: none; user-select: none; }
  .resizer::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%);
    background: var(--line); transition: width .12s, background .12s;
  }
  .resizer:hover::before, .resizer.dragging::before, .resizer:focus-visible::before { width: 3px; background: var(--accent); }
  .resizer:focus-visible { outline: none; }

  /* narrow screens: stack to one scrolling column and drop the gutters */
  @media (max-width: 820px) {
    main { display: block; overflow-y: auto; }
    .resizer { display: none; }
    .control { border-bottom: 1px solid var(--line); }
    .observations { border-top: 1px solid var(--line); }
    .control, .center, .observations { overflow: visible; }
    .center { min-height: 60vh; }
  }

  /* ---- control panel (operator — deliberately plain, held apart) -------------------------------- */
  /* rail banner: names the audience split OUT LOUD (ui-ux §2). The member surface is the centre chat +
     right panel; this rail is the operator/clinician console — the label keeps a reviewer (or member
     build) from reading admin controls as part of the member experience. */
  .cp-header { margin: 0 0 10px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
  .cp-header strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
  .cp-header span { display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.4; color: var(--faint); }
  /* Drag-and-drop bundle upload. The primary path in browsers whose native file picker won't open
     (a Chrome instance can silently refuse the OS file-selection dialog); a drop delivers the file
     without ever invoking that dialog. Click is a fallback for browsers where the picker works. */
  .dropzone {
    display: block; width: 100%; text-align: center; cursor: pointer; margin: 0 0 6px;
    border: 1px dashed #CDC6B8; border-radius: 10px; background: var(--panel);
    padding: 10px 12px; font-size: 11.5px; line-height: 1.45; color: var(--faint);
    transition: border-color .15s, background .15s, color .15s;
  }
  .dropzone:hover { border-color: var(--faint); }
  .dropzone.dragover { border-color: var(--accent); background: var(--panel-2); color: var(--accent); }
  .dropzone strong { color: var(--accent); font-weight: 600; }
  /* boot / data-load failure: a visible retry instead of a blank shell when the first fetch fails
     (e.g. the page loaded while the dev server was restarting). */
  .boot-error { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 16px; text-align: center; }
  .boot-retry {
    border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
    padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer;
  }
  .boot-retry:hover { border-color: var(--faint); background: var(--panel-2); }
  /* system error banner — ONE shared strip under the header for any failed request (network / 409 lock
     contention / 503 provider-down / 422 rejection / 5xx). Amber on purpose: coral is reserved for
     CLINICAL urgency (§8), so a system fault must never wear the colour of a health alert. Every message
     is title (what failed) + explanation (why, in plain words) + action (what to do — e.g. "try again in
     a few seconds"); the newest error replaces the previous one, ✕ dismisses, and any later successful
     request auto-clears it so a stale "server unreachable" can't outlive the recovery. */
  .sys-banner {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--amber-bg); border-bottom: 1px solid var(--amber-line);
    padding: 9px 22px; font-size: 13px; line-height: 1.45; color: var(--amber-ink);
  }
  .sys-banner[hidden] { display: none; }
  .sys-banner-icon { flex: none; line-height: 1.45; }
  .sys-banner-text { flex: 1; min-width: 0; }
  .sys-banner-text strong { font-weight: 600; margin-right: 6px; }
  .sys-banner-text .sys-banner-act { font-weight: 600; white-space: nowrap; }
  .sys-banner-detail { display: block; margin-top: 2px; font-size: 12px; color: #96742E; word-break: break-word; }
  .sys-banner button {
    flex: none; border: 1px solid var(--amber-line); background: transparent; color: var(--amber-ink);
    border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  }
  .sys-banner button:hover { background: rgba(217,165,62,.15); }
  .sys-banner .sys-banner-x { border: none; padding: 3px 6px; font-size: 13px; }
  .cp-group { margin-bottom: 14px; }
  .cp-group h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; margin-bottom: 7px; }
  .cp-btn {
    position: relative; display: block; width: 100%; text-align: left; margin-bottom: 6px;
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 13px; font-size: 12.5px; font-weight: 500; color: var(--ink);
    transition: border-color .15s, background .15s;
  }
  .cp-btn:hover { border-color: var(--faint); background: var(--panel-2); }
  .cp-btn .verb { font-size: 9px; font-weight: 700; letter-spacing: .05em; color: var(--accent); margin-right: 7px; }
  .cp-btn .verb-get { color: var(--accent-blue); }   /* GET verbs in brand blue; POST stays accent purple (rule above) */
  .cp-btn.destructive .verb { color: var(--coral); }
  .cp-btn.destructive:hover { border-color: var(--coral); }

  /* hover tooltip — "what does this button do" (escapes the narrow column to the right) */
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 0; z-index: 50;
    /* white-space:normal is required — the tooltip ::after inherits nowrap from hosts like
       .mode-toggle button, which would defeat the fixed width and run the text off-screen. */
    width: 230px; white-space: normal; background: var(--ink); color: #F5F2EC; font-size: 11.5px; line-height: 1.45;
    padding: 8px 10px; border-radius: 9px; box-shadow: var(--shadow); pointer-events: none;
  }
  .tip-below:hover::after, .tip-below:focus-visible::after { left: auto; right: 0; top: calc(100% + 6px); }
  /* cp-btn route tooltips are rendered by JS as a fixed-position .cp-tip to the RIGHT (escaping the rail's
     overflow clip), so the in-flow ::after is suppressed here to avoid a second, clipped tooltip. */
  .cp-btn[data-tip]:hover::after, .cp-btn[data-tip]:focus-visible::after { content: none; }
  .cp-tip {
    position: fixed; z-index: 100; width: 240px; max-width: 42vw;
    background: var(--ink); color: #F5F2EC; font-size: 11.5px; line-height: 1.45;
    padding: 8px 10px; border-radius: 9px; box-shadow: var(--shadow);
    pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .12s ease;
  }
  .cp-tip.show { opacity: 1; visibility: visible; }
  /* the leading route (METHOD /path) is emphasised in its verb colour — same semantic as the rail's
     .verb/.verb-get, but lightened to read on the dark tooltip (the rail's #5B2A49 is too dark here). */
  .cp-tip .cp-tip-route { font-weight: 700; }
  .cp-tip .cp-tip-route.post { color: #D9A6C6; }  /* lightened --accent purple, readable on --ink */
  .cp-tip .cp-tip-route.get  { color: #9FBBE9; }  /* --periwinkle, the on-dark twin of --accent-blue */
  .cp-tip .cp-tip-route.danger { color: #EB9476; }  /* lightened --coral — destructive routes (matches the button verb) */

  .readout-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; margin: 16px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #readout-toggle { display: inline-flex; align-items: center; justify-content: center; padding: 2px; border: none; background: none; color: var(--accent); cursor: pointer; border-radius: 4px; opacity: .7; }
  #readout-toggle:hover { opacity: 1; background: rgba(0,0,0,.06); }
  #readout-toggle svg { transition: transform .15s ease; }
  #readout-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
  .control.readout-collapsed #cp-readout { display: none; }
  /* The whole control rail is the scroller (.control overflow-y:auto). The readout is NOT its own
     scroll box: it grows with its content (e.g. a tall feedback form) and flexes UP to fill the slack,
     so the rail scrolls as one — not just the readout. (flex-shrink:0 + overflow:visible keep it from
     collapsing into a tiny internally-scrolling pane.) */
  .control .readout-label { margin-top: 12px; }
  #cp-readout {
    background: #211E1A; color: #D6CFC4; border-radius: 12px; padding: 11px; font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    flex: 1 0 auto; min-height: 240px; overflow: visible;
  }
  /* default empty state ("—"): collapse to a small window rather than reserving the full readout height. */
  #cp-readout.is-empty { flex: 0 0 auto; min-height: 0; padding: 8px 11px; color: #6E685E; text-align: center; }

  /* ---- feedback form (rendered into #cp-readout — styled for the dark readout) ------------------- */
  .cp-form { display: flex; flex-direction: column; gap: 8px; font-family: inherit; color: #E7E0D5; }
  .cp-form label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #A59C8C; margin-bottom: 2px; display: block; }
  .cp-form select, .cp-form input, .cp-form textarea {
    width: 100%; box-sizing: border-box; background: #2C2823; color: #E7E0D5;
    border: 1px solid #45403A; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12px;
  }
  .cp-form textarea { resize: vertical; min-height: 44px; }
  .cp-form .cp-form-row { display: flex; gap: 8px; }
  .cp-form .cp-form-row > div { flex: 1; }
  .cp-form button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 10px;
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 2px;
  }
  .cp-form button:disabled { opacity: .5; cursor: default; }
  .cp-form-hint { font-size: 10.5px; color: #A59C8C; line-height: 1.45; }
  .cp-form-status { font-size: 11px; line-height: 1.45; white-space: pre-wrap; }
  .cp-form-status.ok { color: #9BD3A0; }
  .cp-form-status.err { color: #E8A28C; }
  /* confirm-gate popup for destructive routes (house style: a custom modal, never native confirm()) */
  .cp-modal-backdrop { position: fixed; inset: 0; z-index: 1000; background: rgba(15,13,11,.5);
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  .cp-modal { background: #211E1A; color: #E7E0D5; border: 1px solid #3A352E; border-radius: 12px;
    padding: 18px; width: min(380px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .cp-modal-title { font-size: 14px; font-weight: 700; color: #F0E9DD; margin-bottom: 8px; }
  .cp-modal-body { font-size: 12px; line-height: 1.55; color: #B8B0A2; margin-bottom: 16px; }
  /* type-to-confirm challenge (the SECOND confirmation gate on the hardest wipes: Confirm stays
     disabled until the exact challenge word is typed) */
  .cp-modal-challenge { margin: -6px 0 16px; }
  .cp-modal-challenge-hint { font-size: 11.5px; line-height: 1.5; color: #E8A28C; margin-bottom: 8px; }
  .cp-modal-challenge input { width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px;
    background: #1A1714; color: #E7E0D5; border: 1px solid #4A443B; border-radius: 8px; padding: 8px 10px; }
  .cp-modal-challenge input:focus { outline: none; border-color: var(--coral); }
  .cp-modal-challenge input:disabled { opacity: .5; }
  .cp-modal-row { display: flex; gap: 8px; justify-content: flex-end; }
  .cp-modal button { font: inherit; font-size: 12px; font-weight: 600; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; border: 0; }
  .cp-modal button:disabled { opacity: .5; cursor: default; }
  .cp-modal button.cp-confirm-go { background: var(--coral); color: #fff; }
  .cp-modal button.cp-confirm-cancel { background: transparent; color: #C9C2B6; border: 1px solid #4A443B; }
  .cp-modal-status { font-size: 11px; margin-top: 10px; min-height: 0; }
  .cp-modal-status.err { color: #E8A28C; }

  /* ---- conversation ---------------------------------------------------------------------------- */
  #conversation-log { flex: 1; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px; }
  .empty-hint { color: var(--muted); font-size: 14px; line-height: 1.55; text-align: center; max-width: 340px; margin: auto; }
  .member-bubble {
    align-self: flex-end; max-width: 78%; background: var(--accent); color: #fff;
    padding: 11px 15px; border-radius: 18px 18px 5px 18px; font-size: 14.5px; line-height: 1.5; box-shadow: var(--shadow-sm);
  }
  .pending { align-self: flex-start; color: var(--muted); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 16px 5px; padding: 10px 14px; box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; gap: 9px; }
  .think-dots { display: inline-flex; gap: 4px; flex: none; }
  .think-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: thinkBounce 1.2s infinite ease-in-out both; }
  .think-dots span:nth-child(2) { animation-delay: .16s; }
  .think-dots span:nth-child(3) { animation-delay: .32s; }
  @keyframes thinkBounce { 0%, 75%, 100% { transform: translateY(0); opacity: .3; } 35% { transform: translateY(-4px); opacity: .95; } }
  .think-msg { transition: opacity .22s ease; min-width: 0; }
  @media (prefers-reduced-motion: reduce) { .think-dots span { animation: none; opacity: .55; } .think-msg { transition: none; } }

  .answer-card {
    align-self: flex-start; max-width: 90%; background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: 5px 20px 20px 20px; padding: 16px 18px; box-shadow: var(--shadow-sm);
  }
  .answer-card.oos, .answer-card.refused { background: var(--panel-2); }
  .answer-text { font-size: 14.5px; line-height: 1.6; }
  .answer-text > :first-child { margin-top: 0; }
  .answer-text > :last-child { margin-bottom: 0; }
  .answer-text p { margin: 0 0 9px; }
  .answer-text h3 { font-size: 14.5px; font-weight: 600; margin: 15px 0 6px; letter-spacing: -.01em; }
  .answer-text h4 { font-size: 13.5px; font-weight: 600; margin: 12px 0 4px; }
  .answer-text ul, .answer-text ol { margin: 6px 0 10px; padding-left: 20px; }
  .answer-text li { margin: 3px 0; }
  .answer-text hr { border: 0; border-top: 1px solid var(--line); margin: 13px 0; }
  .answer-text code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-family: ui-monospace, Menlo, monospace; font-size: .92em; }
  .answer-text strong { font-weight: 600; }
  /* Mode-1 deterministic answers get the same bold-purple marker/value treatment as the Observations
     "why am I seeing this?" panel (highlightAnswerValues → highlightValues, class shared with .obs-val). */
  .answer-text .obs-val { font-weight: 600; color: var(--accent); }
  .disp-tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .uncertainty { margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: var(--muted); border-left: 2px solid var(--sand); padding-left: 11px; }

  /* in-bubble loud takeover — transition turn ONLY (§4 layer 3) */
  .takeover { margin: -16px -18px 12px; padding: 12px 16px; border-radius: 5px 20px 0 0; display: flex; gap: 11px; align-items: flex-start; }
  .takeover.clinician_review { background: var(--amber-bg); color: var(--amber-ink); border-bottom: 1px solid var(--amber-line); }
  .takeover.urgent { background: var(--red-bg); color: var(--red-ink); border-bottom: 1px solid var(--red-line); }
  .takeover .t-icon { font-size: 16px; line-height: 1.3; }
  .takeover .t-label { font-weight: 700; letter-spacing: -.01em; }
  .takeover .t-step { font-size: 12.5px; line-height: 1.45; margin-top: 1px; }

  details.evidence, details.trace { margin-top: 12px; }
  details.evidence > summary, details.trace > summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--accent); list-style: none; user-select: none;
  }
  details.trace > summary { color: var(--muted); font-weight: 500; }
  summary::-webkit-details-marker { display: none; }
  .finding-text { font-size: 12.5px; color: var(--ink); margin: 9px 0 5px; }
  .chip {
    display: block; line-height: 1.65;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; margin: 5px 0; font-size: 12px;
  }
  .chip > span { margin-right: 9px; }
  .chip > span:last-child { margin-right: 0; }
  .chip .c-marker { font-weight: 600; color: var(--ink); }
  .chip .c-value { color: var(--accent); font-weight: 600; }
  .chip .c-date, .chip .c-range, .chip .c-stat { color: var(--muted); }
  .trace-grid { margin-top: 7px; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .trace-grid div { padding: 1px 0; }

  /* mode 1 chips + ask form (Ahead suggestion-pill style) — no box of its own: it floats on the
     conversation bg (no bleed-through risk: .center scrolls as a whole, the foot is in-flow, not sticky) */
  .convo-foot { padding: 14px 18px 16px; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest-chip {
    border: 1px solid var(--line); color: var(--accent); background: var(--panel); border-radius: 999px;
    padding: 9px 15px; font-size: 13px; font-weight: 600; max-width: 100%; text-align: left;
    transition: border-color .15s, background .15s, color .15s;
  }
  .suggest-chip:hover { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-press); }
  .suggest-chip.handoff { border-style: dashed; color: var(--muted); border-color: var(--line); font-weight: 500; }
  .suggest-chip.handoff:hover { background: var(--panel-2); color: var(--ink); border-color: var(--faint); }
  #ask-form { display: flex; gap: 9px; }
  /* white pill on the bare conversation bg (like the chips) — --panel-2 would melt into --bg */
  #ask-input { flex: 1; padding: 11px 15px; border: 1px solid var(--line); border-radius: 999px; font: inherit; font-size: 14px; background: var(--panel); transition: border-color .15s, box-shadow .15s; }
  #ask-input:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  #ask-input:focus { outline: none; border-color: var(--accent); }
  #ask-form button { border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 14px; transition: background .15s; }
  #ask-form button:hover:not(:disabled) { background: var(--accent-press); }
  #ask-form button:disabled { opacity: .45; cursor: default; }
  [hidden] { display: none !important; }

  /* ---- observations ---------------------------------------------------------------------------- */
  /* right-panel tab bar — fixed above the scrolling bodies; the selected tab is underlined in accent */
  .rp-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .rp-tab { appearance: none; border: 0; background: transparent; padding: 2px 1px 9px; margin-bottom: -1px;
            font-size: 15px; font-weight: 600; letter-spacing: -.012em; color: var(--muted);
            border-bottom: 2px solid transparent; display: inline-flex; align-items: center; }
  .rp-tab:hover { color: var(--ink); }
  .rp-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .rp-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 5px; }
  .obs-sub { font-size: 12px; line-height: 1.5; color: var(--muted); margin-bottom: 16px; }
  .obs-item { border: 1px solid var(--line-soft); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; background: var(--panel-2); }
  .obs-item.flash, .answer-card.flash { animation: obs-flash 1.2s ease-out 2; }
  @keyframes obs-flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(91, 42, 73, 0); }
    25%      { box-shadow: 0 0 0 4px rgba(91, 42, 73, .30); }
  }
  @media (prefers-reduced-motion: reduce) { .obs-item.flash, .answer-card.flash { animation: none; } }
  .obs-item.attention { background: var(--amber-bg); border-color: var(--amber-line); }
  .obs-item.urgent { background: var(--red-bg); border-color: var(--red-line); }
  .obs-kicker { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .obs-item.attention .obs-kicker { color: var(--amber-ink); }
  .obs-item.urgent .obs-kicker { color: var(--red-ink); }
  .obs-item.info .obs-kicker, .obs-item.notable .obs-kicker { color: var(--good); }
  .obs-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; margin: 6px 0; }
  .obs-item details > summary { cursor: pointer; font-size: 12px; font-weight: 500; color: var(--accent); list-style: none; }
  .obs-why { font-size: 12px; line-height: 1.5; color: var(--ink); margin-top: 6px; }
  .obs-why .obs-val { font-weight: 600; color: var(--accent); }

  /* ---- trajectory sparklines (the member-facing Trajectory tab). Base .spark-* carries the structural
     layout; .traj-card re-skins the SAME markup with the right-panel palette + a light svg background. */
  .spark-card { display: flex; flex-direction: column; gap: 4px; }
  .spark-head { display: flex; align-items: baseline; gap: 8px; }
  .spark-name { font-weight: 600; }
  .spark-flag { font-size: 10.5px; }   /* out-of-range — surfaced as icon+TEXT, never colour alone */
  svg.spark { display: block; border-radius: 7px; }

  /* right-panel Trajectory tab: .obs-item card chrome + the panel palette over the SAME .spark-* markup
     (colours + light svg bg). The stroke/fill colours come from the JS palette (SPARK_LIGHT). */
  .traj-card { gap: 7px; border: 1px solid var(--line-soft); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; background: var(--panel-2); }
  .traj-card .spark-name { color: var(--ink); font-size: 13.5px; }
  .traj-card .spark-sub { color: var(--muted); font-size: 11.5px; }
  .traj-card .spark-flag { color: var(--amber-ink); }
  .traj-card .spark-flag.panic { color: var(--red-ink); }
  /* within range AND benign per the core — a circled green check, icon only (no words). The ✓ shape carries the
     meaning, so it isn't colour-alone; gated on severity so an in-range adverse trend never gets a calm check. */
  .traj-card .spark-ok { display: inline-flex; align-self: center; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; border: 1.2px solid var(--good); color: var(--good);
    font-size: 9px; font-weight: 700; line-height: 1; }
  .traj-card svg.spark { width: 100%; height: auto; background: #FBFAF7; }
  /* per-reading disclosure (member Trajectory tab only) — exact dated values for the whole series. Mirrors
     the Observations "why am I seeing this?" <details> affordance (same summary chrome, kept in sync). */
  .traj-card details > summary { cursor: pointer; font-size: 11.5px; font-weight: 500; color: var(--accent); list-style: none; }
  .traj-card details[open] > summary { margin-bottom: 6px; }
  .traj-readings { display: flex; flex-direction: column; gap: 3px; }
  .traj-reading { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; line-height: 1.55; }
  .traj-reading .tr-date { color: var(--muted); }
  .traj-reading .tr-val { color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header>
    <div class="topbar">
      <span class="brand">Health Intelligence</span>

      <span class="data-warning tip-below" role="img" tabindex="0"
            data-tip="Sample data — synthetic only. This does not constitute medical advice, diagnosis, or treatment."
            aria-label="Sample data — synthetic only. This does not constitute medical advice, diagnosis, or treatment.">&#9888;&#65038;</span>

      <div class="picker-wrap" id="picker-wrap">
        <label id="picker-label-txt">Member</label>
        <div class="dropdown" id="member-dd">
          <button type="button" id="member-picker-btn" class="dd-btn" aria-haspopup="listbox"
                  aria-expanded="false" aria-labelledby="picker-label-txt member-picker-label">
            <span id="member-picker-label">Select member</span>
            <span class="dd-caret" aria-hidden="true">▾</span>
          </button>
          <ul id="member-picker-list" class="dd-list" role="listbox" aria-label="Members" hidden></ul>
        </div>
      </div>

      <div class="mode-wrap">
        <span>Mode</span>
        <div class="mode-toggle" role="radiogroup" aria-label="Answer mode">
          <button id="mode1-btn" role="radio" aria-checked="true" class="tip-below"
                  data-tip="Mode 1 · deterministic, instant, ~free. Curated questions answered from your own data with no LLM.">
            1 · Guided
          </button>
          <button id="mode2-btn" role="radio" aria-checked="false" class="tip-below"
                  data-tip="Mode 2 · ask in your own words. An LLM renders the same grounded facts and the same safety floor.">
            2 · Ask
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- system error banner — filled by showSysBanner(); role=alert so a failure is announced. Sits in the
       shared chrome (both audiences see it): copy is plain-language, the technical server detail is the
       secondary line. Hidden until the first failed request; auto-cleared by the next successful one. -->
  <div id="sys-banner" class="sys-banner" role="alert" hidden>
    <span class="sys-banner-icon" aria-hidden="true">⚠</span>
    <div class="sys-banner-text">
      <strong id="sys-banner-title"></strong><span id="sys-banner-msg"></span>
      <span class="sys-banner-act" id="sys-banner-act"></span>
      <span class="sys-banner-detail" id="sys-banner-detail" hidden></span>
    </div>
    <button type="button" id="sys-banner-retry" hidden>Retry</button>
    <button type="button" class="sys-banner-x" id="sys-banner-x" aria-label="Dismiss">✕</button>
  </div>

  <main>
    <!-- LEFT · operator control panel (not member-facing) -->
    <aside class="control" aria-label="Operator control panel">
      <div class="cp-header">
        <strong>Operator console</strong>
        <span>clinician / debug surface &mdash; not part of the member experience</span>
      </div>
      <input id="upload-file" type="file" accept=".zip,application/zip" hidden />
      <button type="button" id="upload-drop" class="dropzone"
              aria-label="Upload a new valid .zip dataset holding a .json, a .jsonl, and a .csv file: drag it here, or click to choose a file"
              title="A .zip of a training_data-shaped folder: one .json (members), one .jsonl (eval set), one .csv (lab panels). Validated on the first row of each; buggy later rows are skipped.">
        <strong>Upload a new valid .zip dataset</strong><br>drag &amp; drop it here
        <br><span style="font-size:11px;color:var(--muted)">needs a .json, a .jsonl &amp; a .csv</span>
      </button>
      <div id="cp-groups"></div>
      <div class="readout-label">
        <span>Route response</span>
        <button id="readout-toggle" type="button" aria-expanded="true" aria-controls="cp-readout"
                title="Minimize" aria-label="Minimize route response">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <pre id="cp-readout" class="is-empty" aria-live="polite">—</pre>
    </aside>

    <div class="resizer" data-resize="control" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize operator panel" title="Drag to resize · double-click to reset"></div>

    <!-- CENTER · conversation -->
    <section class="center" aria-label="Conversation">
      <div id="conversation-log"></div>
      <div class="convo-foot">
        <div id="chips" role="group" aria-label="Suggested questions"></div>
        <form id="ask-form" hidden autocomplete="off">
          <input id="ask-input" type="text" placeholder="Ask about your results in your own words…"
                 maxlength="8000" aria-label="Ask a question" />
          <button type="submit">Ask</button>
        </form>
      </div>
    </section>

    <div class="resizer" data-resize="obs" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize observations panel" title="Drag to resize · double-click to reset"></div>

    <!-- RIGHT · proactive observations + per-marker trajectory (two member-facing tabs over the same member) -->
    <aside class="observations" aria-label="Observations and trajectory">
      <div class="rp-tabs" role="tablist" aria-label="Observations and trajectory">
        <button id="tab-obs" type="button" role="tab" class="rp-tab" aria-selected="true" aria-controls="rp-body-obs"
        >Observations<span id="obs-flag" class="obs-flag" hidden aria-hidden="true">⚑</span></button>
        <button id="tab-traj" type="button" role="tab" class="rp-tab" aria-selected="false" aria-controls="rp-body-traj" tabindex="-1">Trajectory</button>
      </div>
      <div id="rp-body-obs" class="rp-body" role="tabpanel" aria-labelledby="tab-obs" tabindex="0">
        <div class="obs-sub">Raised proactively from your trajectory, ranked by what's worth knowing.</div>
        <div id="observations-list"></div>
      </div>
      <div id="rp-body-traj" class="rp-body" role="tabpanel" aria-labelledby="tab-traj" tabindex="0" hidden>
        <div class="obs-sub">Your per-marker trends over time.</div>
        <div id="trajectory-list"></div>
      </div>
    </aside>
  </main>

<script>
"use strict";
(() => {

  // operator affordances (control panel, picker, per-answer trace) are gated on this one flag — a
  // production member build flips it false and the surface becomes member-only (ui-ux §2/§58).
  const operatorView = true;

  // ---- a11y meta: icon + text label for every severity/disposition/escalation (never colour alone, §8)
  const SEVERITY_META = {
    info:      { icon: "◦", label: "Observation",    cls: "info" },
    notable:   { icon: "•", label: "Observation",    cls: "notable" },
    attention: { icon: "▲", label: "Needs follow-up", cls: "attention" },
    urgent:    { icon: "‼", label: "Needs follow-up", cls: "urgent" },
  };
  const DISPOSITION_META = {
    answered:     { cls: "answered", tag: null },
    out_of_scope: { cls: "oos",      tag: "Outside what I can help with" },
    refused:      { cls: "refused",  tag: "I can't answer that from your data" },
  };
  const ESCALATION_META = {
    none:             { rank: 0 },
    clinician_review: { rank: 1, icon: "⚑", label: "Worth a clinician's eyes",
                        step: "Worth raising with your GP — not an emergency." },
    urgent:           { rank: 2, icon: "‼", label: "Flagged for your care team",
                        step: "Please act on the next step in the message below." },
  };
  const escRank = (lvl) => (ESCALATION_META[lvl] ? ESCALATION_META[lvl].rank : 0);

  // ---- route registry: drives BOTH the control-panel buttons AND their hover tooltips. The Learning
  // group (/learn, /feedback, /reset) is a Phase-7 drop-in — it appears here unchanged once those
  // routes scaffold; the panel is a projection of the routes that exist (architecture §56).
  const ROUTES = [
    { group: "Data", label: "Reseed (factory)", verb: "POST", destructive: true, handler: reseed,
      tip: "POST /admin/reseed · Wipe all tables and re-ingest the original training_data members. Drops uploads and all learning/audit history — affects ALL current users of this instance. Double confirmation: a popup, then type \"delete\"." },
    { group: "Proactive", label: "Scan", verb: "POST", handler: scanAll,
      tip: "POST /members/{id}/scan · Re-run the proactive drift scan across every member and summarise each result here, including how many NEW observations each scan found (0 on an unchanged re-run). Normally automatic (every ingest and every core feedback correction auto-scans) — this manual re-run is the retry after a failed auto-scan and the demo of the mechanism." },
    { group: "Proactive", label: "Member escalations", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/escalations`),
      tip: "GET /members/{id}/escalations · The selected member's own escalation record across every lifecycle status (open · acknowledged · superseded — raw JSON), highest severity first (each item carries its severity), chronological within a tier — the drill-in detail, not the queue." },
    // NOTE: the remaining per-member GET reads (observations · suggestions · trajectory) are intentionally NOT
    // surfaced as control-panel buttons — those endpoints still exist in the API and drive the member-facing
    // panels; only their operator-console buttons are hidden.
    // CLINICIAN — the human-in-the-loop surface: the global triage queue plus the per-finding corrections a
    // clinician files against it (read the queue, then act on a finding via feedback / a range override).
    { group: "Clinician", label: "Clinician queue", verb: "GET", handler: () => readoutRoute(() => `/escalations`),
      tip: "GET /escalations · The global triage queue — every live escalation across all members, ranked highest severity first (each item carries its severity: urgent → clinician_review), un-acknowledged before acknowledged within a tier, then newest (raw JSON). An escalation_accept marks its target status:'acknowledged' — still listed, visibly triaged. No member need be selected." },
    { group: "Clinician", label: "Submit feedback", verb: "POST", handler: feedbackForm,
      tip: "POST /members/{id}/feedback · Record a correction (range_override · suppress_marker · preference) or a signal (helpful · incorrect · escalation_accept|reject) on the selected member. A core correction auto-scans the member on submit, so Observations/escalations reflect it at once (and it re-resolves into every later scan/ask); only LEARNABLE signals (incorrect, recurring escalation_reject) feed Run learn — helpful/escalation_accept are advisory." },
    { group: "Clinician", label: "Member feedback", verb: "GET", handler: () => readoutRoute((m) => `/members/${enc(m)}/feedback`),
      tip: "GET /members/{id}/feedback · The selected member's full submitted-feedback trail, newest-first (raw JSON) — corrections and signals with their payloads (incl. each escalation_reject's reason). active:false rows are the /reset-deactivated audit history, kept, never deleted." },
    { group: "Learning", label: "Run learn", verb: "POST", handler: runLearn,
      tip: "POST /learn · Assemble a candidate composer prompt from the LEARNABLE feedback (incorrect → few-shot exemplar, recurring escalation_reject → tone clause) and gate it through the eval harness's critical composer subset (10 cases — only the surface a composer prompt can move; make eval still runs the full set); promote only if nothing regresses. No-ops if no learnable feedback is pending. Needs ANTHROPIC_API_KEY; can take a minute." },
    { group: "Learning", label: "Prompt history", verb: "GET", handler: () => readoutRoute(() => `/prompts`),
      tip: "GET /prompts · The composer-prompt version history, newest first (raw JSON). Prompts are LEARNT from feedback and VALIDATED by /learn: learnable feedback (incorrect → few-shot exemplar, recurring escalation_reject → tone clause) is folded into a candidate prompt, gated through the eval harness, and promoted only if nothing regresses — status records each verdict (promoted · rejected · reverted by Reset learning), `active` marks the version the composer serves now, v0 is the seeded baseline. No member need be selected." },
    { group: "Learning", label: "Reset learning", verb: "POST", destructive: true, handler: resetLearning,
      tip: "POST /reset · Deactivate all feedback overrides and revert the composer prompt to v0. Not a data wipe. Asks for confirmation before firing." },
    // NOTE: the GET /health liveness route is intentionally NOT surfaced as a control-panel button (it's the
    // deploy health check, not an operator action). The endpoint still exists in the API; only the UI hides it.
  ];

  // ---- in-memory state (no browser storage; resets on reload — CLAUDE.md) -----------------------
  const state = {
    members: [], currentMember: null, mode: 1,
    focus: null, asked: [], chips: [],
    log: [], asking: false,
    loading: false,             // member-load in flight: blocks asks until the safety state is loaded
    loadError: false,           // a member-load fetch failed → surface honestly, never a false all-clear
    observations: [], activeEscalations: [],
    rightTab: "observations",   // which right-panel tab is shown ("observations" | "trajectory"); kept across member switches
    trajectory: null,           // GET /trajectory cache for the current member: null = not fetched yet, [] = fetched-empty
    trajLoading: false, trajError: false,
    trajToken: 0,               // bumped on member switch AND scan-invalidation; an in-flight trajectory fetch with a stale token is dropped
    readoutKey: null,           // path currently shown in the route readout; a repeat click toggles it back to default
    transitionShown: new Map(), // escalation_id -> level already shown loud (so it never re-alarms)
    reqToken: 0,                // bumped on every member switch; stale async results are dropped
  };

  // answer-card DOM cache: a turn object → { node, sig }. renderConversation re-inserts cached nodes for
  // unchanged turns so an expanded <details> (evidence / trace) survives the next turn's render (#6).
  const _turnNodes = new WeakMap();

  // ---- tiny helpers -----------------------------------------------------------------------------
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  // Emphasize the marker name and the deterministic injected values in member explanation prose:
  //   • the marker name — the "Your <name> <verb>" lead-in (e.g. "HbA1c", "Vitamin D (25-OH)")
  //   • each value — a number (word-boundary-anchored, so "HbA1c"'s 1 is NOT a value), optional en-dash
  //     range, and any trailing % or unit-with-slash ("6 %", "109 mg/dL", "70–99 mg/dL")
  // Purely presentational: built with text nodes + <strong>, never innerHTML, so server text can't
  // inject markup. Values landing inside the (already-bolded) name span are skipped.
  const VALUE_RE = /\b\d[\d.,]*(?:\s*[–-]\s*\d[\d.,]*)?(?:\s*(?:%|[A-Za-z]+\/[A-Za-z]+))?/g;
  // Marker name at the head of a member-facing sentence. The optional "most recent / latest" qualifier is
  // matched but NOT captured, so the Mode-1 change drill-down ("Your most recent LDL cholesterol is …")
  // bolds just the marker, not the qualifier; observation copy ("Your LDL cholesterol is …") is unchanged.
  const NAME_RE = /^Your (?:most recent |latest )?(.+?) (?:has been|has moved|was|is)\b/;
  // ISO dates ("recorded 2026-01-13") appear in the Mode-1 change drill-down but never in observation
  // copy; they are NOT clinical values, so their digits are blocked from the value highlighter (which
  // would otherwise bold fragments like "2026-01" and "13"). No-op for observation text (no dates there).
  const DATE_RE = /\b\d{4}-\d{2}-\d{2}\b/g;
  const highlightValues = (node, text) => {
    const spans = [];
    const blocked = [];
    let dm;
    DATE_RE.lastIndex = 0;
    while ((dm = DATE_RE.exec(text)) !== null) blocked.push([dm.index, dm.index + dm[0].length]);
    const nm = NAME_RE.exec(text);
    // span from the captured group's actual position (not a fixed "Your ".length), so the optional
    // qualifier above shifts the marker name correctly.
    if (nm) { const s = nm[0].indexOf(nm[1]); spans.push([s, s + nm[1].length]); }
    let m;
    VALUE_RE.lastIndex = 0;
    while ((m = VALUE_RE.exec(text)) !== null) {
      const s = m.index, e = s + m[0].length;
      if (spans.some(([a, b]) => s >= a && s < b)) continue;  // inside the name span — already bold
      if (blocked.some(([a, b]) => s < b && e > a)) continue;  // overlaps a date → not a clinical value
      spans.push([s, e]);
    }
    spans.sort((a, b) => a[0] - b[0]);
    let last = 0;
    for (const [s, e] of spans) {
      if (s > last) node.appendChild(document.createTextNode(text.slice(last, s)));
      node.appendChild(el("strong", "obs-val", text.slice(s, e)));
      last = e;
    }
    if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
    return node;
  };
  // Apply the same leading-marker + value bold-purple treatment (highlightValues) to a DETERMINISTIC
  // Mode-1 answer's already-rendered prose, per block (paragraph / list item). Scoped to the deterministic
  // path only — never Mode-2 LLM markdown, which styles itself — and safe to rebuild each block from its
  // textContent because deterministic template prose carries no inline markdown to lose.
  const highlightAnswerValues = (container) => {
    for (const block of container.querySelectorAll("p, li")) {
      const text = block.textContent;
      if (!text) continue;
      block.textContent = "";
      highlightValues(block, text);
    }
  };
  // Mode-2 twin of highlightAnswerValues for LLM-composed answers. The composer's markdown is already
  // rendered (its own <strong>/<em>/lists must survive), so this walks TEXT NODES and wraps matches in
  // <strong class="obs-val"> rather than rebuilding blocks from textContent. What gets bolded is
  // grounded, never guessed: the marker names the response itself cites (findings[].evidence[].marker,
  // case-insensitive, longest-first so "LDL cholesterol" wins over an overlapping shorter name), plus
  // values that READ as measurements — a number with a %/slash-unit ("109 mg/dL"), a decimal, or an
  // en-dash/hyphen range. Bare integers are deliberately NOT values here (unlike Mode-1's controlled
  // template prose): free prose is full of them ("over 5 readings", "type 2 diabetes") and the
  // crisis/seek-care templates' emergency phone numbers must never be restyled. Those safety templates
  // are also excluded wholesale by the grounding gate — they cite no findings, so the pass no-ops.
  const _escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Mode-2's value shape: number, optional en-dash/hyphen range, optional captured unit word. The
  // unit is captured (group 1) so a trailing lowercase-only word can be judged and trimmed back off.
  const COMPOSED_VALUE_RE = /\b\d[\d.,]*(?:\s*[–-]\s*\d[\d.,]*)?(\s*(?:%|[A-Za-z][A-Za-z0-9/²]*))?/g;
  const highlightComposedMarkers = (container, resp) => {
    const cited = [...new Set(
      (resp.findings || []).flatMap((f) => (f.evidence || []).map((e) => e.marker)).filter(Boolean)
    )];
    if (!cited.length) return;  // ungrounded turn (incl. the gate's safety templates) → untouched
    // Free prose shortens canonical marker names ("HDL cholesterol" → "HDL", "systolic_bp" →
    // "blood pressure"), so each cited name also contributes its contiguous sub-phrases — kept only
    // when multi-word or acronym-shaped (has an uppercase/digit, ≥2 chars). That admits "HDL" /
    // "BMI" / "blood pressure" while a generic lowercase word ("pressure", "cholesterol") or the
    // bare "D" of "Vitamin D (25-OH)" can never be bolded on its own. Vitals arrive as raw keys
    // (bmi, systolic_bp — ingest folds vitals in as markers), so keys are humanized first:
    // underscores → spaces, the "bp" token → "blood pressure" (the same expansion the backend's
    // member-facing narration uses).
    const names = new Set(cited);
    for (const name of cited) {
      const norm = name.replace(/_/g, " ").replace(/\bbp\b/i, "blood pressure");
      const words = norm.split(/\s+/).filter(Boolean);
      for (let i = 0; i < words.length; i++)
        for (let j = i; j < words.length; j++) {
          const phrase = words.slice(i, j + 1).join(" ");
          if (j > i || (phrase.length >= 2 && /[A-Z0-9]/.test(phrase))) names.add(phrase);
        }
      // a cited blood-pressure marker also admits its qualifier ("systolic"/"diastolic") and the "BP"
      // abbreviation — the lowercase-single-word rule above would reject both, but with the marker
      // cited they are unambiguous in prose ("systolic 134 mmHg", "the BP trend").
      const bpq = norm.match(/^(\w+)\s+blood pressure$/i);
      if (bpq) { names.add(bpq[1]); names.add("BP"); }
    }
    const sorted = [...names].sort((a, b) => b.length - a.length);  // longest-first: full name wins
    // lookarounds, not \b: marker names can end in a non-word char ("Vitamin D (25-OH)")
    const nameRe = new RegExp(`(?<!\\w)(?:${sorted.map(_escRe).join("|")})(?!\\w)`, "gi");
    // The cited evidence VALUES ground bare numbers the same way markers ground names: "(109)" bolds
    // because fasting glucose's evidence value IS 109, while "over 5 readings" stays plain (a count,
    // never an evidence value). This keeps the bare-integer door shut for emergency phone numbers
    // without losing real readings the composer echoes without units.
    const citedVals = new Set(
      (resp.findings || []).flatMap((f) => (f.evidence || []).map((e) => e.value))
        .filter((v) => typeof v === "number")
    );
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (!n.parentElement.closest("code, .obs-val")) textNodes.push(n);
    }
    for (const node of textNodes) {
      const text = node.nodeValue;
      const spans = [], blocked = [];
      let m;
      DATE_RE.lastIndex = 0;
      while ((m = DATE_RE.exec(text)) !== null) blocked.push([m.index, m.index + m[0].length]);
      nameRe.lastIndex = 0;
      while ((m = nameRe.exec(text)) !== null) spans.push([m.index, m.index + m[0].length]);
      // number + optional range + optional unit. Unlike Mode-1's VALUE_RE the unit needn't carry a
      // slash ("134 mmHg", "26 U/L", "18 ng/mL" all count) — but a trailing lowercase-only word is
      // prose, not a unit ("5 readings"), and is trimmed back off before the number is judged alone.
      COMPOSED_VALUE_RE.lastIndex = 0;
      while ((m = COMPOSED_VALUE_RE.exec(text)) !== null) {
        let val = m[0], unit = (m[1] || "").trim();
        if (unit && unit !== "%" && !unit.includes("/") && !/[A-Z]/.test(unit)) {
          val = val.slice(0, val.length - m[1].length);   // not a unit → judge the bare number
          unit = "";
        }
        val = val.replace(/[.,\s]+$/, "");           // shed sentence punctuation the match ran into
        const s = m.index, e = s + val.length;
        // a number qualifies with a unit, a decimal, a range — or by being a cited evidence value
        if (!unit && !/[.–-]/.test(val) && !citedVals.has(parseFloat(val.replace(/,/g, "")))) continue;
        if (spans.some(([a, b]) => s < b && e > a)) continue;
        if (blocked.some(([a, b]) => s < b && e > a)) continue;
        spans.push([s, e]);
      }
      if (!spans.length) continue;
      spans.sort((a, b) => a[0] - b[0]);
      const frag = document.createDocumentFragment();
      let last = 0;
      for (const [s, e] of spans) {
        if (s > last) frag.appendChild(document.createTextNode(text.slice(last, s)));
        frag.appendChild(el("strong", "obs-val", text.slice(s, e)));
        last = e;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  };
  const enc = encodeURIComponent;

  // ---- markdown → safe HTML (the Mode-2 LLM emits markdown; Mode-1 deterministic prose is mostly one
  // paragraph but the "what's changed" overview emits a per-marker bullet list). No external library —
  // keeps the page a single static file with no build step. EVERYTHING
  // is HTML-escaped FIRST, so the only tags in the output are the small, fixed set this renderer emits
  // (headings, strong/em/code, hr, lists, paragraphs); the model can never inject live markup.
  const mdEsc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function mdInline(s) {
    // operate on already-escaped text. Split out `code` spans first so bold/italic never run inside
    // them (and so real numbers can't be mistaken for a placeholder); format only the plain segments.
    return s.split(/(`[^`]+`)/g).map((part) =>
      (part.length > 1 && part[0] === "`" && part[part.length - 1] === "`")
        ? `<code>${part.slice(1, -1)}</code>`
        : part.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
              .replace(/\*([^*]+)\*/g, "<em>$1</em>")
              .replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>") // _italic_, not snake_case
    ).join("");
  }
  function mdToHtml(src) {
    const lines = mdEsc(String(src).replace(/\r\n?/g, "\n")).split("\n");
    const out = [];
    let para = [], list = null; // list = { type: "ul"|"ol", items: [] }
    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(mdInline).join("<br>")}</p>`); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.type}>${list.items.map((i) => `<li>${mdInline(i)}</li>`).join("")}</${list.type}>`); list = null; } };
    const flush = () => { flushPara(); flushList(); };
    for (const line of lines) {
      let m;
      if (!line.trim()) { flush(); }
      else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const lvl = m[1].length <= 2 ? 3 : 4; out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`); }
      else if (/^\s*(?:---|\*\*\*|___)\s*$/.test(line)) { flush(); out.push("<hr>"); }
      else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flushPara(); if (!list || list.type !== "ul") { flushList(); list = { type: "ul", items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { flushPara(); if (!list || list.type !== "ol") { flushList(); list = { type: "ol", items: [] }; } list.items.push(m[1]); }
      else { flushList(); para.push(line); }
    }
    flush();
    return out.join("");
  }

  // ---- system error banner ------------------------------------------------------------------------
  // Map a failed response to {title, msg, act}: WHAT failed in plain words, WHY (the server's own
  // human-readable {detail} when it has one — the API writes good ones), and the ACTION the user should
  // take. The action is the point of the banner: a 409 is "wait a moment and retry" (lock contention is
  // the designed outcome of the cross-process flocks, not a fault), a 503 is "retry — nothing was saved"
  // (the fail-closed judge / provider-down path), a 422 is "change the input" (retrying unchanged fails
  // again), 5xx/network is "try again in a few seconds".
  function explainError(status, data) {
    let detail = data && data.detail;
    // Pydantic body-validation 422s carry detail as an ARRAY of {loc, msg} — render legibly, never
    // "[object Object]" (same concern as the feedback form's inline handler).
    if (Array.isArray(detail)) detail = detail.map((d) => `${(d.loc || []).join(".")}: ${d.msg}`).join("; ");
    else if (detail && typeof detail === "object") detail = detail.error || JSON.stringify(detail);
    if (typeof detail !== "string") detail = (data && data.error) ? String(data.error) : null;
    if (status === 0) return {
      // no `detail`: on a network failure the server said nothing — echoing the browser's TypeError
      // as "Server said: …" would be false attribution.
      title: "Can't reach the server.", detail: null,
      msg: "It may be restarting or briefly offline — nothing you sent was processed.",
      act: "Try again in a few seconds." };
    if (status === 409) return {
      title: "The system is busy with another operation.", detail,
      msg: "Only one maintenance run (learn / reset / reseed / upload) can hold the lock at a time — this is expected when several people use the app at once.",
      act: /learn run/i.test(detail || "") ? "Try again when the current run finishes — a learn gate can take a minute or two."
                                           : "Try again in a few seconds." };
    if (status === 503) return {
      title: "A required service is temporarily unavailable.", detail,
      msg: "The language-model provider couldn't be reached, so the request was safely refused — nothing was saved.",
      act: "Try again in a few seconds." };
    if (status === 422) return {
      title: "The input was rejected.", detail,
      msg: "The server checked it and said no — retrying the same input will be rejected again.",
      act: "Adjust the input and resubmit." };
    if (status === 404) return {
      title: "Not found.", detail,
      msg: "The member or record may have been removed (e.g. by a reseed in another window).",
      act: "Refresh the member list and try again." };
    return {
      title: "Something went wrong on the server.", detail: detail || `HTTP ${status}`,
      msg: "The request failed unexpectedly.",
      act: "Try again in a few seconds — if it keeps happening, check the server logs." };
  }

  // One banner, newest error wins; ✕ dismisses; any later SUCCESSFUL request auto-clears it (a stale
  // "server unreachable" must not outlive the recovery). `what` names the action that failed in the
  // user's terms ("Answering your question", "Factory reseed"); `retry` (optional) re-runs it in place.
  function showSysBanner(what, r, retry) {
    const e = explainError(r ? r.status : 0, r && r.data);
    $("#sys-banner-title").textContent = `${what} didn't go through — ${e.title}`;
    $("#sys-banner-msg").textContent = ` ${e.msg} `;
    $("#sys-banner-act").textContent = e.act;
    const det = $("#sys-banner-detail");
    det.hidden = !e.detail;
    det.textContent = e.detail ? `Server said: ${e.detail}` : "";
    const btn = $("#sys-banner-retry");
    btn.hidden = !retry;
    btn.onclick = retry ? () => { hideSysBanner(); retry(); } : null;
    $("#sys-banner").hidden = false;
  }
  function hideSysBanner() { $("#sys-banner").hidden = true; }
  $("#sys-banner-x").addEventListener("click", hideSysBanner);

  // `ui` controls how a failure is surfaced: default → the system banner with a generic label; pass
  // {what, retry} for user-terms copy + an in-place Retry; pass `false` for the rare call site that
  // aggregates its own failures (scanAll). Success always clears the banner — see showSysBanner.
  async function api(method, path, body, ui) {
    const opts = { method, headers: {} };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(path, opts); }
    catch (e) {
      const r = { ok: false, status: 0, data: { error: String(e) } };
      if (ui !== false) showSysBanner((ui && ui.what) || `${method} ${path}`, r, ui && ui.retry);
      return r;
    }
    const raw = await res.text();
    let data; try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }
    const r = { ok: res.ok, status: res.status, data };
    if (r.ok) hideSysBanner();
    else if (ui !== false) showSysBanner((ui && ui.what) || `${method} ${path}`, r, ui && ui.retry);
    return r;
  }

  function flushMemberState() {
    state.focus = null; state.asked = []; state.chips = [];
    state.log = []; state.asking = false; state.loading = false; state.loadError = false;
    state.observations = []; state.activeEscalations = [];
    state.trajectory = null; state.trajLoading = false; state.trajError = false;  // invalidate the per-member trajectory cache
    state.transitionShown = new Map();
    state.reqToken++; state.trajToken++;  // drop any in-flight member-load AND trajectory fetch from the old member
  }

  // wipe the member surface when no member is selected (e.g. the last member was just cleared) so a
  // deleted member's conversation, observations, and safety banner never linger on screen (#3).
  function clearMemberView() {
    flushMemberState();
    state.currentMember = null;
    syncPicker();
    renderConversation(); renderRightTabs(); renderObservations(); renderTrajectoryTab(); renderEscalationFlag(); renderChips(); updateAskDisabled();
  }

  // ---- boot -------------------------------------------------------------------------------------
  async function boot() {
    // a production member build (operatorView=false) drops the WHOLE operator column, not just the
    // picker/trace/gutter — so the operator panel can't reach a member (#5).
    if (!operatorView) document.body.classList.add("member-only");
    // Static UI (control panel + handlers) never depends on the network, so render it FIRST and
    // unconditionally — a data-load failure must never leave the operator without the control rail.
    renderControlPanel();
    wireStaticHandlers();
    wireResizers();
    // One silent auto-retry: the page can load in the ~1s window while the dev server is restarting
    // (e.g. a --reload cycle), where the first /members fetch fails. A blank shell then looked like a
    // broken build; instead we retry once, and only then surface a manual Retry (renderBootError).
    if (!(await loadMembers())) {
      await new Promise((r) => setTimeout(r, 1200));
      await loadMembers();
    }
  }

  // Load the member roster. Returns whether it succeeded so boot() can auto-retry a transient failure.
  async function loadMembers(selectId) {
    const r = await api("GET", "/members", undefined, { what: "Loading members", retry: () => loadMembers(selectId) });
    if (!r.ok) { renderReadout(r.data); renderBootError(r); return false; }
    state.members = r.data;
    renderMemberPicker();
    const target = selectId || (state.members[0] && state.members[0].member_id);
    if (target) await selectMember(target);
    else clearMemberView();   // roster empty (last member cleared) → don't leave a stale surface (#3)
    return true;
  }

  // Visible fallback when the roster can't load — a message + Retry in the conversation column, instead
  // of the blank shell a failed boot fetch used to leave. The control rail is already rendered by boot().
  function renderBootError(r) {
    const msg = (r && r.status === 0)
      ? "Couldn't reach the server — it may be starting up or restarting."
      : "Couldn't load members from the server.";
    const box = el("div", "boot-error");
    box.appendChild(el("div", "empty-hint", msg));
    const btn = el("button", "boot-retry", "Retry");
    btn.type = "button";
    btn.addEventListener("click", () => { $("#conversation-log").replaceChildren(el("div", "empty-hint", "Retrying…")); loadMembers(); });
    box.appendChild(btn);
    $("#conversation-log").replaceChildren(box);
  }

  // member-load sequence: load EXISTING state only (observations + escalations + suggestions) — all
  // READS, never a scan. Selecting a member shows whatever the last scan left. Scans run automatically
  // at every data load (seed / reseed / upload) AND on a core /feedback correction — proactive by
  // default — so a freshly loaded member already has findings and a just-corrected one is already
  // current; the "Run scan" button is a manual re-run of the same idempotent scan (the retry path).
  async function selectMember(id) {
    flushMemberState();
    state.currentMember = id;
    state.loading = true;        // block asks until the member's safety state is loaded (#2)
    syncPicker();
    renderConversation(); renderRightTabs(); renderObservations(); renderTrajectoryTab(); renderEscalationFlag(); renderChips(); updateAskDisabled();
    // (the Trajectory tab fetches in the post-load block below, not here — it waits only for the member-load
    // READS to settle so state.loading clears, NOT for a scan; the trajectory series is scan-independent.)

    const token = state.reqToken;
    // all three are READS (GET observations / escalations / suggestions); none triggers a scan.
    const [obsR, escR] = await Promise.all([loadObservations(id), refreshEscalations(id), refreshSuggestions(id)]);
    if (token !== state.reqToken) return;
    state.loading = false;
    // honest surface: if a safety-critical load fetch failed, don't render a falsely-calm all-clear (#4)
    state.loadError = !(obsR.ok && escR.ok);
    renderObservations(); renderEscalationFlag(); updateAskDisabled();
    // member-load READS settled → fetch the trajectory if its tab is open (scan-independent, no isAnalyzed gate).
    // ensureTrajectory paints the trajectory body itself, so call ONE or the other — never both (#11 double-paint).
    if (state.rightTab === "trajectory") ensureTrajectory(); else renderTrajectoryTab();
  }

  // GET the member's current observations (a READ of the last scan's output — never triggers a scan).
  async function loadObservations(id) {
    const r = await api("GET", `/members/${enc(id)}/observations`, undefined,
      { what: "Loading observations", retry: () => loadObservations(id) });
    if (r.ok && id === state.currentMember) { state.observations = r.data; renderObservations(); }
    return r;
  }

  // Operator "Scan all": fire the existing per-member scan route for every member in turn (the panel
  // adds no new route — it only drives ones the API already exposes), then summarise per-member in the
  // readout. The on-screen member's panel + escalation flag are refreshed from its own fresh scan.
  // POST /scan serves a {observations, new_observations} envelope: `new_observations` is how many rows
  // that run newly persisted (0 on an idempotent re-scan), summed here so the readout answers "did this
  // scan actually find anything new?" at a glance.
  async function scanAll() {
    const members = state.members;
    if (!members.length) return renderReadout({ error: "No members to scan." });
    renderReadout(`Scanning ${members.length} members…`);
    const results = [];
    for (const m of members) {
      const r = await api("POST", `/members/${enc(m.member_id)}/scan`, undefined, false);  // failures aggregated below
      results.push(r.ok ? { member_id: m.member_id, observations: r.data.observations.length,
                            new_observations: r.data.new_observations }
                        : { member_id: m.member_id, error: r.status });
      if (r.ok && m.member_id === state.currentMember) { state.observations = r.data.observations; renderObservations(); invalidateTrajectory(); }
    }
    // Refresh BOTH the escalation queue AND the Mode-1 chips/answers for the on-screen member: /suggestions
    // is a LIVE re-analyze (already reflects overrides), it was just never re-fetched after a scan — so
    // without this, feedback moved the observations panel but left Mode 1 showing its member-select cache.
    if (state.currentMember)
      await Promise.all([refreshEscalations(state.currentMember), refreshSuggestions(state.currentMember)]);
    const failed = results.filter((x) => x.error != null).length;
    const newObservations = results.reduce((n, x) => n + (x.new_observations || 0), 0);
    renderReadout({ scanned: results.length, failed, new_observations: newObservations, results });
    // aggregate banner (the loop suppressed per-member ones): one clear notice + a Retry that re-runs
    // the whole idempotent sweep — a re-scan of already-clean members writes nothing new.
    if (failed) {
      const worst = results.find((x) => x.error != null);
      showSysBanner("Scanning", { status: worst.error, data: null }, scanAll);
    }
  }

  async function refreshEscalations(id) {
    const r = await api("GET", `/members/${enc(id)}/escalations`, undefined,
      { what: "Loading safety status", retry: () => refreshEscalations(id) });
    // Keep LIVE ('open' + 'acknowledged') escalations in client state: activeEscalations drives the
    // member-facing flag, the transition bubble, and auto-view-flagged — all "active" concerns. An
    // 'acknowledged' escalation is a clinician-CONFIRMED real finding (an escalation_accept), so it must
    // keep flagging the member — only 'superseded' (an override cleared it on a re-scan) drops out: a
    // cleared finding must not re-raise the member flag (that would re-create the very false-flag we're
    // fixing). The per-member endpoint still returns superseded rows for the raw-JSON audit readout; only
    // this in-memory active set is filtered.
    if (r.ok && id === state.currentMember) {
      state.activeEscalations = (r.data || []).filter((e) => e.status !== "superseded");
      renderEscalationFlag();
    }
    return r;
  }

  async function refreshSuggestions(id) {
    const q = new URLSearchParams();
    if (state.focus) q.set("focus", state.focus);
    state.asked.forEach((m) => q.append("asked", m));
    const r = await api("GET", `/members/${enc(id)}/suggestions?${q.toString()}`, undefined,
      { what: "Loading suggested questions", retry: () => refreshSuggestions(id) });
    if (r.ok && id === state.currentMember) { state.chips = r.data; renderChips(); }
    return r;
  }

  // ---- Mode 1: a chip click is a pure read; render its pre-computed answer, then regenerate chips -
  async function onChipClick(sp) {
    // a chip's answer is a pure pre-computed read; clicking the same question again must not duplicate
    // the exchange — find the existing answer already in the log and flash it instead (re-render is moot).
    const prior = state.log.find((t) => t.kind === "assistant" && t.askedPrompt === sp.prompt);
    if (prior) { flashTurn(prior); return; }
    state.log.push({ kind: "member", text: sp.prompt });
    state.log.push({ kind: "assistant", resp: sp.response, isTransition: false, askedPrompt: sp.prompt });
    // derive the focus marker (first cited) and remember it as visited; imperfect focus can't dead-end
    // the loop because the anchors are always present (architecture §2).
    const marker = sp.response.findings?.[0]?.evidence?.[0]?.marker || null;
    if (marker) { state.focus = marker; if (!state.asked.includes(marker)) state.asked.push(marker); }
    renderConversation();
    await refreshSuggestions(state.currentMember);
  }

  // scroll the existing answer for a turn into view and pulse it — the affordance for "you already
  // asked this; here's the answer" (mirrors the Observations panel's view-flash).
  function flashTurn(turn) {
    const cached = _turnNodes.get(turn);
    if (!cached) return;
    cached.node.scrollIntoView({ behavior: "smooth", block: "nearest" });
    cached.node.classList.remove("flash"); void cached.node.offsetWidth; cached.node.classList.add("flash");
  }

  // ---- Mode 2: free-form ask → pending bubble → /ask → card → escalation diff → maybe loud once ---
  async function onAsk(message) {
    const id = state.currentMember;
    if (!id || state.asking || state.loading) return;  // don't ask before the member's escalations load (#2)
    state.asking = true; updateAskDisabled();
    // Multi-turn context: replay the last 10 COMPLETED exchanges (20 messages) so a short follow-up
    // ("what's the highest risk?") resolves against what was said. Built from the log BEFORE the current
    // message is pushed, so it excludes this turn. Walk backward and stop at the cap (cheap on a long
    // log), pairing each assistant answer with its preceding member turn: a member turn with NO following
    // answer — a failed/pending ask left in the log — is an orphan and is dropped, so it can't re-enter
    // history as an unanswered question. Both Mode-1 (chip) and Mode-2 (free-form) turns are paired the
    // same way (a unified transcript). State is in memory only; the server holds no conversation store.
    // 20 messages = 10 exchanges; mirrors the backend's MAX_HISTORY_TURNS (pipeline.py), which re-caps
    // authoritatively — this client cap only trims the payload, so a drift here is never a safety issue.
    const HISTORY_MSG_CAP = 20;
    // Clamp each replayed turn to the server's per-turn cap (ConversationTurn.content max_length). A rare
    // long composer answer (near the token limit) could otherwise exceed it and 422 the whole next turn;
    // clamping decouples "what a turn can contain" from "what history can carry", so replay never 422s.
    const HISTORY_CONTENT_CAP = 8000;
    const clamp = (s) => s.length > HISTORY_CONTENT_CAP ? s.slice(0, HISTORY_CONTENT_CAP) : s;
    const paired = [];
    // Pair each member turn with the assistant answer IMMEDIATELY following it, by checking adjacency
    // directly (no carried state): an orphaned member (a failed/pending ask, no following answer) is
    // skipped so it can't re-enter history as an unanswered question, and a stray assistant with no
    // preceding member can never be mispaired — robust to any future turn shape. A turn counts only with
    // a real non-empty string answer. Both Mode-1 (chip) and Mode-2 turns pair the same way (unified
    // transcript). State is in memory only; the server holds no conversation store.
    for (let i = state.log.length - 2; i >= 0 && paired.length < HISTORY_MSG_CAP; i--) {
      const m = state.log[i], a = state.log[i + 1];
      if (m.kind === "member" && m.text &&
          a.kind === "assistant" && a.resp && typeof a.resp.answer === "string" && a.resp.answer) {
        paired.push({ role: "assistant", content: clamp(a.resp.answer) });
        paired.push({ role: "user", content: clamp(m.text) });
      }
    }
    const trimmedHistory = paired.reverse();                 // back to oldest-first
    state.log.push({ kind: "member", text: message });
    const pending = { kind: "pending" };
    state.log.push(pending);
    renderConversation();

    const token = state.reqToken;
    const before = new Map(state.activeEscalations.map((e) => [e.escalation_id, e.level]));
    const r = await api("POST", `/members/${enc(id)}/ask`, { message, history: trimmedHistory },
      { what: "Answering your question" });
    if (token !== state.reqToken) return; // member switched mid-flight

    const idx = state.log.indexOf(pending);
    if (!r.ok) {
      // member-toned inline card (the banner above carries the specifics); the question is NOT lost —
      // it stays in the log, so "send it again" is a one-line action, not a re-type.
      if (idx >= 0) state.log[idx] = { kind: "error",
        text: "That didn't go through — the answer couldn't be completed. Your results are unaffected; please try sending your question again in a few seconds." };
      renderReadout(r.data); renderConversation(); state.asking = false; updateAskDisabled(); return;
    }
    const turn = { kind: "assistant", resp: r.data, isTransition: false, takeoverLevel: null };
    if (idx >= 0) state.log[idx] = turn;
    renderConversation();
